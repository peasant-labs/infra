required_names:
  - initial-commit-and-bundle
  - deterministic-commit
  - breaking-release-title
  - unchanged-release-branch
  - unchanged-after-main-advances
  - new-pending-content
  - unsafe-current-branch-rebuilt
  - unrelated-current-branch-rebuilt
  - mode-changed-current-branch-rebuilt
  - conflicting-current-branch-rebuilt
  - empty-required-rejected
  - version-only-release-rejected
  - dirty-unrelated
  - staged-unrelated
  - untracked-unrelated
  - dirty-version-document
  - assume-unchanged-refused
  - skip-worktree-refused
  - alternate-index-refused
  - staged-bytes-tampering-refused
  - tree-race-tampering-refused
  - bad-current-ref
  - missing-version-source
  - invalid-version-source
  - missing-source-branch
  - duplicate-configured-path
  - symlink-version-source
  - symlink-parent-directory
  - hardlink-version-source
  - unsafe-pathspec
  - protected-version-config-refused
  - protected-version-glob-config-refused
  - protected-tracked-and-added
  - protected-staged-refused
  - protected-untracked-symlink-refused
  - protected-version-dirty-config-refused
  - protected-files-with-freeze-plan
  - protected-files-forged-freeze-plan
  - protected-current-unchanged
  - protected-current-changed
  - protected-current-title-changed
  - freeze-outputs-and-multiple-surfaces
  - migration-freeze-floor-keeps-release-range
  - migration-freeze-floor-removed-refused
  - migration-freeze-floor-altered-refused
  - migration-freeze-floor-off-chain-refused
  - migration-no-freeze-floor-uses-full-range
  - migration-release-floor-still-bounds-content
  - freeze-outputs-alternate-directory
  - freeze-output-without-plan
  - freeze-output-outside-declared-set
  - freeze-output-missing-primary
  - freeze-output-secondary-not-primary
  - freeze-output-wrong-version
  - freeze-output-unchanged-primary
  - freeze-output-missing-second-surface
  - freeze-output-staged-refused
  - freeze-output-symlink-refused
  - freeze-output-forged-plan-refused
  - freeze-current-unchanged
  - freeze-current-working-file-changed
  - freeze-current-removed-output
  - freeze-current-missing-primary
  - freeze-current-without-plan-rebuilt
  - freeze-current-same-title-without-plan-rebuilt
  - wrong-checked-out-branch
  - bot-branch-at-wrong-tip
  - commit-plus-write-refused
  - commit-plus-check-refused
  - old-write-is-not-a-commit
cases:
  cases:
    - name: initial-commit-and-bundle
      input: {scenario: initial}
      expected: &initial-output
        exit: 0
        push: true
        version: "0.2.0"
        title: "release[minor]: v0.2.0"
        identity: "peasant-labs-releaser[bot] <peasant-labs-releaser[bot]@users.noreply.github.com>|peasant-labs-releaser[bot] <peasant-labs-releaser[bot]@users.noreply.github.com>"
        changelog: "# changelog\n\n## [v0.2.0] - $DATE\n\n- add facet\n"
        version_file: "{\"version\":\"0.2.0\"}\n"
      classification: must-pass
      provenance: {source: requirement, ref: "generated branch tree is committed and fetchable"}
      mutation: {description: "Create the first bot branch commit."}
    - {name: deterministic-commit, input: {scenario: deterministic}, expected: *initial-output, classification: must-pass, provenance: {source: requirement, ref: "identical source and generated content produce the same commit"}, mutation: {description: "Build the same release commit twice from the same source."}}
    - name: breaking-release-title
      input: {scenario: breaking}
      expected:
        <<: *initial-output
        title: "release![minor]: v0.2.0"
        changelog: "# changelog\n\n## [v0.2.0] - $DATE\n\n- add facet\n- incompatible fix (BREAKING)\n"
      classification: must-pass
      provenance: {source: requirement, ref: "a breaking release commit carries the formatted breaking title"}
      mutation: {description: "Include a breaking subject in the pending set."}
    - {name: unchanged-release-branch, input: {scenario: unchanged}, expected: {exit: 0, push: false, version: "0.2.0"}, classification: must-pass, provenance: {source: requirement, ref: "unchanged current release branch is a no-op"}, mutation: {description: "Compare against an existing fresh branch."}}
    - {name: unchanged-after-main-advances, input: {scenario: advanced}, expected: {exit: 0, push: false, version: "0.2.0"}, classification: must-pass, provenance: {source: requirement, ref: "a clean main advance need not rebuild the bot branch"}, mutation: {description: "Add an unrelated non-releasing commit on the source branch."}}
    - name: new-pending-content
      input: {scenario: later}
      expected:
        <<: *initial-output
        changelog: "# changelog\n\n## [v0.2.0] - $DATE\n\n- add facet\n- later fix\n"
      classification: must-pass
      provenance: {source: requirement, ref: "new releasing content rebuilds the branch"}
      mutation: {description: "Add a later releasing commit on the source branch."}
    - {name: unsafe-current-branch-rebuilt, input: {scenario: current-extra}, expected: *initial-output, classification: must-pass, provenance: {source: requirement, ref: "a branch with non-version edits cannot be treated as unchanged"}, mutation: {description: "Tamper with the existing branch version document."}}
    - {name: unrelated-current-branch-rebuilt, input: {scenario: current-unrelated}, expected: *initial-output, classification: must-pass, provenance: {source: requirement, ref: "a branch with unrelated edits cannot be treated as unchanged"}, mutation: {description: "Change unrelated source on the existing branch."}}
    - {name: mode-changed-current-branch-rebuilt, input: {scenario: current-mode}, expected: *initial-output, classification: must-pass, provenance: {source: requirement, ref: "a branch with file mode changes cannot be treated as unchanged"}, mutation: {description: "Change the generated document's executable bit on the existing branch."}}
    - {name: conflicting-current-branch-rebuilt, input: {scenario: current-conflict}, expected: *initial-output, classification: must-pass, provenance: {source: requirement, ref: "an unmergeable current branch must be rebuilt"}, mutation: {description: "Make the source and release branches conflict outside generated content."}}
    - {name: empty-required-rejected, input: {scenario: empty}, expected: {exit: 1, error: "no changes"}, classification: must-fail, sibling: initial-commit-and-bundle, provenance: {source: requirement, ref: "a required push cannot yield an empty bundle"}, mutation: {description: "Put generated content on the source tip already."}}
    - {name: version-only-release-rejected, input: {scenario: version-only}, expected: {exit: 1, error: "changelog"}, classification: must-fail, sibling: initial-commit-and-bundle, provenance: {source: requirement, ref: "a release commit must remain visible to the changelog-based candidate detector"}, mutation: {description: "Put the generated changelog on the source tip but leave the version stale."}}
    - {name: dirty-unrelated, input: {scenario: dirty}, expected: {exit: 1, error: "clean"}, classification: must-fail, sibling: initial-commit-and-bundle, provenance: {source: requirement, ref: "dirty unrelated content never gets staged"}, mutation: {description: "Modify an ordinary tracked file."}}
    - {name: staged-unrelated, input: {scenario: staged}, expected: {exit: 1, error: "clean"}, classification: must-fail, sibling: initial-commit-and-bundle, provenance: {source: requirement, ref: "pre-staged content is refused"}, mutation: {description: "Stage an unrelated tracked file."}}
    - {name: untracked-unrelated, input: {scenario: untracked}, expected: {exit: 1, error: "clean"}, classification: must-fail, sibling: initial-commit-and-bundle, provenance: {source: requirement, ref: "untracked content is refused"}, mutation: {description: "Create an untracked file."}}
    - {name: dirty-version-document, input: {scenario: json-dirty}, expected: {exit: 1, error: "clean"}, classification: must-fail, sibling: initial-commit-and-bundle, provenance: {source: requirement, ref: "non-version JSON edits are never committed"}, mutation: {description: "Change an ordinary field in the version document."}}
    - {name: assume-unchanged-refused, input: {scenario: assume-unchanged}, expected: {exit: 1, error: "index"}, classification: must-fail, sibling: initial-commit-and-bundle, provenance: {source: requirement, ref: "index flags cannot conceal dirty tracked files"}, mutation: {description: "Mark an unrelated path assume-unchanged and edit it."}}
    - {name: skip-worktree-refused, input: {scenario: skip-worktree}, expected: {exit: 1, error: "index"}, classification: must-fail, sibling: initial-commit-and-bundle, provenance: {source: requirement, ref: "sparse index flags cannot conceal tracked changes"}, mutation: {description: "Mark an unrelated path skip-worktree and edit it."}}
    - {name: alternate-index-refused, input: {scenario: alternate-index}, expected: {exit: 1, error: "GIT_INDEX_FILE"}, classification: must-fail, sibling: initial-commit-and-bundle, provenance: {source: requirement, ref: "preparation cannot write an inherited index outside its checkout"}, mutation: {description: "Pass an alternate index file through the process environment."}}
    - {name: staged-bytes-tampering-refused, input: {scenario: tamper-stage}, expected: {exit: 1, error: "staged bytes"}, classification: must-fail, sibling: initial-commit-and-bundle, provenance: {source: requirement, ref: "staged bytes must match the generated bytes exactly"}, mutation: {description: "Substitute a different changelog blob after the Git index update."}}
    - {name: tree-race-tampering-refused, input: {scenario: tamper-tree}, expected: {exit: 1, error: "tree"}, classification: must-fail, sibling: initial-commit-and-bundle, provenance: {source: requirement, ref: "the committed tree cannot acquire unrelated paths after index validation"}, mutation: {description: "Change an unrelated index entry immediately before the tree is written."}}
    - {name: bad-current-ref, input: {scenario: missing-current}, expected: {exit: 1, error: "current"}, classification: must-fail, sibling: initial-commit-and-bundle, provenance: {source: requirement, ref: "a failed current-ref read is not a new branch"}, mutation: {description: "Supply an absent current ref."}}
    - {name: missing-version-source, input: {scenario: missing-version}, expected: {exit: 1, error: "package.json"}, classification: must-fail, sibling: initial-commit-and-bundle, provenance: {source: requirement, ref: "a missing source document is an error"}, mutation: {description: "Remove the version document from the source tree."}}
    - {name: invalid-version-source, input: {scenario: invalid-version}, expected: {exit: 1, error: "package.json"}, classification: must-fail, sibling: initial-commit-and-bundle, provenance: {source: requirement, ref: "an invalid source document is an error"}, mutation: {description: "Remove the protected JSON field from the source tree."}}
    - {name: missing-source-branch, input: {scenario: missing-source}, expected: {exit: 1, error: "source branch"}, classification: must-fail, sibling: initial-commit-and-bundle, provenance: {source: requirement, ref: "a missing source ref fails closed"}, mutation: {description: "Point the command at a nonexistent source ref."}}
    - {name: duplicate-configured-path, input: {scenario: duplicate}, expected: {exit: 1, error: "duplicate"}, classification: must-fail, sibling: initial-commit-and-bundle, provenance: {source: requirement, ref: "a generated file has exactly one configured role"}, mutation: {description: "Configure the same version path twice."}}
    - {name: symlink-version-source, input: {scenario: symlink}, expected: {exit: 1, error: "symlink"}, classification: must-fail, sibling: initial-commit-and-bundle, provenance: {source: requirement, ref: "generated files must not be symlinks"}, mutation: {description: "Replace the tracked version document with a symlink."}}
    - {name: symlink-parent-directory, input: {scenario: symlink-parent}, expected: {exit: 1, error: "symlink"}, classification: must-fail, sibling: initial-commit-and-bundle, provenance: {source: requirement, ref: "generated file ancestors must not be symlinks"}, mutation: {description: "Route a configured file through a symlink directory."}}
    - {name: hardlink-version-source, input: {scenario: hardlink}, expected: {exit: 1, error: "hard link"}, classification: must-fail, sibling: initial-commit-and-bundle, provenance: {source: requirement, ref: "preparation cannot overwrite another file through a hard link"}, mutation: {description: "Link the version file to an outside file with identical bytes."}}
    - {name: unsafe-pathspec, input: {scenario: pathspec}, expected: {exit: 1, error: "unsafe"}, classification: must-fail, sibling: initial-commit-and-bundle, provenance: {source: requirement, ref: "configured paths are literal confined paths"}, mutation: {description: "Supply Git pathspec magic as the changelog."}}
    - {name: protected-version-config-refused, input: {scenario: protected}, expected: {exit: 2, error: "matches reserved path", code: config-invalid, details: [package.json]}, classification: must-fail, sibling: protected-tracked-and-added, provenance: {source: requirement, ref: "version documents cannot also be whole-file protected"}, mutation: {description: "List the configured version document as a protected path."}}
    - {name: protected-version-glob-config-refused, input: {scenario: protected-version-glob}, expected: {exit: 2, error: "matches reserved path", code: config-invalid, details: [package.json]}, classification: must-fail, sibling: protected-tracked-and-added, provenance: {source: requirement, ref: "a protected glob cannot match a version document"}, mutation: {description: "Protect a glob that matches the version document."}}
    - name: protected-tracked-and-added
      input: {scenario: protected-files}
      expected:
        <<: *initial-output
        paths: "CHANGELOG.md\ngenerated/types-0.2.0.json\npackage.json\nversions.go"
      classification: must-pass
      provenance: &protect_p {source: requirement, ref: "protected release content"}
      mutation: &protect_m {description: "Prepare a protected release output in the worktree."}
    - {name: protected-staged-refused, input: {scenario: protected-staged}, expected: {exit: 1, error: clean}, classification: must-fail, sibling: protected-tracked-and-added, provenance: *protect_p, mutation: *protect_m}
    - {name: protected-untracked-symlink-refused, input: {scenario: protected-symlink}, expected: {exit: 1, error: symlink}, classification: must-fail, sibling: protected-tracked-and-added, provenance: *protect_p, mutation: *protect_m}
    - name: protected-version-dirty-config-refused
      input: {scenario: protected-version-dirty}
      expected: {exit: 2, error: "matches reserved path", code: config-invalid, details: [package.json]}
      classification: must-fail
      sibling: protected-tracked-and-added
      provenance: *protect_p
      mutation: *protect_m
    - name: protected-files-with-freeze-plan
      input:
        scenario: protected-plan
        plan: &plan |
          plan: 1
          surfaces:
            - {name: local-api, label: Local API, from: 0.1.0, to: 0.2.0, level: minor, breaking: false, freeze: true}
      expected:
        <<: *initial-output
        title: "release(local-api)[minor]: v0.2.0, Local API 0.2.0"
        changelog: "# changelog\n\n## [v0.2.0] - $DATE\n\n- add facet\n- freeze changes\n"
        paths: "CHANGELOG.md\ngenerated/local-0.2.0.json\npackage.json\nversions.go"
      classification: must-pass
      provenance: *protect_p
      mutation: *protect_m
    - {name: protected-current-unchanged, input: {scenario: protected-current}, expected: {exit: 0, push: false, version: "0.2.0"}, classification: must-pass, provenance: *protect_p, mutation: *protect_m}
    - name: protected-current-changed
      input: {scenario: protected-current-changed}
      expected:
        <<: *initial-output
        paths: "CHANGELOG.md\ngenerated/types-0.2.0.json\npackage.json\nversions.go"
      classification: must-pass
      provenance: *protect_p
      mutation: *protect_m
    - name: protected-current-title-changed
      input:
        scenario: protected-current-plan
        plan: *plan
      expected:
        <<: *initial-output
        title: "release(local-api)[minor]: v0.2.0, Local API 0.2.0"
        changelog: "# changelog\n\n## [v0.2.0] - $DATE\n\n- add facet\n- freeze changes\n"
        paths: "CHANGELOG.md\ngenerated/local-0.2.0.json\npackage.json\nversions.go"
      classification: must-pass
      provenance: *protect_p
      mutation: *protect_m
    - name: protected-files-forged-freeze-plan
      input:
        scenario: protected-plan
        plan: |
          plan: 1
          surfaces:
            - {name: local-api, label: Local API, from: 0.1.0, to: 0.1.1, level: patch, breaking: false, freeze: true}
      expected: {exit: 1, error: "does not match"}
      sibling: protected-files-with-freeze-plan
      classification: must-fail
      provenance: *protect_p
      mutation: *protect_m
    - name: freeze-outputs-and-multiple-surfaces
      input:
        scenario: freeze-outputs
        plan: &multi_plan |
          plan: 1
          surfaces:
            - {name: api, label: API, from: 0.1.0, to: 0.2.0, level: minor, breaking: false, freeze: true}
            - {name: types, label: Types, from: 0.1.0, to: 0.1.1, level: patch, breaking: false, freeze: true}
        files: &freeze_files
          generated/api.json: "working after\n"
          generated/api-0.2.0.json: "frozen api\n"
          generated/types-0.1.1.yaml: "frozen types\n"
          registry.yaml: "registry after\n"
          mirrors/api.json: "mirror after\n"
      expected: &freeze_output
        <<: *initial-output
        title: "release(api,types)[minor]: v0.2.0, API 0.2.0, Types 0.1.1"
        changelog: "# changelog\n\n## [v0.2.0] - $DATE\n\n- add facet\n- freeze api\n- freeze types\n"
        paths: "CHANGELOG.md\ngenerated/api-0.2.0.json\ngenerated/api.json\ngenerated/types-0.1.1.yaml\nmirrors/api.json\npackage.json\nregistry.yaml"
      classification: must-pass
      provenance: &freeze_p {source: requirement, ref: "plan-gated freeze writer outputs and numbered primary documents"}
      mutation: &freeze_m {description: "Change the plan, dirty outputs, or current branch."}
    - name: migration-freeze-floor-keeps-release-range
      input:
        scenario: migration-floor
        migration: &migration_history
          pre_subject: "feat(local-api)[minor]: pre-migration feature"
          migration_subject: "chore: migrate working specs"
          post_subject: "fix(local-api)[patch]: post-migration fix"
          state: "status: 1\nsurfaces: [{name: local-api, label: Local API, frozen: 0.1.0, state: ahead}]\n"
        generate_floor: true
        generated_to: "0.1.1"
        files: {generated/local-0.1.1.json: "frozen spec\n"}
      expected:
        <<: *initial-output
        title: "release(local-api)[minor]: v0.2.0, Local API 0.1.1"
        changelog: "# changelog\n\n## [v0.2.0] - $DATE\n\n- pre-migration feature\n- post-migration fix\n"
        paths: "CHANGELOG.md\ngenerated/local-0.1.1.json\npackage.json"
      classification: must-pass
      provenance: &migration_p {source: requirement, ref: "real freeze-plan handoff and release commit keep distinct ranges"}
      mutation: &migration_m {description: "Change or remove the migration boundary carried by the generated plan."}
    - name: migration-freeze-floor-removed-refused
      input: {scenario: migration-floor, migration: *migration_history, generate_floor: true, generated_to: "0.1.1", plan_floor_action: omit, files: {generated/local-0.1.1.json: "frozen spec\n"}}
      expected: {exit: 1, error: "does not match"}
      classification: must-fail
      sibling: migration-freeze-floor-keeps-release-range
      provenance: *migration_p
      mutation: *migration_m
    - name: migration-freeze-floor-altered-refused
      input: {scenario: migration-floor, migration: *migration_history, generate_floor: true, generated_to: "0.1.1", plan_floor_action: base, files: {generated/local-0.1.1.json: "frozen spec\n"}}
      expected: {exit: 1, error: "does not match"}
      classification: must-fail
      sibling: migration-freeze-floor-keeps-release-range
      provenance: *migration_p
      mutation: *migration_m
    - name: migration-freeze-floor-off-chain-refused
      input: {scenario: migration-floor, migration: *migration_history, generate_floor: true, generated_to: "0.1.1", plan_floor_action: missing, files: {generated/local-0.1.1.json: "frozen spec\n"}}
      expected: {exit: 2, error: "floor-not-on-chain", code: floor-not-on-chain, details: ['freeze floor "not-on-chain"']}
      classification: must-fail
      sibling: migration-freeze-floor-keeps-release-range
      provenance: *migration_p
      mutation: *migration_m
    - name: migration-no-freeze-floor-uses-full-range
      input: {scenario: migration-floor, migration: *migration_history, generated_to: "0.2.0", files: {generated/local-0.2.0.json: "frozen spec\n"}}
      expected:
        <<: *initial-output
        title: "release(local-api)[minor]: v0.2.0, Local API 0.2.0"
        changelog: "# changelog\n\n## [v0.2.0] - $DATE\n\n- pre-migration feature\n- post-migration fix\n"
        paths: "CHANGELOG.md\ngenerated/local-0.2.0.json\npackage.json"
      classification: must-pass
      provenance: *migration_p
      mutation: *migration_m
    - name: migration-release-floor-still-bounds-content
      input: {scenario: migration-floor, migration: *migration_history, generate_floor: true, release_floor: true, generated_to: "0.1.1", files: {generated/local-0.1.1.json: "frozen spec\n"}}
      expected:
        <<: *initial-output
        version: "0.1.1"
        title: "release(local-api)[patch]: v0.1.1, Local API 0.1.1"
        changelog: "# changelog\n\n## [v0.1.1] - $DATE\n\n- post-migration fix\n"
        version_file: "{\"version\":\"0.1.1\"}\n"
        paths: "CHANGELOG.md\ngenerated/local-0.1.1.json\npackage.json"
      classification: must-pass
      provenance: *migration_p
      mutation: {description: "Set the separate recovery floor at migration; release content must use only the later patch."}
    - name: freeze-output-without-plan
      input: {scenario: freeze-outputs, files: *freeze_files}
      expected: {exit: 1, error: "unexpected path"}
      classification: must-fail
      sibling: freeze-outputs-and-multiple-surfaces
      provenance: *freeze_p
      mutation: *freeze_m
    - name: freeze-outputs-alternate-directory
      input:
        scenario: freeze-outputs
        freeze_dir: specs/contracts
        plan: *multi_plan
        files:
          specs/contracts/api.json: "working after\n"
          specs/contracts/api-0.2.0.json: "frozen api\n"
          specs/contracts/types-0.1.1.yaml: "frozen types\n"
          registry.yaml: "registry after\n"
          mirrors/api.json: "mirror after\n"
      expected:
        <<: *freeze_output
        paths: "CHANGELOG.md\nmirrors/api.json\npackage.json\nregistry.yaml\nspecs/contracts/api-0.2.0.json\nspecs/contracts/api.json\nspecs/contracts/types-0.1.1.yaml"
      classification: must-pass
      provenance: *freeze_p
      mutation: *freeze_m
    - name: freeze-output-outside-declared-set
      input:
        scenario: freeze-outputs
        plan: *multi_plan
        files:
          <<: *freeze_files
          other.txt: "unexpected\n"
      expected: {exit: 1, error: "unexpected path", details: [other.txt]}
      classification: must-fail
      sibling: freeze-outputs-and-multiple-surfaces
      provenance: *freeze_p
      mutation: *freeze_m
    - name: freeze-output-missing-primary
      input:
        scenario: freeze-outputs
        plan: *multi_plan
        files: {generated/api.json: "working after\n", generated/types-0.1.1.yaml: "frozen types\n"}
      expected: {exit: 2, error: "freeze-output-missing", code: freeze-output-missing, details: [api, "generated/api-0.2.0."]}
      classification: must-fail
      sibling: freeze-outputs-and-multiple-surfaces
      provenance: *freeze_p
      mutation: *freeze_m
    - name: freeze-output-secondary-not-primary
      input:
        scenario: freeze-outputs
        plan: *multi_plan
        files: {generated/request-0.2.0.json: "secondary\n", generated/types-0.1.1.yaml: "frozen types\n"}
      expected: {exit: 2, error: "freeze-output-missing", code: freeze-output-missing, details: [api, "generated/api-0.2.0."]}
      classification: must-fail
      sibling: freeze-outputs-and-multiple-surfaces
      provenance: *freeze_p
      mutation: *freeze_m
    - name: freeze-output-wrong-version
      input:
        scenario: freeze-outputs
        plan: *multi_plan
        files: {generated/api-0.1.0.json: "old\n", generated/types-0.1.1.yaml: "frozen types\n"}
      expected: {exit: 2, error: "freeze-output-missing", code: freeze-output-missing, details: [api, "generated/api-0.2.0."]}
      classification: must-fail
      sibling: freeze-outputs-and-multiple-surfaces
      provenance: *freeze_p
      mutation: *freeze_m
    - name: freeze-output-unchanged-primary
      input:
        scenario: freeze-outputs
        plan: *multi_plan
        base_files: {generated/api-0.2.0.json: "already present\n"}
        files: {generated/api-0.2.0.json: "already present\n", generated/types-0.1.1.yaml: "frozen types\n"}
      expected: {exit: 2, error: "freeze-output-missing", code: freeze-output-missing, details: [api, "generated/api-0.2.0."]}
      classification: must-fail
      sibling: freeze-outputs-and-multiple-surfaces
