required_names:
  - comment
  - reviewed-script
  - assets
  - draft-assets
  - draft-assets-missing-draft-input
  - draft-assets-false-draft-input
  - published-assets-true-draft-input
  - schema-draft-assets
  - draft-assets-create-only
  - draft-assets-publish-ungated
  - published-assets-missing-latest
  - draft-assets-literal-latest
  - comment-bad-permissions
  - reviewed-script-overwrite
  - assets-expression
  - assets-missing-verifier
  - assets-expression-print-required
cases:
  cases:
    - name: comment
      input: { policy_case: accept-comment-job }
      expected: { exit: 0 }
      classification: must-pass
      provenance: { source: requirement, ref: "comment policy CLI" }
      mutation: { description: "Accept the listed comment workflow." }
    - name: reviewed-script
      input: { policy_case: accept-reviewed-script }
      expected: { exit: 0 }
      classification: must-pass
      provenance: { source: requirement, ref: "reviewed script CLI" }
      mutation: { description: "Accept the default-branch reviewed evidence script." }
    - name: assets
      input: { policy_case: accept-release-assets }
      expected: { exit: 0 }
      classification: must-pass
      provenance: { source: requirement, ref: "release assets CLI" }
      mutation: { description: "Accept the verified release artifact publisher." }
    - name: draft-assets
      input: { policy_case: accept-draft-release-assets }
      expected: { exit: 0 }
      classification: must-pass
      provenance: { source: requirement, ref: "immutable release assets CLI" }
      mutation: { description: "Accept draft creation, upload, and gated publication without make_latest on the action." }
    - name: draft-assets-missing-draft-input
      input: { policy_case: reject-draft-assets-input-missing }
      expected: { exit: 2, rule: credential-jobs-use-pinned-actions }
      sibling: draft-assets
      classification: must-fail
      provenance: { source: requirement, ref: "draft action input CLI" }
      mutation: { description: "Reject a draft upload without draft true." }
    - name: draft-assets-false-draft-input
      input: { policy_case: reject-draft-assets-input-false }
      expected: { exit: 2, rule: credential-jobs-use-pinned-actions }
      sibling: draft-assets
      classification: must-fail
      provenance: { source: requirement, ref: "draft action input CLI" }
      mutation: { description: "Reject a draft upload that disables draft mode." }
    - name: published-assets-true-draft-input
      input: { policy_case: reject-published-assets-draft-true }
      expected: { exit: 2, rule: credential-jobs-use-pinned-actions }
      sibling: assets
      classification: must-fail
      provenance: { source: requirement, ref: "published action draft input CLI" }
      mutation: { description: "Reject draft mode in the published-create flow." }
    - name: schema-draft-assets
      input: { policy_case: accept-schema-draft-release-assets }
      expected: { exit: 0 }
      classification: must-pass
      provenance: { source: requirement, ref: "schema-style release workflow CLI" }
      mutation: { description: "Accept the draft flow in the schema-style release workflow." }
    - name: draft-assets-create-only
      input: { policy_case: reject-draft-assets-create-only-gate }
      expected: { exit: 2, rule: credential-jobs-use-pinned-actions }
      sibling: draft-assets
      classification: must-fail
      provenance: { source: requirement, ref: "draft upload gate CLI" }
      mutation: { description: "Reject an upload gate missing view failure." }
    - name: draft-assets-publish-ungated
      input: { policy_case: reject-draft-assets-publish-ungated }
      expected: { exit: 2, rule: credential-jobs-use-pinned-actions }
      sibling: draft-assets
      classification: must-fail
      provenance: { source: requirement, ref: "draft publish gate CLI" }
      mutation: { description: "Reject an ungated publish edit." }
    - name: published-assets-missing-latest
      input: { policy_case: reject-published-assets-missing-latest }
      expected: { exit: 2, rule: credential-jobs-use-pinned-actions }
      sibling: assets
      classification: must-fail
      provenance: { source: requirement, ref: "published action latest input CLI" }
      mutation: { description: "Keep latest required in the existing published-create flow." }
    - name: draft-assets-literal-latest
      input: { policy_case: reject-draft-assets-literal-latest }
      expected: { exit: 2, rule: credential-jobs-use-pinned-actions }
      sibling: draft-assets
      classification: must-fail
      provenance: { source: requirement, ref: "draft action latest input CLI" }
      mutation: { description: "Reject a literal optional latest value." }
    - name: comment-bad-permissions
      input: { policy_case: reject-comment-job-no-contents }
      expected: { exit: 2, rule: credential-jobs-use-pinned-actions }
      sibling: comment
      classification: must-fail
      provenance: { source: requirement, ref: "comment policy CLI" }
      mutation: { description: "Reject an inherited comment token permission." }
    - name: reviewed-script-overwrite
      input: { policy_case: reject-reviewed-script-artifact-overwrite }
      expected: { exit: 2, rule: credential-steps-run-one-template }
      sibling: reviewed-script
      classification: must-fail
      provenance: { source: requirement, ref: "reviewed script CLI" }
      mutation: { description: "Reject an artifact that can overwrite the script." }
    - name: assets-expression
      input: { policy_case: reject-release-assets-glob-expression }
      expected: { exit: 2, rule: credential-jobs-use-pinned-actions }
      sibling: assets
      classification: must-fail
      provenance: { source: requirement, ref: "release assets CLI" }
      mutation: { description: "Reject an expression selecting assets." }
    - name: assets-missing-verifier
      input: { policy_case: reject-tag-publish-assets-no-verify }
      expected: { exit: 2, rule: tag-publish-verifies-the-tag }
      sibling: assets
      classification: must-fail
      provenance: { source: requirement, ref: "tag verification CLI" }
      mutation: { description: "Reject a publisher that does not need its tag verifier." }
    - name: assets-expression-print-required
      input: { policy_case: reject-release-assets-glob-expression, print_required: true }
      expected: { exit: 2, rule: credential-jobs-use-pinned-actions }
      sibling: assets
      classification: must-fail
      provenance: { source: requirement, ref: "print-required policy verdict" }
      mutation: { description: "Print required contexts while retaining the rejection." }
