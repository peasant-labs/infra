required_names:
  - comment
  - reviewed-script
  - comment-bad-permissions
  - reviewed-script-overwrite
  - assets
  - schema-assets
  - assets-upload-action
  - assets-create-plus-action
  - assets-two-creates
  - assets-without-draft
  - assets-glob-not-asset
  - assets-command-substitution
  - assets-publish-ungated
  - assets-publish-no-repo
  - assets-publish-latest-missing
  - schema-draft-latest-wrong-comparison
  - schema-draft-prerelease-guard-mismatch
  - assets-missing-verifier
  - assets-substitution-print-required
cases:
  cases:
    - name: comment
      input: { policy_case: accept-comment-job }
      expected: { exit: 0 }
      classification: must-pass
      provenance: { source: requirement, ref: "comment policy CLI" }
      mutation: { description: "Accept the listed comment workflow." }
    - name: reviewed-script
      input: { policy_case: accept-reviewed-script }
      expected: { exit: 0 }
      classification: must-pass
      provenance: { source: requirement, ref: "reviewed script CLI" }
      mutation: { description: "Accept the default-branch reviewed evidence script." }
    - name: comment-bad-permissions
      input: { policy_case: reject-comment-job-no-contents }
      expected: { exit: 2, rule: credential-jobs-use-pinned-actions }
      sibling: comment
      classification: must-fail
      provenance: { source: requirement, ref: "comment policy CLI" }
      mutation: { description: "Reject an inherited comment token permission." }
    - name: reviewed-script-overwrite
      input: { policy_case: reject-reviewed-script-artifact-overwrite }
      expected: { exit: 2, rule: credential-steps-run-one-template }
      sibling: reviewed-script
      classification: must-fail
      provenance: { source: requirement, ref: "reviewed script CLI" }
      mutation: { description: "Reject an artifact that can overwrite the script." }
    - name: assets
      input: { policy_case: accept-atomic-release-assets }
      expected: { exit: 0 }
      classification: must-pass
      provenance: { source: requirement, ref: "atomic release assets CLI" }
      mutation: { description: "Accept one atomic gh release create --draft with the assets, then a gated publish." }
    - name: schema-assets
      input: { policy_case: accept-schema-atomic-release-assets }
      expected: { exit: 0 }
      classification: must-pass
      provenance: { source: requirement, ref: "schema-style release workflow CLI" }
      mutation: { description: "Accept the atomic draft flow in the schema-style release workflow." }
    - name: assets-upload-action
      input: { policy_case: reject-release-upload-action }
      expected: { exit: 2, rule: credential-jobs-use-pinned-actions }
      sibling: assets
      classification: must-fail
      provenance: { source: requirement, ref: "release-upload action CLI" }
      mutation: { description: "Reject a release-upload action in a credential job." }
    - name: assets-create-plus-action
      input: { policy_case: reject-atomic-assets-create-plus-action }
      expected: { exit: 2, rule: release-assets-one-atomic-create }
      sibling: assets
      classification: must-fail
      provenance: { source: requirement, ref: "one release creator CLI" }
      mutation: { description: "Reject an upload action beside the atomic create." }
    - name: assets-two-creates
      input: { policy_case: reject-atomic-assets-two-creates }
      expected: { exit: 2, rule: release-assets-one-atomic-create }
      sibling: assets
      classification: must-fail
      provenance: { source: requirement, ref: "one release creator CLI" }
      mutation: { description: "Reject a second gh release create in the publish job." }
    - name: assets-without-draft
      input: { policy_case: reject-atomic-assets-without-draft }
      expected: { exit: 2, rule: credential-steps-run-one-template }
      sibling: assets
      classification: must-fail
      provenance: { source: requirement, ref: "atomic draft CLI" }
      mutation: { description: "Reject an atomic create that does not leave a draft." }
    - name: assets-glob-not-asset
      input: { policy_case: reject-atomic-assets-glob-not-asset }
      expected: { exit: 2, rule: credential-steps-run-one-template }
      sibling: assets
      classification: must-fail
      provenance: { source: requirement, ref: "asset glob position CLI" }
      mutation: { description: "Reject a glob outside the asset position." }
    - name: assets-command-substitution
      input: { policy_case: reject-atomic-assets-command-substitution }
      expected: { exit: 2, rule: credential-steps-run-one-template }
      sibling: assets
      classification: must-fail
      provenance: { source: requirement, ref: "asset words CLI" }
      mutation: { description: "Reject command substitution selecting assets." }
    - name: assets-publish-ungated
      input: { policy_case: reject-atomic-assets-publish-ungated }
      expected: { exit: 2, rule: release-assets-one-atomic-create }
      sibling: assets
      classification: must-fail
      provenance: { source: requirement, ref: "publish gate CLI" }
      mutation: { description: "Reject a publish edit not gated on create success." }
    - name: assets-publish-no-repo
      input: { policy_case: reject-atomic-assets-publish-no-repo }
      expected: { exit: 2, rule: release-assets-one-atomic-create }
      sibling: assets
      classification: must-fail
      provenance: { source: requirement, ref: "publish repository CLI" }
      mutation: { description: "Reject a publish edit without an explicit repository." }
    - name: assets-publish-latest-missing
      input: { policy_case: reject-atomic-assets-publish-latest-missing }
      expected: { exit: 2, rule: release-assets-one-atomic-create }
      sibling: assets
      classification: must-fail
      provenance: { source: requirement, ref: "publish latest CLI" }
      mutation: { description: "Reject a publish edit without the latest decision." }
    - name: schema-draft-latest-wrong-comparison
      input: { policy_case: reject-schema-draft-latest-wrong-comparison }
      expected: { exit: 2, rule: release-assets-one-atomic-create }
      sibling: schema-assets
      classification: must-fail
      provenance: { source: requirement, ref: "schema release kind CLI" }
      mutation: { description: "Reject a latest comparison that differs from the guard's output." }
    - name: schema-draft-prerelease-guard-mismatch
      input: { policy_case: reject-schema-draft-prerelease-guard-mismatch }
      expected: { exit: 2, rule: release-assets-one-atomic-create }
      sibling: schema-assets
      classification: must-fail
      provenance: { source: requirement, ref: "schema release kind CLI" }
      mutation: { description: "Reject a prerelease comparison that differs from the guard's output." }
    - name: assets-missing-verifier
      input: { policy_case: reject-tag-publish-assets-no-verify }
      expected: { exit: 2, rule: tag-publish-verifies-the-tag }
      sibling: assets
      classification: must-fail
      provenance: { source: requirement, ref: "tag verification CLI" }
      mutation: { description: "Reject a publisher that does not need its tag verifier." }
    - name: assets-substitution-print-required
      input: { policy_case: reject-atomic-assets-command-substitution, print_required: true }
      expected: { exit: 2, rule: credential-steps-run-one-template }
      sibling: assets
      classification: must-fail
      provenance: { source: requirement, ref: "print-required policy verdict" }
      mutation: { description: "Print required contexts while retaining the rejection." }
