required_names:
  - comment
  - reviewed-script
  - comment-bad-permissions
  - reviewed-script-overwrite
  - assets
  - schema-assets
  - assets-upload-action
  - assets-plus-upload-action
  - assets-two-publishers
  - assets-retired-gh-publisher
  - assets-build-after-download
  - assets-rehearse
  - assets-publish-step-if
  - assets-repo-overridden
  - assets-latest-other-job
  - schema-publisher-latest-wrong-comparison
  - schema-retired-gh-publisher
  - assets-missing-verifier
  - assets-substitution-print-required
cases:
  cases:
    - name: comment
      input: { policy_case: accept-comment-job }
      expected: { exit: 0 }
      classification: must-pass
      provenance: { source: requirement, ref: "comment policy CLI" }
      mutation: { description: "Accept the listed comment workflow." }
    - name: reviewed-script
      input: { policy_case: accept-reviewed-script }
      expected: { exit: 0 }
      classification: must-pass
      provenance: { source: requirement, ref: "reviewed script CLI" }
      mutation: { description: "Accept the default-branch reviewed evidence script." }
    - name: comment-bad-permissions
      input: { policy_case: reject-comment-job-no-contents }
      expected: { exit: 2, rule: credential-jobs-use-pinned-actions }
      sibling: comment
      classification: must-fail
      provenance: { source: requirement, ref: "comment policy CLI" }
      mutation: { description: "Reject an inherited comment token permission." }
    - name: reviewed-script-overwrite
      input: { policy_case: reject-reviewed-script-artifact-overwrite }
      expected: { exit: 2, rule: credential-steps-run-one-template }
      sibling: reviewed-script
      classification: must-fail
      provenance: { source: requirement, ref: "reviewed script CLI" }
      mutation: { description: "Reject an artifact that can overwrite the script." }
    - name: assets
      input: { policy_case: accept-atomic-release-assets }
      expected: { exit: 0 }
      classification: must-pass
      provenance: { source: requirement, ref: "atomic release assets CLI" }
      mutation: { description: "Accept the five-step publisher: tool checkout, setup-go, build, release-dist download, publish-release." }
    - name: schema-assets
      input: { policy_case: accept-schema-atomic-release-assets }
      expected: { exit: 0 }
      classification: must-pass
      provenance: { source: requirement, ref: "schema-style release workflow CLI" }
      mutation: { description: "Accept the publisher in the schema-style release workflow, with --require-immutable." }
    - name: assets-upload-action
      input: { policy_case: reject-release-upload-action }
      expected: { exit: 2, rule: credential-jobs-use-pinned-actions }
      sibling: assets
      classification: must-fail
      provenance: { source: requirement, ref: "release-upload action CLI" }
      mutation: { description: "Reject a release-upload action in a credential job." }
    - name: assets-plus-upload-action
      input: { policy_case: reject-publisher-plus-upload-action }
      expected: { exit: 2, rule: release-assets-one-atomic-create }
      sibling: assets
      classification: must-fail
      provenance: { source: requirement, ref: "one release publisher CLI" }
      mutation: { description: "Reject an upload action beside the publisher." }
    - name: assets-two-publishers
      input: { policy_case: reject-publisher-two-publishers }
      expected: { exit: 2, rule: release-assets-one-atomic-create }
      sibling: assets
      classification: must-fail
      provenance: { source: requirement, ref: "one release publisher CLI" }
      mutation: { description: "Reject a second publish-release in the job." }
    - name: assets-retired-gh-publisher
      input: { policy_case: reject-retired-gh-assets-publisher }
      expected: { exit: 2, rule: release-assets-one-atomic-create }
      sibling: assets
      classification: must-fail
      provenance: { source: requirement, ref: "retired gh asset publisher CLI" }
      mutation: { description: "Reject the retired gh release create-with-assets publisher." }
    - name: assets-build-after-download
      input: { policy_case: reject-publisher-build-after-download }
      expected: { exit: 2, rule: release-assets-one-atomic-create }
      sibling: assets
      classification: must-fail
      provenance: { source: requirement, ref: "publisher order CLI" }
      mutation: { description: "Reject a tool build after the release artifact download." }
    - name: assets-rehearse
      input: { policy_case: reject-publisher-rehearse }
      expected: { exit: 2, rule: credential-steps-run-one-template }
      sibling: assets
      classification: must-fail
      provenance: { source: requirement, ref: "rehearsal refused in workflows CLI" }
      mutation: { description: "Reject --rehearse in a workflow." }
    - name: assets-publish-step-if
      input: { policy_case: reject-publisher-step-if }
      expected: { exit: 2, rule: release-assets-one-atomic-create }
      sibling: assets
      classification: must-fail
      provenance: { source: requirement, ref: "publisher steps unconditional CLI" }
      mutation: { description: "Reject an if on the publish step." }
    - name: assets-repo-overridden
      input: { policy_case: reject-publisher-repo-overridden }
      expected: { exit: 2, rule: credential-steps-run-one-template }
      sibling: assets
      classification: must-fail
      provenance: { source: requirement, ref: "publisher repository CLI" }
      mutation: { description: "Reject an overridden repository." }
    - name: assets-latest-other-job
      input: { policy_case: reject-publisher-latest-other-job }
      expected: { exit: 2, rule: credential-steps-run-one-template }
      sibling: assets
      classification: must-fail
      provenance: { source: requirement, ref: "publisher latest binding CLI" }
      mutation: { description: "Reject a latest decision from another job." }
    - name: schema-publisher-latest-wrong-comparison
      input: { policy_case: reject-schema-publisher-latest-wrong-comparison }
      expected: { exit: 2, rule: credential-steps-run-one-template }
      sibling: schema-assets
      classification: must-fail
      provenance: { source: requirement, ref: "guard comparison binding CLI" }
      mutation: { description: "Reject the prerelease comparison as the latest flag." }
    - name: schema-retired-gh-publisher
      input: { policy_case: reject-retired-schema-gh-publisher }
      expected: { exit: 2, rule: release-assets-one-atomic-create }
      sibling: schema-assets
      classification: must-fail
      provenance: { source: requirement, ref: "retired schema gh publisher CLI" }
      mutation: { description: "Reject schema's current seven-step gh publisher." }
    - name: assets-missing-verifier
      input: { policy_case: reject-tag-publish-assets-no-verify }
      expected: { exit: 2, rule: tag-publish-verifies-the-tag }
      sibling: assets
      classification: must-fail
      provenance: { source: requirement, ref: "tag verification CLI" }
      mutation: { description: "Reject a publisher that does not need its tag verifier." }
    - name: assets-substitution-print-required
      input: { policy_case: reject-publisher-rehearse, print_required: true }
      expected: { exit: 2, rule: credential-steps-run-one-template }
      sibling: assets
      classification: must-fail
      provenance: { source: requirement, ref: "print-required policy verdict" }
      mutation: { description: "Print required contexts while retaining the rejection." }
