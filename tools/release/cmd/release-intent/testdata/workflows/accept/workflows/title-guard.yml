name: Title guard
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  merge_group:
jobs:
  title-guard:
    runs-on: ubuntu-latest
    steps:
      - run: release-intent classify --author x --head-branch y --rev z
      - run: release-intent check-title --base x --head y --author z --head-branch w
