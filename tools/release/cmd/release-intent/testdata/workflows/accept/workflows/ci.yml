name: CI
on:
  pull_request:
  merge_group:
concurrency:
  group: ci-${{ github.ref }}
permissions:
  contents: read
jobs:
  lib:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - run: make lib
  merge-gate:
    if: always()
    needs: [lib]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - run: echo gate
