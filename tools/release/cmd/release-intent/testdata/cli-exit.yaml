required_names:
  - group-pr-queue-ref
  - group-pr-non-queue-empty
  - group-pr-missing-flag
  - classify-release-kind
  - classify-ordinary
  - classify-missing-branch
  - classify-invalid-config
  - classify-head-tamper-ordinary
  - check-config-valid
  - check-config-unknown-key
  - check-config-missing-file
  - queue-gate-arm
  - queue-gate-hold
  - queue-gate-arm-never-release
  - queue-gate-arm-behind
  - queue-gate-hold-unparsable
  - queue-gate-malformed
  - queue-gate-null-queue
  - queue-gate-missing-total
  - queue-gate-count-mismatch
  - queue-gate-errors-array
  - queue-gate-more-than-listed
  - queue-gate-missing-queue
  - check-title-missing-branch
  - check-title-accept
  - check-title-reject
  - check-workflows-accept
  - check-workflows-default-policy
  - check-workflows-violation
  - check-workflows-print-required
  - check-workflows-missing-dir
  - plan-missing-mode
  - plan-unreadable-branch
  - plan-accept-open-pr
  - plan-empty-floor-and-mode
  - plan-bad-subject
  - plan-empty-release-plans
  - release-pr-write-accept
  - release-pr-write-empty
  - release-pr-write-current-same
  - release-pr-write-current-clean-tip
  - release-pr-write-current-differs
  - release-pr-write-current-conflict
  - release-pr-write-current-unreadable
  - release-pr-needs-write-or-check
  - release-pr-check-with-current
  - no-subcommand
  - unknown-subcommand
  - unknown-flag
  - flag-of-another-command
  - flag-missing-value
  - flag-like-value
  - plan-bad-verdict
  - plan-empty-verdict
  - plan-bad-mode
  - queue-gate-bad-release-pr

cases:
  cases:
    - name: group-pr-queue-ref
      input: {argv: ["group-pr", "--ref", "refs/heads/gh-readonly-queue/main/pr-12-abc123"], stdin: "", setup: "none", githubOutput: true}
      expected: {exit: 0, stdout: ["pr=12"]}
      classification: must-pass
      provenance: {source: requirement, ref: "group-pr prints the entry PR number"}
      mutation: {description: "Baseline group-pr accept path at process level."}
    - name: group-pr-non-queue-empty
      input: {argv: ["group-pr", "--ref", "refs/heads/main"], stdin: "", setup: "none"}
      expected: {exit: 0, stdout: ["pr="]}
      classification: must-pass
      provenance: {source: requirement, ref: "non-queue refs print an empty PR number with exit 0"}
      mutation: {description: "Uses a non-queue ref, which must not fail."}
    - name: group-pr-missing-flag
      input: {argv: ["group-pr"], stdin: "", setup: "none"}
      expected: {exit: 1, stdout: []}
      classification: must-fail
      sibling: group-pr-queue-ref
      provenance: {source: boundary, ref: "usage errors exit 1"}
      mutation: {description: "Omits the required --ref flag."}
    - name: classify-release-kind
      input: {argv: ["classify", "--author", "SETUP_BOT_AUTHOR", "--head-branch", "SETUP_RELEASE_BRANCH", "--rev", "SETUP_REV"], stdin: "", setup: "classify-all-bots"}
      expected: {exit: 0, stdout: ["kind=release"]}
      classification: must-pass
      provenance: {source: requirement, ref: "classify prints the bot-branch kind from the base revision"}
      mutation: {description: "Classifies the release bot branch at process level."}
    - name: classify-ordinary
      input: {argv: ["classify", "--author", "octocat", "--head-branch", "SETUP_RELEASE_BRANCH", "--rev", "SETUP_REV"], stdin: "", setup: "classify-all-bots"}
      expected: {exit: 0, stdout: ["kind=ordinary"]}
      classification: must-pass
      provenance: {source: requirement, ref: "a human author on a bot branch is ordinary"}
      mutation: {description: "Classifies a non-bot author on the release branch."}
    - name: classify-missing-branch
      input: {argv: ["classify", "--author", "octocat", "--rev", "abc123"], stdin: "", setup: "none"}
      expected: {exit: 1, stdout: []}
      classification: must-fail
      sibling: classify-release-kind
      provenance: {source: boundary, ref: "classify requires --head-branch"}
      mutation: {description: "Omits the required --head-branch flag."}
    - name: classify-invalid-config
      input: {argv: ["classify", "--author", "octocat", "--head-branch", "feature/work", "--rev", "SETUP_REV"], stdin: "", setup: "classify-raw-config", rawConfig: "releases: true\ntag_prefix: v\nbogus_key: true\n"}
      expected: {exit: 2, stdout: ["error=config-invalid"]}
      classification: must-fail
      sibling: classify-release-kind
      provenance: {source: requirement, ref: "an invalid release config exits 2 with a typed line"}
      mutation: {description: "Reads an unknown-key config at the given revision."}
    - name: classify-head-tamper-ordinary
      input: {argv: ["classify", "--author", "SETUP_BOT_AUTHOR", "--head-branch", "SETUP_HEAD_RELEASE_BRANCH", "--rev", "SETUP_BASE"], stdin: "", setup: "classify-head-tamper"}
      expected: {exit: 0, stdout: ["kind=ordinary"]}
      classification: must-pass
      provenance: {source: requirement, ref: "the base config judges the kind, not the head config"}
      mutation: {description: "Queries a branch the head config maps to release while the base does not."}
    - name: check-config-valid
      input: {argv: ["check-config", "--config", "SETUP_CONFIG"], stdin: "", setup: "config-valid"}
      expected: {exit: 0, stdout: ["ok=true"]}
      classification: must-pass
      provenance: {source: requirement, ref: "a valid release config is accepted"}
      mutation: {description: "Uses a minimal valid release config file."}
    - name: check-config-unknown-key
      input: {argv: ["check-config", "--config", "SETUP_CONFIG"], stdin: "", setup: "config-raw", githubOutput: true, rawConfig: "releases: true\ntag_prefix: v\nbogus_key: true\n"}
      expected: {exit: 2, stdout: ["error=config-invalid"]}
      classification: must-fail
      sibling: check-config-valid
      provenance: {source: requirement, ref: "an invalid release config exits 2 with a typed line"}
      mutation: {description: "Uses a config with an unknown top-level key."}
    - name: check-config-missing-file
      input: {argv: ["check-config", "--config", "SETUP/does-not-exist.yaml"], stdin: "", setup: "none"}
      expected: {exit: 1, stdout: []}
      classification: must-fail
      sibling: check-config-valid
      provenance: {source: boundary, ref: "unreadable config inputs exit 1"}
      mutation: {description: "Points at a config file that does not exist."}
    - name: queue-gate-arm
      input: {argv: ["queue-gate", "--queue", "SETUP_QUEUE", "--release-pr", "9"], stdin: "", setup: "queue", queueFile: "empty.json"}
      expected: {exit: 0, stdout: ["gate=arm"]}
      classification: must-pass
      provenance: {source: requirement, ref: "an empty queue arms the gate"}
      mutation: {description: "Baseline queue-gate accept path at process level."}
    - name: queue-gate-hold
      input: {argv: ["queue-gate", "--queue", "SETUP_QUEUE", "--release-pr", "9"], stdin: "", setup: "queue", queueFile: "releasing-ahead.json"}
      expected: {exit: 0, stdout: ["gate=hold"]}
      classification: must-pass
      provenance: {source: requirement, ref: "a releasing title ahead of the release PR holds the gate"}
      mutation: {description: "Puts a releasing entry ahead of the release PR."}
    - name: queue-gate-arm-never-release
      input: {argv: ["queue-gate", "--queue", "SETUP_QUEUE", "--release-pr", "9"], stdin: "", setup: "queue", queueFile: "never-release-ahead.json"}
      expected: {exit: 0, stdout: ["gate=arm"]}
      classification: must-pass
      provenance: {source: requirement, ref: "a never-release title ahead arms the gate"}
      mutation: {description: "Puts a docs entry ahead of the release PR."}
    - name: queue-gate-arm-behind
      input: {argv: ["queue-gate", "--queue", "SETUP_QUEUE", "--release-pr", "9"], stdin: "", setup: "queue", queueFile: "releasing-behind.json"}
      expected: {exit: 0, stdout: ["gate=arm"]}
      classification: must-pass
      provenance: {source: requirement, ref: "a releasing title behind the release PR arms the gate"}
      mutation: {description: "Puts the releasing entry behind the release PR position."}
    - name: queue-gate-hold-unparsable
      input: {argv: ["queue-gate", "--queue", "SETUP_QUEUE", "--release-pr", "9"], stdin: "", setup: "queue", queueFile: "unparsable-ahead.json"}
      expected: {exit: 0, stdout: ["gate=hold"]}
      classification: must-pass
      provenance: {source: requirement, ref: "an unparsable title ahead holds the gate"}
      mutation: {description: "Puts an unparsable title ahead of the release PR."}
    - name: queue-gate-malformed
      input: {argv: ["queue-gate", "--queue", "SETUP_QUEUE", "--release-pr", "9"], stdin: "", setup: "queue", queueFile: "malformed.json"}
      expected: {exit: 1, stdout: [], absent_keys: [gate]}
      classification: must-fail
      sibling: queue-gate-arm
      provenance: {source: requirement, ref: "a malformed queue file exits 1 with no gate line"}
      mutation: {description: "Uses truncated JSON, which must not arm or disarm."}
    - name: queue-gate-null-queue
      input: {argv: ["queue-gate", "--queue", "SETUP_QUEUE", "--release-pr", "9"], stdin: "", setup: "queue", queueFile: "null-queue.json"}
      expected: {exit: 1, stdout: [], absent_keys: [gate]}
      classification: must-fail
      sibling: queue-gate-arm
      provenance: {source: requirement, ref: "a null merge queue is a failed read, never an empty queue"}
      mutation: {description: "Uses a null mergeQueue body."}
    - name: queue-gate-missing-total
      input: {argv: ["queue-gate", "--queue", "SETUP_QUEUE", "--release-pr", "9"], stdin: "", setup: "queue", queueFile: "missing-total.json"}
      expected: {exit: 1, stdout: [], absent_keys: [gate]}
      classification: must-fail
      sibling: queue-gate-arm
      provenance: {source: requirement, ref: "a missing entry total is a failed read"}
      mutation: {description: "Omits totalCount from the entries object."}
    - name: queue-gate-count-mismatch
      input: {argv: ["queue-gate", "--queue", "SETUP_QUEUE", "--release-pr", "9"], stdin: "", setup: "queue", queueFile: "count-mismatch.json"}
      expected: {exit: 1, stdout: [], absent_keys: [gate]}
      classification: must-fail
      sibling: queue-gate-arm
      provenance: {source: requirement, ref: "a total the nodes do not match is a failed read"}
      mutation: {description: "Lists one node with totalCount two on a complete page."}
    - name: queue-gate-errors-array
      input: {argv: ["queue-gate", "--queue", "SETUP_QUEUE", "--release-pr", "9"], stdin: "", setup: "queue", queueFile: "errors-array.json"}
      expected: {exit: 1, stdout: [], absent_keys: [gate]}
      classification: must-fail
      sibling: queue-gate-arm
      provenance: {source: requirement, ref: "a GraphQL errors array is a failed read"}
      mutation: {description: "Carries a GraphQL errors array."}
    - name: queue-gate-more-than-listed
      input: {argv: ["queue-gate", "--queue", "SETUP_QUEUE", "--release-pr", "9"], stdin: "", setup: "queue", queueFile: "more-than-listed.json"}
      expected: {exit: 1, stdout: [], absent_keys: [gate]}
      classification: must-fail
      sibling: queue-gate-arm
      provenance: {source: requirement, ref: "a cut page with more entries than listed is a failed read"}
      mutation: {description: "Sets hasNextPage true with fewer nodes than totalCount."}
    - name: queue-gate-missing-queue
      input: {argv: ["queue-gate", "--release-pr", "9"], stdin: "", setup: "none"}
      expected: {exit: 1, stdout: []}
      classification: must-fail
      sibling: queue-gate-arm
      provenance: {source: boundary, ref: "queue-gate requires --queue"}
      mutation: {description: "Omits the required --queue flag."}
    - name: check-title-missing-branch
      input: {argv: ["check-title", "--base", "a", "--head", "b", "--author", "u"], stdin: "feat(x)[minor]: t\n", setup: "none"}
      expected: {exit: 1, stdout: []}
      classification: must-fail
      sibling: check-title-accept
      provenance: {source: boundary, ref: "check-title requires --head-branch"}
      mutation: {description: "Omits the required --head-branch flag."}
    - name: check-title-accept
      input: {argv: ["check-title", "--base", "SETUP_BASE", "--head", "SETUP_HEAD", "--author", "octocat", "--head-branch", "feature/work"], stdin: "feat(graph)[minor]: add facet\n", setup: "git-pending"}
      expected: {exit: 0, stdout: ["error="]}
      classification: must-pass
      provenance: {source: requirement, ref: "a releasing title with no protected change is accepted"}
      mutation: {description: "Runs the built binary in a temp repo with a good title."}
    - name: check-title-reject
      input: {argv: ["check-title", "--base", "SETUP_BASE", "--head", "SETUP_HEAD", "--author", "octocat", "--head-branch", "feature/work"], stdin: "feat(graph): add facet\n", setup: "git-pending"}
      expected: {exit: 2, stdout: ["error=missing-bump"]}
      classification: must-fail
      sibling: check-title-accept
      provenance: {source: requirement, ref: "a title missing its bump bracket exits 2"}
      mutation: {description: "Runs the built binary in a temp repo with a title missing its bracket."}
    - name: check-workflows-accept
      input: {argv: ["check-workflows", "--policy", "SETUP_POLICY", "--dir", "SETUP_WORKFLOWS"], stdin: "", setup: "workflows-accept"}
      expected: {exit: 0, stdout: ["ok=true"]}
      classification: must-pass
      provenance: {source: requirement, ref: "workflows satisfying the policy are accepted"}
      mutation: {description: "Runs the built binary on a queue policy and the two workflows that satisfy it."}
    - name: check-workflows-default-policy
      input: {argv: ["check-workflows", "--dir", "SETUP_WORKFLOWS"], stdin: "", setup: "workflows-default-policy"}
      expected: {exit: 0, stdout: ["ok=true"]}
      classification: must-pass
      provenance: {source: requirement, ref: "without --policy the queue policy is read from its default path"}
      mutation: {description: "Omits --policy with the policy file only at the default path."}
    - name: check-workflows-violation
      input: {argv: ["check-workflows", "--policy", "SETUP_POLICY", "--dir", "SETUP_WORKFLOWS"], stdin: "", setup: "workflows-violation"}
      expected: {exit: 2, stdout: ["error=policy-violation"], stderr_rule: required-contexts}
      classification: must-fail
      sibling: check-workflows-accept
      provenance: {source: requirement, ref: "a policy violation exits 2 with a typed line and diagnostics"}
      mutation: {description: "Runs the built binary on workflows missing a required context."}
    - name: check-workflows-print-required
      input: {argv: ["check-workflows", "--policy", "SETUP_POLICY", "--dir", "SETUP_WORKFLOWS", "--print-required"], stdin: "", setup: "workflows-violation", githubOutput: true}
      expected: {exit: 0, bare_stdout: ["lib", "title-guard"]}
      classification: must-pass
      provenance: {source: requirement, ref: "print-required prints bare sorted contexts without step outputs"}
      mutation: {description: "Prints the required contexts one per line, sorted, with no GITHUB_OUTPUT append."}
    - name: check-workflows-missing-dir
      input: {argv: ["check-workflows", "--policy", "SETUP_POLICY", "--dir", "SETUP/nowhere"], stdin: "", setup: "workflows-policy-only"}
      expected: {exit: 1, stdout: []}
      classification: must-fail
      sibling: check-workflows-accept
      provenance: {source: boundary, ref: "an unreadable workflows directory exits 1"}
      mutation: {description: "Points at a workflows directory that does not exist."}
    - name: plan-missing-mode
      input: {argv: ["plan", "--branch", "main"], stdin: "", setup: "none"}
      expected: {exit: 1, stdout: []}
      classification: must-fail
      sibling: plan-accept-open-pr
      provenance: {source: boundary, ref: "plan requires --mode"}
      mutation: {description: "Omits the required --mode flag."}
    - name: plan-unreadable-branch
      input: {argv: ["plan", "--branch", "does-not-exist-xyz", "--mode", "tag"], stdin: "", setup: "git-pending"}
      expected: {exit: 1, stdout: [], absent_keys: [candidate_fresh]}
      classification: must-fail
      sibling: plan-accept-open-pr
      provenance: {source: boundary, ref: "an unreadable branch exits 1 with no candidate_fresh"}
      mutation: {description: "Plans from a missing branch, which must not print candidate_fresh."}
    - name: plan-accept-open-pr
      input: {argv: ["plan", "--branch", "HEAD", "--mode", "tag"], stdin: "", setup: "git-pending", githubOutput: true}
      expected: {exit: 0, stdout: ["action=open-pr", "range_base=v0.1.0", "version_base=v0.1.0", "candidate=", "candidate_fresh=", "level=minor", "breaking=false", "version=0.2.0", "tag=v0.2.0", "error="]}
      classification: must-pass
      provenance: {source: requirement, ref: "a pending batch plans open-pr with the full key set"}
      mutation: {description: "Plans the basic temp repo in tag mode."}
    - name: plan-empty-floor-and-mode
      input: {argv: ["plan", "--branch", "HEAD", "--floor", "", "--mode", ""], stdin: "", setup: "git-pending"}
      expected: {exit: 0, stdout: ["action=none", "range_base=v0.1.0", "version_base=v0.1.0", "candidate=", "candidate_fresh=", "level=minor", "breaking=false", "version=0.2.0", "tag=v0.2.0", "error="]}
      classification: must-pass
      provenance: {source: requirement, ref: "unset floor and mode variables arrive as empty quoted words: no floor, tag mode off"}
      mutation: {description: "Passes an empty floor and an empty mode as separate argument words."}
    - name: plan-bad-subject
      input: {argv: ["plan", "--branch", "HEAD", "--mode", "tag"], stdin: "", setup: "git-raw-subject", rawSubject: "wip(x): try"}
      expected: {exit: 2, stdout: ["error=unknown-type"]}
      classification: must-fail
      sibling: plan-accept-open-pr
      provenance: {source: requirement, ref: "a bad subject fails the whole plan with its code"}
      mutation: {description: "Plans a temp repo whose tip subject is not in the grammar."}
    - name: release-pr-write-accept
      input: {argv: ["release-pr", "--branch", "HEAD", "--write"], stdin: "", setup: "git-pending"}
      expected: {exit: 0, stdout: ["fresh=true", "push=true", "version=0.2.0", "error="]}
      classification: must-pass
      provenance: {source: requirement, ref: "writing the release content prints fresh with the version"}
      mutation: {description: "Writes the release content for the basic temp repo."}
    - name: release-pr-needs-write-or-check
      input: {argv: ["release-pr", "--branch", "main"], stdin: "", setup: "none"}
      expected: {exit: 1, stdout: []}
      classification: must-fail
      sibling: release-pr-write-accept
      provenance: {source: boundary, ref: "release-pr needs exactly one of --write or --check"}
      mutation: {description: "Omits both --write and --check."}
    - name: release-pr-write-current-same
      input: {argv: ["release-pr", "--branch", "HEAD", "--write", "--current", "SETUP_RELEASE_BRANCH"], stdin: "", setup: "current-same"}
      expected: {exit: 0, stdout: ["fresh=true", "push=false", "version=0.2.0", "error="]}
      classification: must-pass
      provenance: {source: requirement, ref: "a release branch holding the content is not rebuilt"}
      mutation: {description: "Writes with --current pointing at the release branch at the tip."}
    - name: release-pr-write-current-clean-tip
      input: {argv: ["release-pr", "--branch", "HEAD", "--write", "--current", "SETUP_RELEASE_BRANCH"], stdin: "", setup: "current-clean-tip"}
      expected: {exit: 0, stdout: ["fresh=true", "push=false", "version=0.2.0", "error="]}
      classification: must-pass
      provenance: {source: requirement, ref: "a clean tip commit over the content still needs no rebuild"}
      mutation: {description: "Lands a docs commit on the tip, which changes no release content."}
    - name: release-pr-write-current-differs
      input: {argv: ["release-pr", "--branch", "HEAD", "--write", "--current", "SETUP_RELEASE_BRANCH"], stdin: "", setup: "current-differs"}
      expected: {exit: 0, stdout: ["fresh=true", "push=true", "version=0.2.0", "error="]}
      classification: must-pass
      provenance: {source: requirement, ref: "changed release content on the tip rebuilds the release branch"}
      mutation: {description: "Lands another releasing commit on the tip after the release branch."}
    - name: release-pr-write-current-conflict
      input: {argv: ["release-pr", "--branch", "HEAD", "--write", "--current", "SETUP_RELEASE_BRANCH"], stdin: "", setup: "current-conflict"}
      expected: {exit: 0, stdout: ["fresh=true", "push=true", "version=0.2.0", "error="]}
      classification: must-pass
      provenance: {source: requirement, ref: "a release branch the tip no longer merges onto rebuilds"}
      mutation: {description: "Edits the same content-free file on the tip and the release branch."}
    - name: release-pr-write-current-unreadable
      input: {argv: ["release-pr", "--branch", "HEAD", "--write", "--current", "does-not-exist"], stdin: "", setup: "current-same"}
      expected: {exit: 0, stdout: ["fresh=true", "push=true", "version=0.2.0", "error="]}
      classification: must-pass
      provenance: {source: requirement, ref: "an unreadable release branch never reads as up to date"}
      mutation: {description: "Points --current at a ref that does not exist; the decided result is push=true."}
    - name: plan-empty-release-plans
      input: {argv: ["plan", "--branch", "HEAD", "--mode", "tag"], stdin: "", setup: "git-empty-release"}
      expected: {exit: 0, stdout: ["action=open-pr", "range_base=v0.1.0", "version_base=v0.1.0", "candidate=", "candidate_fresh=", "level=patch", "breaking=false", "version=0.1.1", "tag=v0.1.1", "error="]}
      classification: must-pass
      provenance: {source: requirement, ref: "an empty releasing commit plans as releasing"}
      mutation: {description: "Plans a temp repo whose only post-tag commit is an empty release."}
    - name: release-pr-write-empty
      input: {argv: ["release-pr", "--branch", "HEAD", "--write"], stdin: "", setup: "git-empty-release"}
      expected: {exit: 0, stdout: ["fresh=true", "push=true", "version=0.1.1", "error="]}
      classification: must-pass
      provenance: {source: requirement, ref: "writing an empty releasing commit yields one changelog line"}
      mutation: {description: "Writes the release content for an empty release commit."}
    - name: release-pr-check-with-current
      input: {argv: ["release-pr", "--branch", "main", "--check", "--current", "main"], stdin: "", setup: "none"}
      expected: {exit: 1, stdout: []}
      classification: must-fail
      sibling: release-pr-write-current-same
      provenance: {source: boundary, ref: "the open-branch comparison only applies to a write"}
      mutation: {description: "Pairs --current with --check."}
    - name: no-subcommand
      input: {argv: [], argvUnchecked: true, stdin: "", setup: "none"}
      expected: {exit: 1, stdout: []}
      classification: must-fail
      sibling: group-pr-queue-ref
      provenance: {source: boundary, ref: "a call with no subcommand is a usage error"}
      mutation: {description: "Passes no arguments at all."}
    - name: unknown-subcommand
      input: {argv: ["freeze-plan", "--ref", "refs/heads/main"], argvUnchecked: true, stdin: "", setup: "none"}
      expected: {exit: 1, stdout: []}
      classification: must-fail
      sibling: group-pr-queue-ref
      provenance: {source: boundary, ref: "a word outside the closed command set never dispatches"}
      mutation: {description: "Names a subcommand the tool does not implement."}
    - name: unknown-flag
      input: {argv: ["group-pr", "--reff", "refs/heads/main"], argvUnchecked: true, stdin: "", setup: "none"}
      expected: {exit: 1, stdout: []}
      classification: must-fail
      sibling: group-pr-queue-ref
      provenance: {source: boundary, ref: "a word outside the closed flag set is a usage error"}
      mutation: {description: "Misspells the one flag the command takes."}
    - name: flag-of-another-command
      input: {argv: ["group-pr", "--ref", "refs/heads/main", "--branch", "main"], stdin: "", setup: "none"}
      expected: {exit: 1, stdout: []}
      classification: must-fail
      sibling: group-pr-non-queue-empty
      provenance: {source: boundary, ref: "a known flag the command does not take is a usage error"}
      mutation: {description: "Adds a flag that belongs to other commands."}
    - name: flag-missing-value
      input: {argv: ["group-pr", "--ref"], stdin: "", setup: "none"}
      expected: {exit: 1, stdout: []}
      classification: must-fail
      sibling: group-pr-queue-ref
      provenance: {source: boundary, ref: "a value flag at the end of the arguments is a usage error"}
      mutation: {description: "Ends the arguments on a flag that takes a value."}
    - name: flag-like-value
      input: {argv: ["group-pr", "--ref", "--ref"], stdin: "", setup: "none"}
      expected: {exit: 1, stdout: []}
