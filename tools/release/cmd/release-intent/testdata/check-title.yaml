required_names:
  - base-read-failure-is-internal
  - head-removes-protection-rejected
  - pr-behind-base-passes
  - scripts-only-after-release-passes
  - version-field-edit-rejected
  - version-field-removed-rejected
  - group-shaped-base-passes
  - ordinary-scripts-edit-accepted
  - adopting-pr-accepted
  - adopting-pr-releasing-changelog-rejected
  - version-document-corrupt-rejected
  - release-pr-version-edit-accepted
  - release-pr-content-accepted
  - release-pr-source-file-rejected
  - release-pr-version-file-other-edit-rejected
  - cut-release-empty-accepted
  - cut-release-file-rejected
  - content-freeze-working-accepted
  - content-freeze-numbered-rejected
  - release-freeze-output-accepted
  - release-undeclared-freeze-output-rejected
  - changelog-body-edit-accepted
  - changelog-heading-edit-rejected
  - changelog-base-read-failure
  - changelog-head-read-failure
  - changelog-unreleased-added-without-base
  - changelog-release-added-without-base
  - release-pr-changelog-added-without-base
  - changelog-deleted-with-headings
  - changelog-compared-at-merge-base
  - feature-changelog-rejected
  - fix-changelog-rejected
  - human-release-changelog-rejected
  - docs-changelog-accepted
  - feature-without-changelog-accepted

cases:
  cases:
    - name: feature-changelog-rejected
      input: &feature_changelog {title: "feat(x)[minor]: add", author: octocat, headBranch: feature/work, setup: changelog-edit, baseChangelog: "# Changelog\n## 0.1.0\nold\n", headChangelog: "# Changelog\n## 0.1.0\nnew\n"}
      expected: &title_rejection {exit: 2, code: changelog-release-title, stdout: []}
      classification: must-fail
      sibling: docs-changelog-accepted
      provenance: &title_p {source: requirement, ref: "changelog edits cannot conceal release intent"}
      mutation: &title_m {description: "vary the title or changed path"}
    - name: fix-changelog-rejected
      input: {<<: *feature_changelog, title: "fix(x)[patch]: repair"}
      expected: *title_rejection
      classification: must-fail
      sibling: docs-changelog-accepted
      provenance: *title_p
      mutation: *title_m
    - name: human-release-changelog-rejected
      input: {<<: *feature_changelog, title: "release[patch]: publish"}
      expected: *title_rejection
      classification: must-fail
      sibling: docs-changelog-accepted
      provenance: *title_p
      mutation: *title_m
    - name: docs-changelog-accepted
      input: {<<: *feature_changelog, title: "docs(changelog): correct"}
      expected: {exit: 0, stdout: ["error="]}
      classification: must-pass
      provenance: *title_p
      mutation: *title_m
    - name: feature-without-changelog-accepted
      input: {title: "feat(x)[minor]: add", author: octocat, headBranch: feature/work, setup: ordinary-scripts-edit}
      expected: {exit: 0, stdout: ["error="]}
      classification: must-pass
      provenance: *title_p
      mutation: *title_m
    - name: changelog-body-edit-accepted
      input:
        title: "docs: correct historical notes"
        author: octocat
        headBranch: feature/work
        setup: changelog-edit
        baseChangelog: &changelog_base |
          # Changelog
          ## [0.18.1] - 2026-01-02
          - Old note.
        headChangelog: &changelog_body |
          # Changelog
          ## [0.18.1] - 2026-01-02
          - Corrected note.
      expected: {exit: 0, stdout: ["error="]}
      classification: must-pass
      provenance: &changelog_p {source: requirement, ref: "the changelog gate compares both blobs from the merge base"}
      mutation: &changelog_m {description: "change changelog prose or a release section heading"}
    - name: changelog-heading-edit-rejected
      input:
        title: "docs: correct historical notes"
        author: octocat
        headBranch: feature/work
        setup: changelog-edit
        baseChangelog: *changelog_base
        headChangelog: &changelog_heading |
          # Changelog
          ## [0.18.2] - 2026-01-02
          - Corrected note.
      expected: {exit: 2, code: protected-path, stdout: []}
      classification: must-fail
      sibling: changelog-body-edit-accepted
      provenance: *changelog_p
      mutation: *changelog_m
    - name: changelog-base-read-failure
      input: {title: "docs: correct historical notes", author: octocat, headBranch: feature/work, setup: changelog-base-read-failure, baseChangelog: *changelog_base, headChangelog: *changelog_body}
      expected: {exit: 1, stdout: [], absent_keys: [error], message: "cannot read changelog"}
      classification: must-fail
      sibling: changelog-body-edit-accepted
      provenance: *changelog_p
      mutation: {description: "fail the merge-base changelog blob read"}
    - name: changelog-head-read-failure
      input: {title: "docs: correct historical notes", author: octocat, headBranch: feature/work, setup: changelog-head-read-failure, baseChangelog: *changelog_base, headChangelog: *changelog_body}
      expected: {exit: 1, stdout: [], absent_keys: [error], message: "cannot read changelog"}
      classification: must-fail
      sibling: changelog-body-edit-accepted
      provenance: *changelog_p
      mutation: {description: "fail the head changelog blob read"}
    - name: changelog-unreleased-added-without-base
      input: {title: "docs: add notes", author: octocat, headBranch: feature/work, setup: changelog-missing-base, headChangelog: "# Changelog\n\n## [Unreleased]\n- Note.\n"}
      expected: {exit: 0, stdout: ["error="]}
      classification: must-pass
      provenance: *changelog_p
      mutation: {description: "add a changelog containing only the unreleased block"}
    - name: changelog-release-added-without-base
      input: {title: "docs: add notes", author: octocat, headBranch: feature/work, setup: changelog-missing-base, headChangelog: *changelog_base}
      expected: {exit: 2, code: protected-path, stdout: []}
      classification: must-fail
      sibling: changelog-unreleased-added-without-base
      provenance: *changelog_p
      mutation: {description: "add a changelog that contains a real release heading"}
    - name: release-pr-changelog-added-without-base
      input: {title: "release[minor]: publish the pending changes", author: SETUP_BOT_AUTHOR, headBranch: SETUP_RELEASE_BRANCH, setup: changelog-missing-base, headChangelog: *changelog_base}
      expected: {exit: 0, stdout: ["error="]}
      classification: must-pass
      provenance: {source: requirement, ref: "the release PR may create a changelog"}
      mutation: {description: "add a changelog with a release heading as the release bot"}
    - name: changelog-deleted-with-headings
      input: {title: "docs: remove notes", author: octocat, headBranch: feature/work, setup: changelog-missing-head, baseChangelog: *changelog_base}
      expected: {exit: 2, code: protected-path, stdout: []}
      classification: must-fail
      sibling: changelog-body-edit-accepted
      provenance: *changelog_p
      mutation: {description: "delete a changelog that contains a real release heading"}
    - name: changelog-compared-at-merge-base
      input:
        title: "docs: correct historical notes"
        author: octocat
        headBranch: feature/work
        setup: changelog-behind-base
        baseChangelog: *changelog_base
        headChangelog: *changelog_body
        baseTipChangelog: |
          # Changelog
          ## [0.18.2] - 2026-01-03
          - A later release.
          ## [0.18.1] - 2026-01-02
          - Old note.
      expected: {exit: 0, stdout: ["error="]}
      classification: must-pass
      provenance: {source: requirement, ref: "release headings compare against the merge base rather than a later base tip"}
      mutation: {description: "add a new release to the base after the correction branch split"}
    - name: content-freeze-working-accepted
      input: {title: "fix(api)[patch]: update working document", author: "octocat", headBranch: "feature/work", setup: freeze-output, changedPath: generated/api.json}
      expected: {exit: 0, stdout: ["error="]}
      classification: must-pass
      provenance: &freeze_p {source: requirement, ref: "freeze outputs do not themselves protect files from content PRs"}
      mutation: &freeze_m {description: "Change the PR kind or freeze output path."}
    - name: content-freeze-numbered-rejected
      input: {title: "fix(api)[patch]: update frozen document", author: "octocat", headBranch: "feature/work", setup: freeze-output, changedPath: generated/api-0.2.0.json}
      expected: {exit: 2, code: protected-path, stdout: []}
      classification: must-fail
      sibling: content-freeze-working-accepted
      provenance: *freeze_p
      mutation: *freeze_m
    - name: release-freeze-output-accepted
      input: {title: "release[minor]: publish the pending changes", author: "SETUP_BOT_AUTHOR", headBranch: "SETUP_RELEASE_BRANCH", setup: freeze-output, changedPath: registry.yaml}
      expected: {exit: 0, stdout: ["error="]}
      classification: must-pass
      provenance: *freeze_p
      mutation: *freeze_m
    - name: release-undeclared-freeze-output-rejected
      input: {title: "release[minor]: publish the pending changes", author: "SETUP_BOT_AUTHOR", headBranch: "SETUP_RELEASE_BRANCH", setup: freeze-output, changedPath: unlisted.yaml}
      expected: {exit: 2, code: release-content-scope, stdout: []}
      classification: must-fail
      sibling: release-freeze-output-accepted
      provenance: *freeze_p
      mutation: *freeze_m
    - name: base-read-failure-is-internal
      input: {title: "feat(graph)[minor]: add facet", author: "octocat", headBranch: "feature/work", setup: "base-read-failure"}
      expected: {exit: 1, stdout: [], absent_keys: [error]}
      classification: must-fail
      sibling: ordinary-scripts-edit-accepted
      provenance: {source: requirement, ref: "a failed base config fetch exits 1 with no accept"}
      mutation: {description: "Fails the base config blob read with a non-absent error."}
    - name: head-removes-protection-rejected
      input: {title: "feat(graph)[minor]: add facet", author: "octocat", headBranch: "feature/work", setup: "protection-removed"}
      expected: {exit: 2, code: "protected-path", stdout: []}
      classification: must-fail
      sibling: ordinary-scripts-edit-accepted
      provenance: {source: requirement, ref: "base config protections apply even when the head drops them"}
      mutation: {description: "Removes the version-file protection in the head config and bumps the version."}
    - name: pr-behind-base-passes
      input: {title: "feat(graph)[minor]: add facet", author: "octocat", headBranch: "feature/work", setup: "pr-behind-base"}
      expected: {exit: 0, stdout: ["error="]}
      classification: must-pass
      provenance: {source: requirement, ref: "a PR behind its base diffs from the merge base"}
      mutation: {description: "Lands a commit on the base after the PR branched."}
    - name: scripts-only-after-release-passes
      input: {title: "fix(scripts)[patch]: quiet lint", author: "octocat", headBranch: "feature/work", setup: "scripts-only-after-release"}
      expected: {exit: 0, stdout: ["error="]}
      classification: must-pass
      provenance: {source: requirement, ref: "version fields compare at the merge base, not the base tip"}
      mutation: {description: "Lands a release after the PR branched, then edits only scripts."}
    - name: version-field-edit-rejected
      input: {title: "feat(graph)[minor]: add facet", author: "octocat", headBranch: "feature/work", setup: "version-field-edit"}
      expected: {exit: 2, code: "protected-path", stdout: []}
      classification: must-fail
      sibling: scripts-only-after-release-passes
      provenance: {source: requirement, ref: "a version field edit by a non-release PR is rejected"}
      mutation: {description: "Bumps the protected version field in the head."}
    - name: version-field-removed-rejected
      input: {title: "feat(graph)[minor]: add facet", author: "octocat", headBranch: "feature/work", setup: "version-field-removed"}
      expected: {exit: 2, code: "protected-path", message: "has no top-level field", stdout: []}
      classification: must-fail
      sibling: ordinary-scripts-edit-accepted
      provenance: {source: requirement, ref: "a removed protected field names the exact fault"}
      mutation: {description: "Removes the version field from the version file in the head."}
    - name: group-shaped-base-passes
      input: {title: "feat(b)[minor]: entry b", author: "octocat", headBranch: "queue-b", setup: "group-shaped-base"}
      expected: {exit: 0, stdout: ["error="]}
      classification: must-pass
      provenance: {source: requirement, ref: "a merge-group base that is not an ancestor still diffs"}
      mutation: {description: "Diffs two divergent queue entries from their merge base."}
    - name: ordinary-scripts-edit-accepted
      input: {title: "fix(scripts)[patch]: quiet lint", author: "octocat", headBranch: "feature/work", setup: "ordinary-scripts-edit"}
      expected: {exit: 0, stdout: ["error="]}
      classification: must-pass
      provenance: {source: requirement, ref: "a scripts-only version-file edit is accepted"}
      mutation: {description: "Edits only unprotected fields of a version file."}
    - name: adopting-pr-accepted
      input: {title: "docs(changelog): adopt release config", author: "octocat", headBranch: "feature/work", setup: "adopting"}
      expected: {exit: 0, stdout: ["error="]}
      classification: must-pass
      provenance: {source: requirement, ref: "an adopting PR is judged using its head config"}
      mutation: {description: "Leaves the base without a config and adds it in the head."}
    - name: adopting-pr-releasing-changelog-rejected
      input: {title: "feat(graph)[minor]: add facet", author: "octocat", headBranch: "feature/work", setup: "adopting"}
      expected: {exit: 2, code: changelog-release-title, stdout: []}
      classification: must-fail
      sibling: adopting-pr-accepted
      provenance: *title_p
      mutation: {description: "adopt configuration and a changelog with a releasing title"}
    - name: version-document-corrupt-rejected
      input: {title: "feat(graph)[minor]: add facet", author: "octocat", headBranch: "feature/work", setup: "raw-version-document", rawVersionDocument: "{not json"}
      expected: {exit: 2, code: "protected-path", stdout: []}
      classification: must-fail
      sibling: ordinary-scripts-edit-accepted
      provenance: {source: requirement, ref: "a version file that cannot be parsed fails closed"}
      mutation: {description: "Replaces the version file in the head with bytes that are not JSON."}
    - name: release-pr-version-edit-accepted
      input: {title: "release[minor]: publish the pending changes", author: "SETUP_BOT_AUTHOR", headBranch: "SETUP_RELEASE_BRANCH", setup: "version-field-edit"}
      expected: {exit: 0, stdout: ["error="]}
      classification: must-pass
      provenance: {source: requirement, ref: "only the release PR may change the protected version field"}
      mutation: {description: "Makes the same version edit as the bot author on the release bot branch."}
    - name: release-pr-content-accepted
      input: {title: "release[minor]: publish the pending changes", author: "SETUP_BOT_AUTHOR", headBranch: "SETUP_RELEASE_BRANCH", setup: "release-content"}
      expected: {exit: 0, stdout: ["error="]}
      classification: must-pass
      provenance: {source: requirement, ref: "the release PR may change the changelog and the protected version field"}
      mutation: {description: "Writes a changelog section and bumps the version field as the bot on the release branch."}
    - name: release-pr-source-file-rejected
      input: {title: "release[minor]: publish the pending changes", author: "SETUP_BOT_AUTHOR", headBranch: "SETUP_RELEASE_BRANCH", setup: "release-source-edit"}
      expected: {exit: 2, code: "release-content-scope", message: "src/graph.ts", stdout: []}
      classification: must-fail
      sibling: release-pr-content-accepted
      provenance: {source: requirement, ref: "the release PR may change only the changelog and the protected version fields"}
      mutation: {description: "Adds a source file to the release content."}
    - name: release-pr-version-file-other-edit-rejected
      input: {title: "release[patch]: publish the pending changes", author: "SETUP_BOT_AUTHOR", headBranch: "SETUP_RELEASE_BRANCH", setup: "ordinary-scripts-edit"}
      expected: {exit: 2, code: "release-content-scope", message: "also moves other content", stdout: []}
      classification: must-fail
      sibling: release-pr-version-edit-accepted
      provenance: {source: requirement, ref: "the release PR may change a version file only in its protected field"}
      mutation: {description: "Edits an ordinary field of the version file on the release branch."}
    - name: cut-release-empty-accepted
      input: {title: "release[patch]: cut a release", author: "SETUP_BOT_AUTHOR", headBranch: "SETUP_CUT_RELEASE_BRANCH", setup: "cut-release-empty"}
      expected: {exit: 0, stdout: ["error="]}
      classification: must-pass
      provenance: {source: requirement, ref: "the cut-release PR is one empty commit"}
      mutation: {description: "Makes the empty cut-release commit as the bot on the cut-release branch."}
    - name: cut-release-file-rejected
      input: {title: "release[patch]: cut a release", author: "SETUP_BOT_AUTHOR", headBranch: "SETUP_CUT_RELEASE_BRANCH", setup: "cut-release-file-edit"}
      expected: {exit: 2, code: "release-content-scope", message: "cut-release PR changes", stdout: []}
      classification: must-fail
      sibling: cut-release-empty-accepted
      provenance: {source: requirement, ref: "the cut-release PR may change no path"}
      mutation: {description: "Adds a file to the cut-release commit."}
