# Protected-path corpus: rows of intent.CheckProtectedPaths. The release
# config rides in each input so the corpus pins the judgement, not one file.
required_names:
  - changelog-by-author
  - version-field-moved
  - version-other-fields
  - unrelated-file
  - glob-protected
  - release-pr-may-change
  - protected-found-among-many
  - empty-change
  - release-pr-source-file
  - release-pr-version-other-content
  - release-pr-protected-path
  - release-pr-deletes-version-file
  - cut-release-empty
  - cut-release-file
  - cut-release-changelog
  - content-may-change-freeze-working-file
  - content-cannot-change-frozen-file
  - release-may-change-freeze-outputs
  - release-freeze-glob-cannot-match-workflow
  - release-freeze-glob-cannot-override-version-rule
  - release-protected-version-only
  - release-protected-version-other-content-rejected
  - allowed-changelog-and-version-change-rejected
  - cut-release-unchanged-headings-rejected
  - changelog-allowance-does-not-bypass-protected-path
cases:
  - name: release-protected-version-only
    input:
      config: &overlap_config {changelog: CHANGELOG.md, version_files: [{path: package.json, field: version}], protected_paths: ['*.json']}
      kind: release
      changes: [{path: package.json, protected_field_changed: true, other_content_changed: false}]
    expected: {}
    classification: must-pass
    provenance: &overlap_p {source: requirement, ref: "version-field scope applies even with an overlapping protected glob"}
    mutation: &overlap_m {description: "Change an ordinary field in the version document."}
  - name: release-protected-version-other-content-rejected
    input:
      config: *overlap_config
      kind: release
      changes: [{path: package.json, protected_field_changed: true, other_content_changed: true}]
    expected: {code: release-content-scope}
    classification: must-fail
    sibling: release-protected-version-only
    provenance: *overlap_p
    mutation: *overlap_m
  - name: content-may-change-freeze-working-file
    input:
      config: &freeze_config
        changelog: CHANGELOG.md
        version_files: [{path: package.json, field: version}]
        protected_paths: ['generated/*-[0-9]*']
        freeze_outputs: ['generated/*.json', registry.yaml, mirrors/api.json]
      kind: ordinary
      changes: [{path: generated/api.json}, {path: registry.yaml}, {path: mirrors/api.json}]
    expected: {}
    classification: must-pass
    provenance: &freeze_scope_p {source: requirement, ref: "freeze outputs are allowances, not protections"}
    mutation: &freeze_scope_m {description: "Change the PR kind or output path."}
  - {name: content-cannot-change-frozen-file, input: {config: *freeze_config, kind: ordinary, changes: [{path: generated/api-0.2.0.json}]}, expected: {code: protected-path}, classification: must-fail, sibling: content-may-change-freeze-working-file, provenance: *freeze_scope_p, mutation: *freeze_scope_m}
  - {name: release-may-change-freeze-outputs, input: {config: *freeze_config, kind: release, changes: [{path: generated/api.json}, {path: registry.yaml}, {path: mirrors/api.json}]}, expected: {}, classification: must-pass, provenance: *freeze_scope_p, mutation: *freeze_scope_m}
  - name: release-freeze-glob-cannot-match-workflow
    input:
      config: {changelog: CHANGELOG.md, freeze_outputs: ['*/workflows/release.yml']}
      kind: release
      changes: [{path: .github/workflows/release.yml}]
    expected: {code: release-content-scope}
    classification: must-fail
    sibling: release-may-change-freeze-outputs
    provenance: *freeze_scope_p
    mutation: *freeze_scope_m
  - name: release-freeze-glob-cannot-override-version-rule
    input:
      config: {changelog: CHANGELOG.md, version_files: [{path: package.json, field: version}], freeze_outputs: ['*.json']}
      kind: release
      changes: [{path: package.json, other_content_changed: true}]
    expected: {code: release-content-scope}
    classification: must-fail
    sibling: release-may-change-freeze-outputs
    provenance: *freeze_scope_p
    mutation: *freeze_scope_m
  - name: changelog-by-author
    input:
      config:
        releases: true
        tag_prefix: fairtrade-v
        automation_author: peasant-labs-releaser[bot]
        changelog: CHANGELOG.md
        version_files:
          - { path: package.json, field: version }
        protected_paths: []
        surfaces: {}
        bot_branches: {}
      kind: ordinary
      changes:
        - { path: "CHANGELOG.md", protected_field_changed: false }
    expected: {code: "protected-path"}
    classification: must-fail
    sibling: release-pr-may-change
    provenance: {source: requirement, ref: "a changelog without proof of unchanged release headings is protected"}
    mutation: {description: "the changelog changes without an unchanged-heading comparison"}
  - name: allowed-changelog-and-version-change-rejected
    input:
      config: {changelog: CHANGELOG.md, version_files: [{path: package.json, field: version}]}
      kind: ordinary
      changes:
        - {path: CHANGELOG.md, changelog_headings_unchanged: true}
        - {path: package.json, protected_field_changed: true}
    expected: {code: protected-path}
    classification: must-fail
    sibling: version-other-fields
    provenance: {source: requirement, ref: "allowed changelog edits do not authorize a version-field change"}
    mutation: {description: "combine a permitted changelog body edit with a protected version edit"}
  - name: cut-release-unchanged-headings-rejected
    input:
      config: {changelog: CHANGELOG.md}
      kind: cut-release
      changes: [{path: CHANGELOG.md, changelog_headings_unchanged: true}]
    expected: {code: release-content-scope}
    classification: must-fail
    sibling: cut-release-empty
    provenance: {source: requirement, ref: "a cut-release PR may change no path"}
    mutation: {description: "add a body-only changelog edit to an empty cut-release PR"}
  - name: changelog-allowance-does-not-bypass-protected-path
    input:
      config: {changelog: CHANGELOG.md, protected_paths: [CHANGELOG.md]}
      kind: ordinary
      changes: [{path: CHANGELOG.md, changelog_headings_unchanged: true}]
    expected: {code: protected-path}
    classification: must-fail
    sibling: unrelated-file
    provenance: {source: boundary, ref: "a path separately protected in an unvalidated config is still protected"}
    mutation: {description: "overlap the allowed changelog and a protected path"}
  - name: version-field-moved
    input:
      config:
        releases: true
        tag_prefix: fairtrade-v
        automation_author: peasant-labs-releaser[bot]
        changelog: CHANGELOG.md
        version_files:
          - { path: package.json, field: version }
        protected_paths: []
        surfaces: {}
        bot_branches: {}
      kind: ordinary
      changes:
        - { path: "package.json", protected_field_changed: true }
    expected: {code: "protected-path"}
    classification: must-fail
    sibling: version-other-fields
    provenance: {source: requirement, ref: "protected paths: the protected field is written only by the release PR"}
    mutation: {description: "an author edit to the version field"}
  - name: version-other-fields
    input:
      config:
        releases: true
        tag_prefix: fairtrade-v
        automation_author: peasant-labs-releaser[bot]
        changelog: CHANGELOG.md
        version_files:
          - { path: package.json, field: version }
        protected_paths: []
        surfaces: {}
        bot_branches: {}
      kind: ordinary
      changes:
        - { path: "package.json", protected_field_changed: false }
    expected: {}
    classification: must-pass
    provenance: {source: requirement, ref: "protected paths: a version file is protected by field, not by file"}
    mutation: {description: "an author edit to the same file outside the protected field"}
  - name: unrelated-file
    input:
      config:
        releases: true
        tag_prefix: fairtrade-v
        automation_author: peasant-labs-releaser[bot]
        changelog: CHANGELOG.md
        version_files:
          - { path: package.json, field: version }
        protected_paths: []
        surfaces: {}
        bot_branches: {}
      kind: ordinary
      changes:
        - { path: "src/graph.ts", protected_field_changed: false }
    expected: {}
    classification: must-pass
    provenance: {source: requirement, ref: "protected paths: ordinary content is never protected"}
    mutation: {description: "an author edit to ordinary content"}
  - name: glob-protected
    input:
      config:
        releases: true
        tag_prefix: v
        automation_author: peasant-labs-releaser[bot]
        changelog: CHANGELOG.md
        version_files: []
        protected_paths:
          - generated/*
        surfaces: {}
        bot_branches: {}
      kind: ordinary
      changes:
        - { path: "generated/types-0.1.0.json", protected_field_changed: false }
    expected: {code: "protected-path"}
    classification: must-fail
    sibling: unrelated-file
    provenance: {source: requirement, ref: "protected paths: a glob entry covers its matches"}
    mutation: {description: "an author edit to a glob-protected path"}
  - name: release-pr-may-change
    input:
      config:
        releases: true
        tag_prefix: fairtrade-v
        automation_author: peasant-labs-releaser[bot]
        changelog: CHANGELOG.md
        version_files:
          - { path: package.json, field: version }
        protected_paths: []
        surfaces: {}
        bot_branches: {}
      kind: release
      changes:
        - { path: "CHANGELOG.md", protected_field_changed: false }
        - { path: "package.json", protected_field_changed: true }
    expected: {}
    classification: must-pass
    provenance: {source: requirement, ref: "protected paths: the release PR is exempt"}
    mutation: {description: "the release PR writing its own content"}
  - name: protected-found-among-many
    input:
      config:
        releases: true
        tag_prefix: v
        automation_author: peasant-labs-releaser[bot]
        changelog: CHANGELOG.md
        version_files: []
        protected_paths: []
        surfaces: {}
        bot_branches: {}
      kind: ordinary
      changes:
        - { path: "a.go", protected_field_changed: false }
        - { path: "b.go", protected_field_changed: false }
        - { path: "c.go", protected_field_changed: false }
        - { path: "d.go", protected_field_changed: false }
        - { path: "e.go", protected_field_changed: false }
        - { path: "f.go", protected_field_changed: false }
        - { path: "g.go", protected_field_changed: false }
        - { path: "h.go", protected_field_changed: false }
        - { path: "i.go", protected_field_changed: false }
        - { path: "CHANGELOG.md", protected_field_changed: false }
    expected: {code: "protected-path"}
    classification: must-fail
    sibling: unrelated-file
    provenance: {source: requirement, ref: "protected paths: one protected path among many changes is seen"}
    mutation: {description: "buried the protected edit last in a long change list"}
  - name: empty-change
    input:
      config:
        releases: true
        tag_prefix: v
        automation_author: peasant-labs-releaser[bot]
        changelog: CHANGELOG.md
        version_files: []
        protected_paths: []
        surfaces: {}
        bot_branches: {}
      kind: ordinary
      changes: []
    expected: {}
    classification: must-pass
    provenance: {source: boundary, ref: "protected paths: an empty change touches nothing protected"}
    mutation: {description: "an empty change list"}
  - name: release-pr-source-file
    input:
      config:
        releases: true
        tag_prefix: fairtrade-v
        automation_author: peasant-labs-releaser[bot]
        changelog: CHANGELOG.md
        version_files:
          - { path: package.json, field: version }
        protected_paths: ["generated/*.json"]
        surfaces: {}
        bot_branches: {release: automation/release, cut-release: automation/cut-release}
      kind: release
      changes:
        - { path: "CHANGELOG.md", protected_field_changed: false, other_content_changed: false }
        - { path: "package.json", protected_field_changed: true, other_content_changed: false }
        - { path: "src/graph.ts", protected_field_changed: false, other_content_changed: false }
    expected: {code: "release-content-scope"}
    classification: must-fail
    sibling: release-pr-may-change
    provenance: {source: requirement, ref: "release scope: the release PR writes only the changelog and the protected version fields"}
    mutation: {description: "added a source file to the release PR"}
  - name: release-pr-version-other-content
    input:
      config:
        releases: true
        tag_prefix: fairtrade-v
        automation_author: peasant-labs-releaser[bot]
        changelog: CHANGELOG.md
        version_files:
          - { path: package.json, field: version }
        protected_paths: ["generated/*.json"]
        surfaces: {}
        bot_branches: {release: automation/release, cut-release: automation/cut-release}
      kind: release
      changes:
        - { path: "CHANGELOG.md", protected_field_changed: false, other_content_changed: false }
        - { path: "package.json", protected_field_changed: true, other_content_changed: true }
    expected: {code: "release-content-scope"}
    classification: must-fail
    sibling: release-pr-may-change
    provenance: {source: requirement, ref: "release scope: a version file changes only in its protected field"}
    mutation: {description: "changed another field of the version file in the release PR"}
  - name: release-pr-protected-path
    input:
      config:
        releases: true
        tag_prefix: fairtrade-v
        automation_author: peasant-labs-releaser[bot]
        changelog: CHANGELOG.md
        version_files:
          - { path: package.json, field: version }
        protected_paths: ["generated/*.json"]
        surfaces: {}
        bot_branches: {release: automation/release, cut-release: automation/cut-release}
      kind: release
      changes:
        - { path: "generated/types-0.2.0.json", protected_field_changed: false, other_content_changed: false }
    expected: {}
    classification: must-pass
    provenance: {source: requirement, ref: "release scope: protected paths are writable by the release PR"}
    mutation: {description: "added a protected path to the release PR"}
  - name: release-pr-deletes-version-file
    input:
      config:
        releases: true
        tag_prefix: fairtrade-v
        automation_author: peasant-labs-releaser[bot]
        changelog: CHANGELOG.md
        version_files:
          - { path: package.json, field: version }
        protected_paths: ["generated/*.json"]
        surfaces: {}
        bot_branches: {release: automation/release, cut-release: automation/cut-release}
      kind: release
      changes:
        - { path: "package.json", protected_field_changed: true, other_content_changed: true }
    expected: {code: "release-content-scope"}
    classification: must-fail
    sibling: release-pr-may-change
    provenance: {source: requirement, ref: "release scope: removing a version file moves more than its field"}
    mutation: {description: "deleted the version file in the release PR"}
  - name: cut-release-empty
    input:
      config:
        releases: true
        tag_prefix: fairtrade-v
        automation_author: peasant-labs-releaser[bot]
        changelog: CHANGELOG.md
        version_files:
          - { path: package.json, field: version }
        protected_paths: ["generated/*.json"]
        surfaces: {}
        bot_branches: {release: automation/release, cut-release: automation/cut-release}
      kind: cut-release
      changes: []
    expected: {}
    classification: must-pass
    provenance: {source: requirement, ref: "cut-release scope: the cut-release PR is one empty commit"}
    mutation: {description: "the empty cut-release commit"}
  - name: cut-release-file
    input:
      config:
        releases: true
        tag_prefix: fairtrade-v
        automation_author: peasant-labs-releaser[bot]
        changelog: CHANGELOG.md
        version_files:
          - { path: package.json, field: version }
        protected_paths: ["generated/*.json"]
        surfaces: {}
        bot_branches: {release: automation/release, cut-release: automation/cut-release}
      kind: cut-release
      changes:
        - { path: "src/graph.ts", protected_field_changed: false, other_content_changed: false }
    expected: {code: "release-content-scope"}
    classification: must-fail
    sibling: cut-release-empty
    provenance: {source: requirement, ref: "cut-release scope: the cut-release PR changes no path"}
    mutation: {description: "added a file to the cut-release commit"}
  - name: cut-release-changelog
    input:
      config:
        releases: true
        tag_prefix: fairtrade-v
        automation_author: peasant-labs-releaser[bot]
        changelog: CHANGELOG.md
        version_files:
          - { path: package.json, field: version }
        protected_paths: ["generated/*.json"]
        surfaces: {}
        bot_branches: {release: automation/release, cut-release: automation/cut-release}
      kind: cut-release
      changes:
        - { path: "CHANGELOG.md", protected_field_changed: false, other_content_changed: false }
    expected: {code: "release-content-scope"}
    classification: must-fail
    sibling: cut-release-empty
    provenance: {source: requirement, ref: "cut-release scope: the cut-release PR does not write the changelog either"}
    mutation: {description: "wrote the changelog in the cut-release commit"}
