# Protected-path corpus: rows of intent.CheckProtectedPaths. The release
# config rides in each input so the corpus pins the judgement, not one file.
required_names:
  - changelog-by-author
  - version-field-moved
  - version-other-fields
  - unrelated-file
  - glob-protected
  - release-pr-may-change
  - protected-found-among-many
  - empty-change
  - release-pr-source-file
  - release-pr-version-other-content
  - release-pr-protected-path
  - release-pr-deletes-version-file
  - cut-release-empty
  - cut-release-file
  - cut-release-changelog
cases:
  - name: changelog-by-author
    input:
      config:
        releases: true
        tag_prefix: fairtrade-v
        automation_author: peasant-labs-releaser[bot]
        changelog: CHANGELOG.md
        version_files:
          - { path: package.json, field: version }
        protected_paths: []
        surfaces: {}
        bot_branches: {}
      kind: ordinary
      changes:
        - { path: "CHANGELOG.md", protected_field_changed: false }
    expected: {code: "protected-path"}
    classification: must-fail
    sibling: release-pr-may-change
    provenance: {source: requirement, ref: "protected paths: the changelog is written only by the release PR"}
    mutation: {description: "an author edit to the changelog"}
  - name: version-field-moved
    input:
      config:
        releases: true
        tag_prefix: fairtrade-v
        automation_author: peasant-labs-releaser[bot]
        changelog: CHANGELOG.md
        version_files:
          - { path: package.json, field: version }
        protected_paths: []
        surfaces: {}
        bot_branches: {}
      kind: ordinary
      changes:
        - { path: "package.json", protected_field_changed: true }
    expected: {code: "protected-path"}
    classification: must-fail
    sibling: version-other-fields
    provenance: {source: requirement, ref: "protected paths: the protected field is written only by the release PR"}
    mutation: {description: "an author edit to the version field"}
  - name: version-other-fields
    input:
      config:
        releases: true
        tag_prefix: fairtrade-v
        automation_author: peasant-labs-releaser[bot]
        changelog: CHANGELOG.md
        version_files:
          - { path: package.json, field: version }
        protected_paths: []
        surfaces: {}
        bot_branches: {}
      kind: ordinary
      changes:
        - { path: "package.json", protected_field_changed: false }
    expected: {}
    classification: must-pass
    provenance: {source: requirement, ref: "protected paths: a version file is protected by field, not by file"}
    mutation: {description: "an author edit to the same file outside the protected field"}
  - name: unrelated-file
    input:
      config:
        releases: true
        tag_prefix: fairtrade-v
        automation_author: peasant-labs-releaser[bot]
        changelog: CHANGELOG.md
        version_files:
          - { path: package.json, field: version }
        protected_paths: []
        surfaces: {}
        bot_branches: {}
      kind: ordinary
      changes:
        - { path: "src/graph.ts", protected_field_changed: false }
    expected: {}
    classification: must-pass
    provenance: {source: requirement, ref: "protected paths: ordinary content is never protected"}
    mutation: {description: "an author edit to ordinary content"}
  - name: glob-protected
    input:
      config:
        releases: true
        tag_prefix: v
        automation_author: peasant-labs-releaser[bot]
        changelog: CHANGELOG.md
        version_files: []
        protected_paths:
          - generated/*
        surfaces: {}
        bot_branches: {}
      kind: ordinary
      changes:
        - { path: "generated/types-0.1.0.json", protected_field_changed: false }
    expected: {code: "protected-path"}
    classification: must-fail
    sibling: unrelated-file
    provenance: {source: requirement, ref: "protected paths: a glob entry covers its matches"}
    mutation: {description: "an author edit to a glob-protected path"}
  - name: release-pr-may-change
    input:
      config:
        releases: true
        tag_prefix: fairtrade-v
        automation_author: peasant-labs-releaser[bot]
        changelog: CHANGELOG.md
        version_files:
          - { path: package.json, field: version }
        protected_paths: []
        surfaces: {}
        bot_branches: {}
      kind: release
      changes:
        - { path: "CHANGELOG.md", protected_field_changed: false }
        - { path: "package.json", protected_field_changed: true }
    expected: {}
    classification: must-pass
    provenance: {source: requirement, ref: "protected paths: the release PR is exempt"}
    mutation: {description: "the release PR writing its own content"}
  - name: protected-found-among-many
    input:
      config:
        releases: true
        tag_prefix: v
        automation_author: peasant-labs-releaser[bot]
        changelog: CHANGELOG.md
        version_files: []
        protected_paths: []
        surfaces: {}
        bot_branches: {}
      kind: ordinary
      changes:
        - { path: "a.go", protected_field_changed: false }
        - { path: "b.go", protected_field_changed: false }
        - { path: "c.go", protected_field_changed: false }
        - { path: "d.go", protected_field_changed: false }
        - { path: "e.go", protected_field_changed: false }
        - { path: "f.go", protected_field_changed: false }
        - { path: "g.go", protected_field_changed: false }
        - { path: "h.go", protected_field_changed: false }
        - { path: "i.go", protected_field_changed: false }
        - { path: "CHANGELOG.md", protected_field_changed: false }
    expected: {code: "protected-path"}
    classification: must-fail
    sibling: unrelated-file
    provenance: {source: requirement, ref: "protected paths: one protected path among many changes is seen"}
    mutation: {description: "buried the protected edit last in a long change list"}
  - name: empty-change
    input:
      config:
        releases: true
        tag_prefix: v
        automation_author: peasant-labs-releaser[bot]
        changelog: CHANGELOG.md
        version_files: []
        protected_paths: []
        surfaces: {}
        bot_branches: {}
      kind: ordinary
      changes: []
    expected: {}
    classification: must-pass
    provenance: {source: boundary, ref: "protected paths: an empty change touches nothing protected"}
    mutation: {description: "an empty change list"}
  - name: release-pr-source-file
    input:
      config:
        releases: true
        tag_prefix: fairtrade-v
        automation_author: peasant-labs-releaser[bot]
        changelog: CHANGELOG.md
        version_files:
          - { path: package.json, field: version }
        protected_paths: ["generated/*.json"]
        surfaces: {}
        bot_branches: {release: automation/release, cut-release: automation/cut-release}
      kind: release
      changes:
        - { path: "CHANGELOG.md", protected_field_changed: false, other_content_changed: false }
        - { path: "package.json", protected_field_changed: true, other_content_changed: false }
        - { path: "src/graph.ts", protected_field_changed: false, other_content_changed: false }
    expected: {code: "release-content-scope"}
    classification: must-fail
    sibling: release-pr-may-change
    provenance: {source: requirement, ref: "release scope: the release PR writes only the changelog and the protected version fields"}
    mutation: {description: "added a source file to the release PR"}
  - name: release-pr-version-other-content
    input:
      config:
        releases: true
        tag_prefix: fairtrade-v
        automation_author: peasant-labs-releaser[bot]
        changelog: CHANGELOG.md
        version_files:
          - { path: package.json, field: version }
        protected_paths: ["generated/*.json"]
        surfaces: {}
        bot_branches: {release: automation/release, cut-release: automation/cut-release}
      kind: release
      changes:
        - { path: "CHANGELOG.md", protected_field_changed: false, other_content_changed: false }
        - { path: "package.json", protected_field_changed: true, other_content_changed: true }
    expected: {code: "release-content-scope"}
    classification: must-fail
    sibling: release-pr-may-change
    provenance: {source: requirement, ref: "release scope: a version file changes only in its protected field"}
    mutation: {description: "changed another field of the version file in the release PR"}
  - name: release-pr-protected-path
    input:
      config:
        releases: true
        tag_prefix: fairtrade-v
        automation_author: peasant-labs-releaser[bot]
        changelog: CHANGELOG.md
        version_files:
          - { path: package.json, field: version }
        protected_paths: ["generated/*.json"]
        surfaces: {}
        bot_branches: {release: automation/release, cut-release: automation/cut-release}
      kind: release
      changes:
        - { path: "generated/types-0.2.0.json", protected_field_changed: false, other_content_changed: false }
    expected: {code: "release-content-scope"}
    classification: must-fail
    sibling: release-pr-may-change
    provenance: {source: requirement, ref: "release scope: a protected path is not release content"}
    mutation: {description: "added a protected path to the release PR"}
  - name: release-pr-deletes-version-file
    input:
      config:
        releases: true
        tag_prefix: fairtrade-v
        automation_author: peasant-labs-releaser[bot]
        changelog: CHANGELOG.md
        version_files:
          - { path: package.json, field: version }
        protected_paths: ["generated/*.json"]
        surfaces: {}
        bot_branches: {release: automation/release, cut-release: automation/cut-release}
      kind: release
      changes:
        - { path: "package.json", protected_field_changed: true, other_content_changed: true }
    expected: {code: "release-content-scope"}
    classification: must-fail
    sibling: release-pr-may-change
    provenance: {source: requirement, ref: "release scope: removing a version file moves more than its field"}
    mutation: {description: "deleted the version file in the release PR"}
  - name: cut-release-empty
    input:
      config:
        releases: true
        tag_prefix: fairtrade-v
        automation_author: peasant-labs-releaser[bot]
        changelog: CHANGELOG.md
        version_files:
          - { path: package.json, field: version }
        protected_paths: ["generated/*.json"]
        surfaces: {}
        bot_branches: {release: automation/release, cut-release: automation/cut-release}
      kind: cut-release
      changes: []
    expected: {}
    classification: must-pass
    provenance: {source: requirement, ref: "cut-release scope: the cut-release PR is one empty commit"}
    mutation: {description: "the empty cut-release commit"}
  - name: cut-release-file
    input:
      config:
        releases: true
        tag_prefix: fairtrade-v
        automation_author: peasant-labs-releaser[bot]
        changelog: CHANGELOG.md
        version_files:
          - { path: package.json, field: version }
        protected_paths: ["generated/*.json"]
        surfaces: {}
        bot_branches: {release: automation/release, cut-release: automation/cut-release}
      kind: cut-release
      changes:
        - { path: "src/graph.ts", protected_field_changed: false, other_content_changed: false }
    expected: {code: "release-content-scope"}
    classification: must-fail
    sibling: cut-release-empty
    provenance: {source: requirement, ref: "cut-release scope: the cut-release PR changes no path"}
    mutation: {description: "added a file to the cut-release commit"}
  - name: cut-release-changelog
    input:
      config:
        releases: true
        tag_prefix: fairtrade-v
        automation_author: peasant-labs-releaser[bot]
        changelog: CHANGELOG.md
        version_files:
          - { path: package.json, field: version }
        protected_paths: ["generated/*.json"]
        surfaces: {}
        bot_branches: {release: automation/release, cut-release: automation/cut-release}
      kind: cut-release
      changes:
        - { path: "CHANGELOG.md", protected_field_changed: false, other_content_changed: false }
    expected: {code: "release-content-scope"}
    classification: must-fail
    sibling: cut-release-empty
    provenance: {source: requirement, ref: "cut-release scope: the cut-release PR does not write the changelog either"}
    mutation: {description: "wrote the changelog in the cut-release commit"}
