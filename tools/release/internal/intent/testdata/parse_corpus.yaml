  - name: verdict-none
    input: {set: verdict, raw: ""}
    expected: {member: ""}
    classification: must-pass
    provenance: {source: requirement, ref: "verdict: no report is the member spelled as the empty string"}
    mutation: {description: "gave no report"}
  - name: verdict-unknown
    input: {set: verdict, raw: "passed"}
    expected: {}
    classification: must-fail
    sibling: verdict-taggable
    provenance: {source: boundary, ref: "verdict: a word outside the closed set proves nothing"}
    mutation: {description: "used a verdict word no member holds"}
  - name: gate-hold
    input: {set: gate, raw: "hold"}
    expected: {member: "hold"}
    classification: must-pass
    provenance: {source: enum, ref: "intent.AllGates"}
    mutation: {description: "a known gate"}
  - name: gate-unknown
