# Closed-set boundary corpus: rows of every Parse function that reads a
# closed-set value from outside text. An accept row names the member the
# text selects; a reject row carries text that selects no member and must be
# refused, never read as a default.
required_names:
  - mode-tag
  - mode-plan-only
  - mode-unset-plans
  - mode-misspelled
  - mode-wrong-case
  - mode-padded
  - mode-truthy-word
  - type-feat
  - type-unknown
  - type-empty
  - type-wrong-case
  - level-none
  - level-major
  - level-empty
  - level-unknown
  - class-may-release
  - class-unknown
  - class-empty
  - action-open-pr
  - action-unknown
  - action-empty
  - verdict-taggable
  - verdict-none
  - verdict-unknown
  - gate-hold
  - gate-unknown
  - gate-empty
  - freshness-stale
  - freshness-unknown-member
  - freshness-misspelled
  - freshness-empty
  - pr-kind-vendor-hash
  - pr-kind-unknown
  - pr-kind-empty
  - error-code-protected-path
  - error-code-unknown
  - error-code-empty
  - output-key-candidate-fresh
  - output-key-unknown
  - output-key-empty
  - repo-variable-floor
  - repo-variable-unknown
  - repo-variable-wrong-case
cases:
  - name: mode-tag
    input: {set: mode, raw: "tag"}
    expected: {member: "tag"}
    classification: must-pass
    provenance: {source: requirement, ref: "mode: the member's own spelling arms the release job"}
    mutation: {description: "the arming value"}
  - name: mode-plan-only
    input: {set: mode, raw: "plan-only"}
    expected: {member: "plan-only"}
    classification: must-pass
    provenance: {source: requirement, ref: "mode: the member's own spelling plans without writing"}
    mutation: {description: "the deliberate plan-only value"}
  - name: mode-unset-plans
    input: {set: mode, raw: ""}
    expected: {member: "plan-only"}
    classification: must-pass
    provenance: {source: requirement, ref: "mode: an unset repository variable plans without writing"}
    mutation: {description: "left the repository variable unset"}
  - name: mode-misspelled
    input: {set: mode, raw: "tags"}
    expected: {}
    classification: must-fail
    sibling: mode-tag
    provenance: {source: boundary, ref: "mode: a misspelled value is refused, never read as plan-only"}
    mutation: {description: "added a letter to the arming value"}
  - name: mode-wrong-case
    input: {set: mode, raw: "Tag"}
    expected: {}
    classification: must-fail
    sibling: mode-tag
    provenance: {source: boundary, ref: "mode: spelling is exact"}
    mutation: {description: "capitalised the arming value"}
  - name: mode-padded
    input: {set: mode, raw: " tag"}
    expected: {}
    classification: must-fail
    sibling: mode-tag
    provenance: {source: boundary, ref: "mode: surrounding space is not trimmed into a member"}
    mutation: {description: "put a space before the arming value"}
  - name: mode-truthy-word
    input: {set: mode, raw: "true"}
    expected: {}
    classification: must-fail
    sibling: mode-tag
    provenance: {source: boundary, ref: "mode: a truthy word is not the arming value"}
    mutation: {description: "wrote a boolean word for the mode"}
  - name: type-feat
    input: {set: type, raw: "feat"}
    expected: {member: "feat"}
    classification: must-pass
    provenance: {source: enum, ref: "intent.AllTypes"}
    mutation: {description: "a known title type"}
  - name: type-unknown
    input: {set: type, raw: "feature"}
    expected: {}
    classification: must-fail
    sibling: type-feat
    provenance: {source: boundary, ref: "type: a word outside the closed set is refused"}
    mutation: {description: "spelled the type out in full"}
  - name: type-empty
    input: {set: type, raw: ""}
    expected: {}
    classification: must-fail
    sibling: type-feat
    provenance: {source: boundary, ref: "type: the empty string is no type"}
    mutation: {description: "emptied the type"}
  - name: type-wrong-case
    input: {set: type, raw: "Feat"}
    expected: {}
    classification: must-fail
    sibling: type-feat
    provenance: {source: boundary, ref: "type: spelling is exact"}
    mutation: {description: "capitalised the type"}
  - name: level-none
    input: {set: level, raw: "none"}
    expected: {member: "none"}
    classification: must-pass
    provenance: {source: enum, ref: "intent.AllLevels"}
    mutation: {description: "the no-release level by its own word"}
  - name: level-major
    input: {set: level, raw: "major"}
    expected: {member: "major"}
    classification: must-pass
    provenance: {source: enum, ref: "intent.AllLevels"}
    mutation: {description: "the highest level"}
  - name: level-empty
    input: {set: level, raw: ""}
    expected: {}
    classification: must-fail
    sibling: level-none
    provenance: {source: boundary, ref: "level: the empty string is not read as no release"}
    mutation: {description: "emptied the level"}
  - name: level-unknown
    input: {set: level, raw: "micro"}
    expected: {}
    classification: must-fail
    sibling: level-major
    provenance: {source: boundary, ref: "level: a word outside the closed set is refused"}
    mutation: {description: "used a level word no member holds"}
  - name: class-may-release
    input: {set: class, raw: "may-release"}
    expected: {member: "may-release"}
    classification: must-pass
    provenance: {source: enum, ref: "intent.AllClasses"}
    mutation: {description: "a known class"}
  - name: class-unknown
    input: {set: class, raw: "sometimes-release"}
    expected: {}
    classification: must-fail
    sibling: class-may-release
    provenance: {source: boundary, ref: "class: a word outside the closed set is refused"}
    mutation: {description: "used a class word no member holds"}
  - name: class-empty
    input: {set: class, raw: ""}
    expected: {}
    classification: must-fail
    sibling: class-may-release
    provenance: {source: boundary, ref: "class: the empty string is no class"}
    mutation: {description: "emptied the class"}
  - name: action-open-pr
    input: {set: action, raw: "open-pr"}
    expected: {member: "open-pr"}
    classification: must-pass
    provenance: {source: enum, ref: "intent.AllActions"}
    mutation: {description: "a known action"}
  - name: action-unknown
    input: {set: action, raw: "open_pr"}
    expected: {}
    classification: must-fail
    sibling: action-open-pr
    provenance: {source: boundary, ref: "action: a word outside the closed set is refused"}
    mutation: {description: "swapped the hyphen for an underscore"}
  - name: action-empty
    input: {set: action, raw: ""}
    expected: {}
    classification: must-fail
    sibling: action-open-pr
    provenance: {source: boundary, ref: "action: the empty string is not read as the none action"}
    mutation: {description: "emptied the action"}
  - name: verdict-taggable
    input: {set: verdict, raw: "taggable"}
    expected: {member: "taggable"}
    classification: must-pass
    provenance: {source: enum, ref: "intent.AllVerdicts"}
