# Positive invariant for infra's pinned ast-grep install in unstring.yml.
# Global npm install rejection across all workflows is enforced by
# QueueRulePrivateNpm (testdata/npm-install.yaml and check-workflows).
prefix_pattern: '(?m)^[ \t]*prefix="\$RUNNER_TEMP/[^"\n]+"[ \t]*$'
install_pattern: '(?m)^[ \t]*npm\s+(install|i|add|in|ins)\b[^\n]*--prefix[= \t]+"\$prefix"[^\n]*@ast-grep/cli@0\.51\.2(?:[ \t]|$)'
path_pattern: '(?m)^[ \t]*echo[ \t]+"\$prefix/node_modules/\.bin"[ \t]*>>[ \t]*"\$GITHUB_PATH"[ \t]*$'
workflow: unstring.yml
job: test
step: Install ast-grep
