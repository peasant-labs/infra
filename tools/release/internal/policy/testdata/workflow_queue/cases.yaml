  - name: reject-pretag-second-command
    input:
      overlay: accept-pretag-checks
      edits: [{file: workflows/release-batch.yml, old: "nix develop -c schema-gen freeze --check", new: "nix develop -c schema-gen freeze --check && true"}]
    expected: {rule: release-actions-gated, want_contains: ["does not run exactly one command"]}
    sibling: accept-pretag-checks
    classification: must-fail
    provenance: *pretag_provenance
    mutation: *pretag_mutation
  - name: reject-range-floor-contract
    input:
      overlay: accept-pretag-checks
      edits: [{file: workflows/release-batch.yml, old: 'release-intent check-contract --report "${REPORT}" --until "${UNTIL}" --floor "${FLOOR}"', new: 'release-intent check-contract --report "${REPORT}" --until "${UNTIL}"'}]
    expected: {rule: range-readers-take-the-floor, want_contains: ["without a quoted --floor"]}
    sibling: accept-pretag-checks
    classification: must-fail
    provenance: *pretag_provenance
    mutation: *pretag_mutation
  - name: accept-range-floor-freeze-plan
    input:
      overlay: accept-pretag-checks
      edits:
        - file: workflows/release-batch.yml
          old: "      - id: write\n"
          new: "      - id: freeze-plan\n        if: \"!cancelled() && steps.decide.outputs.action == 'open-pr'\"\n        run: release-intent freeze-plan --branch develop --state state.yaml --out plan.yaml --floor \"${{ vars.RELEASE_BATCH_FLOOR }}\"\n      - id: write\n"
    expected: {rule: range-readers-take-the-floor}
    classification: must-pass
    provenance: *pretag_provenance
    mutation: *pretag_mutation
  - name: reject-range-floor-freeze-plan
    input:
      overlay: accept-pretag-checks
      edits:
        - file: workflows/release-batch.yml
          old: "      - id: write\n"
          new: "      - id: freeze-plan\n        if: \"!cancelled() && steps.decide.outputs.action == 'open-pr'\"\n        run: release-intent freeze-plan --branch develop --state state.yaml --out plan.yaml\n      - id: write\n"
    expected: {rule: range-readers-take-the-floor, want_contains: ["without a quoted --floor"]}
    sibling: accept-range-floor-freeze-plan
    classification: must-fail
    provenance: *pretag_provenance
