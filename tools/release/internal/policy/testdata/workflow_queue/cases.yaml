      edits:
        - file: workflows/release-batch.yml
          old: "      - id: write\n"
          new: "      - id: freeze-plan\n        if: \"!cancelled() && steps.decide.outputs.action == 'open-pr'\"\n        run: release-intent freeze-plan --branch develop --state state.yaml --out plan.yaml\n      - id: write\n"
    expected: {rule: range-readers-take-the-floor, want_contains: ["without a quoted --floor"]}
