# Merge-queue workflow policy corpus: the base tree plus one small overlay per
# case. The harness copies base/ into a temp dir, applies the case overlay,
# and runs the production CheckWorkflows over it. A must-pass case must yield
# no diagnostics; a must-fail case must trip only its expected rule, with
# every want_contains fragment in the diagnostics. Every must-fail row names
# its accept sibling, which proves the sample fails for the one fault it names
# and not for an unrelated input error.
#
# required_names is the manifest: every case must be listed and every listed
# case must exist, so a dropped or stray sample fails loudly.
required_names:
  - accept-required-contexts
  - accept-merge-group
  - accept-concurrency
  - accept-release-actions
  - accept-title-guard
  - accept-range-floor
  - accept-token-mint
