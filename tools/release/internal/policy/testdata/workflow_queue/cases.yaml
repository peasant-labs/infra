  - name: accept-comment-job
    input: { overlay: accept-comment-job }
    expected: { rule: credential-steps-run-one-template }
    classification: must-pass
    provenance: { source: requirement, ref: "listed pull request comment" }
    mutation: { description: "Comment only on the triggering pull request." }
  - name: accept-comment-job-no-checkout
    input:
      overlay: accept-comment-job
      edits:
        - file: workflows/journey.yml
          old: "      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09\n        with:\n          ref: ${{ github.event.repository.default_branch }}\n          persist-credentials: false\n"
          new: ""
    expected: { rule: credential-steps-run-one-template }
    classification: must-pass
    provenance: { source: requirement, ref: "comment without checkout" }
    mutation: { description: "Name the current repository explicitly without a checkout." }
  - name: accept-reviewed-script
    input: { overlay: accept-reviewed-script }
    expected: { rule: credential-steps-run-one-template }
    classification: must-pass
    provenance: { source: requirement, ref: "reviewed inline evidence" }
    mutation: { description: "Run the default-branch script with separately downloaded evidence." }
  - name: accept-comment-pat
    input:
      overlay: accept-comment-job
      edits:
        - file: workflows/journey.yml
          old: "GH_TOKEN: ${{ steps.bot.outputs.token }}"
          new: "GH_TOKEN: ${{ secrets.JOURNEY_GITHUB_USER_PAT }}"
    expected: { rule: credentials-stay-in-listed-jobs }
    classification: must-pass
    provenance: { source: requirement, ref: "policy-named personal token" }
    mutation: { description: "Use the named personal token only in the comment step environment." }
  - name: accept-atomic-release-assets
    input: { overlay: accept-atomic-release-assets }
    expected: { rule: release-assets-one-atomic-create }
    classification: must-pass
    provenance: { source: requirement, ref: "release assets handoff" }
    mutation: { description: "Publish the verified build artifact through the pinned action." }
  - name: accept-publisher-job-concurrency
    input:
      overlay: accept-atomic-release-assets
      edits:
        - file: workflows/release.yml
          old: "concurrency:\n  group: release-${{ github.ref_name }}\n  cancel-in-progress: false\n"
          new: ""
        - file: workflows/release.yml
          old: "    needs: [verify, build]\n    runs-on: ubuntu-24.04\n"
          new: "    needs: [verify, build]\n    runs-on: ubuntu-24.04\n    concurrency:\n      group: publish-${{ github.ref }}\n      cancel-in-progress: false\n"
    expected: { rule: release-assets-one-atomic-create }
    classification: must-pass
    provenance: { source: requirement, ref: "one publish run per tag" }
    mutation: { description: "The publish job, not the workflow, holds one run per tag." }

  - name: reject-publisher-no-concurrency
    input:
      overlay: accept-atomic-release-assets
      edits:
        - file: workflows/release.yml
          old: "concurrency:\n  group: release-${{ github.ref_name }}\n  cancel-in-progress: false\n"
          new: ""
    expected: { rule: release-assets-one-atomic-create, want_contains: ["without a concurrency group keyed on the tag"] }
    sibling: accept-atomic-release-assets
    classification: must-fail
    provenance: { source: requirement, ref: "one publish run per tag" }
    mutation: { description: "Drop the concurrency group: two runs of one tag can each publish." }

  - name: reject-publisher-concurrency-cancels
    input:
      overlay: accept-atomic-release-assets
      edits:
        - file: workflows/release.yml
          old: "concurrency:\n  group: release-${{ github.ref_name }}\n  cancel-in-progress: false\n"
          new: "concurrency:\n  group: release-${{ github.ref_name }}\n  cancel-in-progress: true\n"
    expected: { rule: release-assets-one-atomic-create, want_contains: ["cancel-in-progress: false"] }
    sibling: accept-atomic-release-assets
    classification: must-fail
    provenance: { source: requirement, ref: "one publish run per tag" }
    mutation: { description: "Let a second run cancel a publish between its upload and its cleanup." }

  - name: reject-publisher-concurrency-cancel-implicit
    input:
      overlay: accept-atomic-release-assets
      edits:
        - file: workflows/release.yml
