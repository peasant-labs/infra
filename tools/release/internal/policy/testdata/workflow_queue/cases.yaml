cases:
  - name: accept-release-protected-writes
    input:
      overlay: accept-pretag-checks
      edits:
        - {file: workflows/release-batch.yml, old: "      - id: write\n", new: "      - id: freeze\n        if: \"!cancelled() && steps.decide.outputs.action == 'open-pr'\"\n        run: schema-gen freeze --plan plan.yaml\n      - id: write\n"}
        - {file: workflows/release-batch.yml, old: 'release-intent release-pr --branch develop --current automation/release --write --floor "${{ vars.RELEASE_BATCH_FLOOR }}"', new: 'release-intent release-pr --branch develop --current automation/release --commit --floor "${{ vars.RELEASE_BATCH_FLOOR }}"'}
    expected: {rule: release-actions-gated}
    classification: must-pass
    provenance: &protect_writes_p {source: requirement, ref: "release preparation in the uncredentialed plan job"}
    mutation: &protect_writes_m {description: "Prepare freeze outputs before the gated release commit."}
  - name: accept-pretag-flake-wrapper
    input:
      overlay: accept-pretag-checks
      edits: [{file: workflows/release-batch.yml, old: "nix develop -c schema-gen freeze --check", new: "nix develop '.#release' -c schema-gen freeze --check --plan plan.yaml"}]
    expected: {rule: release-actions-gated}
    classification: must-pass
    provenance: &extra_p {source: requirement, ref: "closed wrappers and range calls"}
    mutation: &extra_m {description: "Change the command wrapper or range-reader arguments."}
  - name: reject-pretag-double-wrapper
    input:
      overlay: accept-pretag-checks
      edits: [{file: workflows/release-batch.yml, old: "nix develop -c schema-gen freeze --check", new: "nix develop -c nix develop -c schema-gen freeze --check"}]
    expected: {rule: release-actions-gated, want_contains: ["instead of its declared check"]}
    sibling: accept-pretag-checks
    classification: must-fail
    provenance: *extra_p
    mutation: *extra_m
  - name: accept-contract-pr-without-floor
    input:
      overlay: accept-pretag-checks
      edits:
        - {file: workflows/release-batch.yml, old: "      - id: write\n", new: "      - id: contract-pr\n        run: release-intent check-contract --report report.yaml\n      - id: write\n"}
    expected: {rule: range-readers-take-the-floor}
    classification: must-pass
    provenance: *extra_p
    mutation: *extra_m
  - name: reject-range-floor-borrowed-from-second-call
    input:
      overlay: accept-pretag-checks
      edits:
        - file: workflows/release-batch.yml
          old: "      - id: write\n"
          new: "      - id: freeze-plan\n        if: \"!cancelled() && steps.decide.outputs.action == 'open-pr'\"\n        run: release-intent freeze-plan --branch develop --state state.yaml --out plan.yaml && release-intent freeze-plan --branch develop --state state.yaml --out plan.yaml --floor \"${{ vars.RELEASE_BATCH_FLOOR }}\"\n      - id: write\n"
    expected: {rule: range-readers-take-the-floor, want_contains: ["without a quoted --floor"]}
    sibling: accept-range-floor-freeze-plan
    classification: must-fail
    provenance: *extra_p
    mutation: *extra_m
  - name: accept-pretag-checks
    input: {overlay: accept-pretag-checks}
    expected: {rule: release-actions-gated}
    classification: must-pass
    provenance: &pretag_provenance {source: requirement, ref: "typed pre-tag check commands"}
    mutation: &pretag_mutation {description: "Change one declared pre-tag check or range floor."}
  - name: accept-no-pretag-steps
