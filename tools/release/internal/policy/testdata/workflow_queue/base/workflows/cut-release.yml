name: Cut release
on:
  workflow_dispatch:
    inputs:
      level:
        description: Release level
        type: choice
        options: [patch, minor]
concurrency:
  group: cut-release-${{ github.ref }}
permissions:
  contents: read
jobs:
  prepare:
    if: github.ref == 'refs/heads/develop' && vars.RELEASE_BATCH_MODE == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - id: commit
        run: |
          git checkout -B automation/cut-release
          git commit --allow-empty -m "release[patch]: cut a release"
          git bundle create cut.bundle refs/heads/automation/cut-release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cut-bundle
          path: cut.bundle
  cut:
    needs: [prepare]
    if: github.ref == 'refs/heads/develop' && vars.RELEASE_BATCH_MODE == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cut-bundle
          path: bundle
      - id: mint
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ vars.RELEASER_APP_ID }}
          private-key: ${{ secrets.RELEASER_APP_KEY }}
      - id: fetch
        if: vars.RELEASE_BATCH_MODE == 'tag'
        run: git fetch --no-tags bundle/cut.bundle automation/cut-release:automation/cut-release
      - id: push
        if: vars.RELEASE_BATCH_MODE == 'tag'
        env:
          APP_TOKEN: ${{ steps.mint.outputs.token }}
        run: |
          git -c http.extraheader="AUTHORIZATION: bearer ${APP_TOKEN}" push --force origin automation/cut-release
      - id: open
        if: vars.RELEASE_BATCH_MODE == 'tag'
        env:
          GH_TOKEN: ${{ steps.mint.outputs.token }}
        run: gh pr create --head automation/cut-release --base develop --title "cut" --body "bot"
