name: CI
on:
  pull_request:
  merge_group:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  lib:
    runs-on: ubuntu-latest
    steps:
      - run: make lib
  merge-gate:
    if: always()
    needs: [lib]
    runs-on: ubuntu-latest
    steps:
      - run: echo gate
  sync:
    runs-on: ubuntu-latest
    steps:
      - run: |
          git -c http.extraheader="AUTHORIZATION: bearer ${APP_TOKEN}" push origin HEAD:automation/release
