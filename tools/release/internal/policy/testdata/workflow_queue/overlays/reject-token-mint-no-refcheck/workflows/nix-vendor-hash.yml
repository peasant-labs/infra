name: Vendor hash
on:
  push:
    branches: [develop]
  workflow_dispatch:
  schedule:
    - cron: "11 * * * *"
concurrency:
  group: vendor-hash-${{ github.ref }}
permissions:
  contents: read
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@c134e4c9e34bac6cab09cf239815f9339aaaf84e
      - id: mint
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ vars.RELEASER_APP_ID }}
          private-key: ${{ secrets.RELEASER_APP_KEY }}
      - id: fix
        run: |
          nix run .#update-vendor-hash
          git checkout -B automation/vendor-hash
          git commit -am "fix(nix): refresh the vendor hash"
      - env:
          APP_TOKEN: ${{ steps.mint.outputs.token }}
        run: |
          git -c http.extraheader="AUTHORIZATION: bearer ${APP_TOKEN}" push --force-with-lease origin HEAD:automation/vendor-hash
      - env:
          GH_TOKEN: ${{ steps.mint.outputs.token }}
        run: gh pr create --head automation/vendor-hash --base develop --title "vendor" --body "bot"
