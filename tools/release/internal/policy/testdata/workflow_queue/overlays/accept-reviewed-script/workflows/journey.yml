name: Journey
on: [pull_request, merge_group]
permissions:
  contents: read
jobs:
  journey:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: journey-artifacts
          path: evidence
  evidence:
    needs: [journey]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: reviewed
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: journey-artifacts
          path: notes
      - id: bot
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.JOURNEY_APP_CLIENT_ID }}
          private-key: ${{ secrets.JOURNEY_APP_PRIVATE_KEY }}
          owner: peasant-labs
          repositories: village
          permission-contents: read
          permission-issues: write
          permission-pull-requests: write
      - name: Post evidence
        env:
          GH_TOKEN: ${{ secrets.JOURNEY_GITHUB_USER_PAT || steps.bot.outputs.token }}
          JOURNEY_APP_TOKEN: ${{ steps.bot.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVIDENCE_DIR: notes
        run: node reviewed/frontend/scripts/journey/ci-post-evidence.mjs
