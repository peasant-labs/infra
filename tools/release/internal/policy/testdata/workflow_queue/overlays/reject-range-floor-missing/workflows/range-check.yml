name: Range check
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  range-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          repository: peasant-labs/infra
          ref: 71e687cef7eede9a63659be98ce9adac3c563398
          path: infra-tool
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: infra-tool/tools/release/go.mod
      - name: Build release-intent
        working-directory: infra-tool
        run: |
          go build -o "$RUNNER_TEMP/release-intent" ./tools/release/cmd/release-intent
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: release-intent release-pr --branch develop --check
        env:
          FLOOR: ${{ vars.RELEASE_BATCH_FLOOR }}
