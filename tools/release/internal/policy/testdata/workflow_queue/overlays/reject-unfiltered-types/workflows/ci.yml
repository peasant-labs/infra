name: CI
on:
  pull_request:
    types: [opened, reopened, labeled]
  merge_group:
concurrency:
  group: ci-${{ github.ref }}
jobs:
  lib:
    runs-on: ubuntu-latest
    steps:
      - run: make lib
  merge-gate:
    if: always()
    needs: [lib]
    runs-on: ubuntu-latest
    steps:
      - run: echo gate
