name: CI
on:
  pull_request:
  merge_group:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      actions: read
    outputs:
      inherit: ${{ steps.inherit.outputs.inherit }}
    steps:
      - id: inherit
        run: release-intent inherit-verdict --base "$BASE" --head "$HEAD" --repo "$GITHUB_REPOSITORY"
  lib:
    name: make lib
    needs: changes
    if: needs.changes.outputs.inherit != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - run: make lib
  merge-gate:
    if: always()
    needs: [changes, lib]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - run: echo gate
      - name: "verdict-source: full"
        if: needs.lib.result == 'success'
        run: echo full
      - name: "verdict-source: inherited"
        if: needs.changes.outputs.inherit == 'true'
        run: echo inherited
      - name: "verdict-source: unaffected"
        if: needs.lib.result == 'skipped' && needs.changes.outputs.inherit != 'true'
        run: echo unaffected
