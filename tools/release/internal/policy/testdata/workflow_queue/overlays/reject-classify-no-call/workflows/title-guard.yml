name: Title guard
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  merge_group:
concurrency:
  group: title-guard-${{ github.run_id }}
jobs:
  title-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/checkout@v5
        with:
          repository: peasant-labs/infra
          ref: 71e687cef7eede9a63659be98ce9adac3c563398
          path: infra-tool
      - uses: actions/setup-go@v6
        with:
          go-version-file: infra-tool/tools/release/go.mod
      - name: Build release-intent
        working-directory: infra-tool
        run: |
          go build -o "$RUNNER_TEMP/release-intent" ./tools/release/cmd/release-intent
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - id: group
        if: github.event_name == 'merge_group'
        run: release-intent group-pr --ref ${{ github.ref }}
      - name: Check title
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        run: release-intent check-title --base ${{ github.event.pull_request.base.sha }} --head ${{ github.event.pull_request.head.sha }} --author ${{ github.event.pull_request.user.login }}
