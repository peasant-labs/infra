# Original Fairtrade files are retained byte-for-byte; preparation adapts only the older
# verifier and release guard to the current policy before the isolated mutation.
repository: "https://github.com/peasant-labs/fairtrade-design-system"
commit: "1da19970ce24a0ca5a993a8f3ee6a0a4879cbf4a"
source:
  - file: ".github/release-intent.yaml"
    sha256: "ae12d2d26dc875fda053ab0e86b15827432878b04f36d84bdb01b344cec6ad20"
  - file: ".github/release-queue.policy.yml"
    sha256: "4b425aa74d577a4caeed0ddbb11264bf291a0f5ae6ab5eed11dfc5df8cafd6bf"
  - file: ".github/workflows/ci.yml"
    sha256: "8a8bdde08965713e71093a9f57b9a55171f7c92db9c4bd6f04f3448d02c477b3"
  - file: ".github/workflows/cut-release.yml"
    sha256: "75876c95480605a7aa06e843ae93e145062c86b441292563095f25f3d9a32359"
  - file: ".github/workflows/discord-pr-notify.yml"
    sha256: "a60476e819b0d10e09ce9034f103cf39cc7c076f27c5d7e6c5394bebe678d71e"
  - file: ".github/workflows/npm-publish.yml"
    sha256: "dbfd517639b3ff1bff9b3346c4fd70fc0606f5edac8b38ec2d19166e15437e9a"
  - file: ".github/workflows/release-batch.yml"
    sha256: "c1bfaa5cc9d31fe49e7a9066debf27b44c16cd91c8e183bc20053d53220b1a9a"
  - file: ".github/workflows/release.yml"
    sha256: "fa07426597cc36732351127636be5a623e85e46bc8af0ce48f6e1de494312b72"
  - file: ".github/workflows/title-guard.yml"
    sha256: "b374021f8a3249f2fc076f137f86b2720deeb617e7ba7b332fcbf34aac37593b"
preparation:
  - file: ".github/workflows/npm-publish.yml"
    find: "          cache-dependency-path: infra-tool/tools/release/go.sum\n"
    replace: "          cache: false\n"
  - file: ".github/workflows/npm-publish.yml"
    find: "        working-directory: infra-tool/tools/release\n        run: |\n          go build -o \"${RUNNER_TEMP}/release-intent\" ./cmd/release-intent\n          echo \"${RUNNER_TEMP}\" >> \"${GITHUB_PATH}\"\n"
    replace: "        env:\n          GOWORK: \"off\"\n        run: go build -C infra-tool/tools/release -o \"${RUNNER_TEMP}/release-intent\" ./cmd/release-intent\n"
  - file: ".github/workflows/npm-publish.yml"
    find: "        run: release-intent verify-tag --tag \"${GITHUB_REF_NAME}\" --branch \"origin/${DEFAULT_BRANCH}\"\n"
    replace: "        run: '\"${RUNNER_TEMP}/release-intent\" verify-tag --tag \"${GITHUB_REF_NAME}\" --branch \"origin/${DEFAULT_BRANCH}\"'\n"
  - file: ".github/workflows/release.yml"
    find: "          cache-dependency-path: infra-tool/tools/release/go.sum\n"
    replace: "          cache: false\n"
  - file: ".github/workflows/release.yml"
    find: "        working-directory: infra-tool/tools/release\n        run: |\n          go build -o \"${RUNNER_TEMP}/release-intent\" ./cmd/release-intent\n          echo \"${RUNNER_TEMP}\" >> \"${GITHUB_PATH}\"\n"
    replace: "        env:\n          GOWORK: \"off\"\n        run: go build -C infra-tool/tools/release -o \"${RUNNER_TEMP}/release-intent\" ./cmd/release-intent\n"
  - file: ".github/workflows/release.yml"
    find: "        run: release-intent verify-tag --tag \"${GITHUB_REF_NAME}\" --branch \"origin/${DEFAULT_BRANCH}\"\n"
    replace: "        run: '\"${RUNNER_TEMP}/release-intent\" verify-tag --tag \"${GITHUB_REF_NAME}\" --branch \"origin/${DEFAULT_BRANCH}\"'\n"
  - file: ".github/workflows/release-batch.yml"
    find: "    if: github.ref == 'refs/heads/main' && needs.plan.outputs.proceed == 'true'\n"
    replace: "    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && needs.plan.outputs.proceed == 'true'\n"
  - file: ".github/workflows/release-batch.yml"
    find: "      - name: Tag the fresh release candidate\n"
    replace: "      - name: Check the release tag is on the run commit\n        id: check-tag\n        if: needs.plan.outputs.tag-action == 'tag'\n        env:\n          TAG: ${{ needs.plan.outputs.tag }}\n        run: git merge-base --is-ancestor \"refs/tags/${TAG}\" \"${GITHUB_SHA}\"\n\n      - name: Tag the fresh release candidate\n"
