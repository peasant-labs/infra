    rules: [tag-publish-verifies-the-tag]
    want_contains: ["cannot determine whether"]
    sibling: baseline-real-pilot-confined
  - name: malformed-capitalized-event
    trigger: "on: Push\n"
    rules: [tag-publish-verifies-the-tag]
    want_contains: ["cannot determine whether"]
    sibling: baseline-real-pilot-confined
  - name: malformed-tag-filter-with-contents-write
    edits:
      - file: .github/workflows/release.yml
        find: "on:\n  push:\n    tags: ['fairtrade-v*']\n"
        replace: "on:\n  push:\n    tags: ['fairtrade-v*', 42]\n"
    rules: [default-token-read-only, credentials-stay-in-listed-jobs, tag-publish-verifies-the-tag]
    want_contains: ["cannot determine whether", "contents: write"]
    sibling: baseline-real-pilot-confined
  - name: release-job-unfiltered-push
