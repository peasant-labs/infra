    sibling: "baseline-real-pilot-confined"
  - name: "effective-workflow-oidc-without-verify"
    trigger: "on:\n  push:\n"
    drop_need: true
    edits:
      - file: .github/workflows/npm-publish.yml
        find: "permissions:\n  contents: read\n\njobs:\n"
        replace: "permissions:\n  contents: read\n  id-token: write\n\njobs:\n"
      - file: .github/workflows/npm-publish.yml
        find: "    permissions:\n      contents: read # checkout only; no tag/commit is pushed from this job\n      id-token: write # mint the OIDC token npm Trusted Publishing exchanges\n"
        replace: ""
    rules: ["tag-publish-verifies-the-tag", "default-token-read-only"]
    want_contains: ["jobs.npm-publish can publish for a pushed tag"]
    sibling: "baseline-real-pilot-confined"
  - name: "release-push-default-branch"
    edits:
      - file: .github/workflows/release-batch.yml
        find: "push --force-with-lease origin automation/release"
        replace: "push --force-with-lease origin main"
    rules: ["credential-steps-run-one-template"]
    want_contains: ["jobs.release"]
    sibling: "baseline-real-pilot-confined"
  - name: "release-push-tag-to-branch"
    edits:
      - file: .github/workflows/release-batch.yml
        find: "push origin \"refs/tags/${TAG}:refs/tags/${TAG}\""
        replace: "push origin \"refs/tags/${TAG}:refs/heads/main\""
    rules: ["credential-steps-run-one-template"]
    want_contains: ["jobs.release"]
    sibling: "baseline-real-pilot-confined"
  - name: "contents-write-on-branch-workflow"
    edits:
      - file: .github/workflows/release.yml
        find: "on:\n  push:\n    tags: ['fairtrade-v*']\n"
        replace: "on:\n  push:\n    branches: [main]\n"
    rules: ["default-token-read-only", "credentials-stay-in-listed-jobs"]
    want_contains: ["contents: write"]
    sibling: "baseline-real-pilot-confined"
  - name: github-release-without-verifier
    edits:
      - file: .github/workflows/release.yml
        find: "    needs: [guard, verify, notes]\n"
        replace: "    needs: [guard, notes]\n"
    rules: [tag-publish-verifies-the-tag]
    want_contains: ["jobs.release can publish for a pushed tag"]
    sibling: baseline-real-pilot-confined
  - name: malformed-filter-expression
    trigger: "on:\n  push:\n    branches: ['${{ inputs.branch }}']\n"
    rules: [tag-publish-verifies-the-tag]
    want_contains: ["cannot determine whether"]
    sibling: baseline-real-pilot-confined
  - name: malformed-duplicate-on
    trigger: "on: workflow_dispatch\non:\n  push:\n    tags: ['fairtrade-v*']\n"
    rules: [tag-publish-verifies-the-tag]
    want_contains: ["cannot determine whether"]
    sibling: baseline-real-pilot-confined
  - name: malformed-on-alias
    trigger: "events: &events [push]\non: *events\n"
    rules: [tag-publish-verifies-the-tag]
    want_contains: ["cannot determine whether"]
    sibling: baseline-real-pilot-confined
  - name: malformed-workflow-merge
    trigger: "other: &events {on: push}\n<<: *events\non: workflow_dispatch\n"
    rules: [tag-publish-verifies-the-tag]
    want_contains: ["cannot determine whether"]
    sibling: baseline-real-pilot-confined
  - name: malformed-non-string-event
    trigger: "on: [push, 42]\n"
    rules: [tag-publish-verifies-the-tag]
    want_contains: ["cannot determine whether"]
    sibling: baseline-real-pilot-confined
  - name: malformed-empty-event-list
    trigger: "on: []\n"
    rules: [tag-publish-verifies-the-tag]
