    trigger: "on:\n  push:\n    tags: [\"fairtrade-v*\"]\n    tags-ignore: [\"*-rc*\"]\n"
    rules: ["tag-publish-verifies-the-tag"]
    want_contains: ["cannot determine whether"]
    sibling: "baseline-real-pilot-confined"
  - name: "malformed-opposing-branch-filters"
    trigger: "on:\n  push:\n    branches: [main]\n    branches-ignore: [dev]\n"
    rules: ["tag-publish-verifies-the-tag"]
    want_contains: ["cannot determine whether"]
