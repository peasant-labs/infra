    sibling: "baseline-real-pilot-confined"
  - name: "malformed-duplicate-push"
    trigger: "on:\n  push:\n    branches: [main]\n  push:\n    tags: [\"fairtrade-v*\"]\n"
    rules: ["tag-publish-verifies-the-tag"]
    want_contains: ["cannot determine whether"]
    sibling: "baseline-real-pilot-confined"
  - name: "malformed-duplicate-filter"
    trigger: "on:\n  push:\n    branches: [main]\n    branches: [dev]\n"
