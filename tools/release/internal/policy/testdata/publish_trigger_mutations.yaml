    rules: [release-tag-checked-before-push]
    want_contains: ["the workflow triggers on pushed tags"]
    sibling: baseline-real-pilot-confined
  - name: release-job-malformed-push
    edits:
      - file: .github/workflows/release-batch.yml
        find: "  push:\n    branches: [main]\n"
        replace: "  push:\n    brenches: [main]\n"
    rules: [release-tag-checked-before-push]
    want_contains: ["cannot determine whether the workflow triggers on pushed tags"]
    sibling: baseline-real-pilot-confined
  - name: unfiltered-verifier-may-fail
    trigger: "on: push\n"
    edits:
      - file: .github/workflows/npm-publish.yml
        find: "    name: verify the tag\n"
        replace: "    name: verify the tag\n    continue-on-error: true\n"
    rules: [tag-publish-verifies-the-tag]
    want_contains: ["jobs.verify sets continue-on-error"]
    sibling: safe-scalar
  - name: unfiltered-verifier-skipped
    trigger: "on: push\n"
    edits:
      - file: .github/workflows/npm-publish.yml
        find: "    name: verify the tag\n"
        replace: "    name: verify the tag\n    if: false\n"
    rules: [tag-publish-verifies-the-tag]
    want_contains: ["sets a job-level if"]
    sibling: safe-scalar
  - name: unfiltered-publisher-forces-run
    trigger: "on: push\n"
    edits:
      - file: .github/workflows/npm-publish.yml
        find: "  npm-publish:\n    needs: verify\n"
        replace: "  npm-publish:\n    needs: verify\n    if: ${{ success() || true }}\n"
    rules: [tag-publish-verifies-the-tag]
    want_contains: ["status function success()"]
    sibling: safe-scalar
  - name: unfiltered-id-token-read-only
    trigger: "on: push\n"
    drop_need: true
    edits:
      - file: .github/workflows/npm-publish.yml
        find: "      id-token: write # mint the OIDC token npm Trusted Publishing exchanges\n"
        replace: "      id-token: read\n"
    rules: []
  - name: workflow-oidc-inherited-with-verifier
    trigger: "on: push\n"
    edits:
      - file: .github/workflows/npm-publish.yml
        find: "permissions:\n  contents: read\n\njobs:\n"
        replace: "permissions:\n  contents: read\n  id-token: write\n\njobs:\n"
      - file: .github/workflows/npm-publish.yml
        find: "    permissions:\n      contents: read # checkout only; no tag/commit is pushed from this job\n      id-token: write # mint the OIDC token npm Trusted Publishing exchanges\n"
        replace: ""
    rules: [default-token-read-only]
    want_contains: ["jobs.npm-publish declares no permissions"]
    sibling: baseline-real-pilot-confined
  - name: branch-positive-and-negative-no-verify
    trigger: "on:\n  push:\n    branches: ['main', '!old-*']\n"
    drop_need: true
