# Merge-queue policy loader corpus: one inline policy document per case. A
# must-pass case must load; a must-fail case must fail with every want_contains
# fragment in the error. These rows are the reject samples for the loader's
# strict fields and value checks, plus the one accepted shape: a file whose
# only top-level key is 'queue:'.
required_names:
  - comment-policy
  - comment-without-workflow
  - comment-without-job
  - comment-invalid-pat-secret
  - comment-invalid-script
  - comment-unknown-field
  - strict-unknown-queue-key
  - strict-unknown-required-key
  - strict-unknown-release-key
  - empty-required
  - required-without-context
  - required-without-workflow
  - required-without-job
  - duplicate-context
  - release-without-workflow
  - release-without-job
  - empty-pre-tag-step
  - bot-without-kind
  - bot-with-release-kind
  - bot-with-ordinary-kind
  - jobs-key-rejected
  - no-queue-section
  - empty-document
  - queue-only
  - typed-pre-tag-steps
  - bare-pre-tag-step
  - pre-tag-missing-check
  - pre-tag-unknown-check
  - pre-tag-unknown-field
  - pre-tag-duplicate-id
  - inherit-verdict-policy
  - inherit-verdict-not-aggregator
  - inherit-verdict-without-full-suite
cases:
  - {name: inherit-verdict-policy, input: {policy: "queue:\n  required: [{context: merge-gate, workflow: ci.yml, job: merge-gate, aggregator: true}]\n  inherit_verdict: {context: merge-gate, full_suite_job: check}\n"}, expected: {}, classification: must-pass, provenance: &inherit_p {source: requirement, ref: "release-only candidates inherit the base commit's queue verdict"}, mutation: &inherit_m {description: "Change one inherit_verdict field."}}
  - {name: inherit-verdict-not-aggregator, input: {policy: "queue:\n  required: [{context: merge-gate, workflow: ci.yml, job: merge-gate}]\n  inherit_verdict: {context: merge-gate, full_suite_job: check}\n"}, expected: {want_contains: ["no required entry marked aggregator"]}, sibling: inherit-verdict-policy, classification: must-fail, provenance: *inherit_p, mutation: *inherit_m}
  - {name: inherit-verdict-without-full-suite, input: {policy: "queue:\n  required: [{context: merge-gate, workflow: ci.yml, job: merge-gate, aggregator: true}]\n  inherit_verdict: {context: merge-gate}\n"}, expected: {want_contains: ["empty full_suite_job"]}, sibling: inherit-verdict-policy, classification: must-fail, provenance: *inherit_p, mutation: *inherit_m}
  - {name: typed-pre-tag-steps, input: {policy: "queue:\n  required: [{context: title-guard, workflow: title-guard.yml, job: title-guard}]\n  release_job:\n    workflow: release-batch.yml\n    job: release\n    pre_tag_steps: [{id: verify, check: contract}]\n"}, expected: {}, classification: must-pass, provenance: &pretag_p {source: requirement, ref: "typed pre-tag policy"}, mutation: &pretag_m {description: "Change one pre-tag declaration."}}
  - {name: bare-pre-tag-step, input: {policy: "queue:\n  required: [{context: title-guard, workflow: title-guard.yml, job: title-guard}]\n  release_job:\n    workflow: release-batch.yml\n    job: release\n    pre_tag_steps: [verify]\n"}, expected: {want_contains: ["mapping {id, check}"]}, sibling: typed-pre-tag-steps, classification: must-fail, provenance: *pretag_p, mutation: *pretag_m}
  - {name: pre-tag-missing-check, input: {policy: "queue:\n  required: [{context: title-guard, workflow: title-guard.yml, job: title-guard}]\n  release_job:\n    workflow: release-batch.yml\n    job: release\n    pre_tag_steps: [{id: verify}]\n"}, expected: {want_contains: ["unknown check"]}, sibling: typed-pre-tag-steps, classification: must-fail, provenance: *pretag_p, mutation: *pretag_m}
  - {name: pre-tag-unknown-check, input: {policy: "queue:\n  required: [{context: title-guard, workflow: title-guard.yml, job: title-guard}]\n  release_job:\n    workflow: release-batch.yml\n    job: release\n    pre_tag_steps: [{id: verify, check: bogus}]\n"}, expected: {want_contains: ["unknown check"]}, sibling: typed-pre-tag-steps, classification: must-fail, provenance: *pretag_p, mutation: *pretag_m}
  - {name: pre-tag-unknown-field, input: {policy: "queue:\n  required: [{context: title-guard, workflow: title-guard.yml, job: title-guard}]\n  release_job:\n    workflow: release-batch.yml\n    job: release\n    pre_tag_steps: [{id: verify, check: contract, extra: true}]\n"}, expected: {want_contains: ["unknown pre_tag_steps key"]}, sibling: typed-pre-tag-steps, classification: must-fail, provenance: *pretag_p, mutation: *pretag_m}
  - {name: pre-tag-duplicate-id, input: {policy: "queue:\n  required: [{context: title-guard, workflow: title-guard.yml, job: title-guard}]\n  release_job:\n    workflow: release-batch.yml\n    job: release\n    pre_tag_steps: [{id: verify, check: contract}, {id: verify, check: freeze}]\n"}, expected: {want_contains: ["duplicate id"]}, sibling: typed-pre-tag-steps, classification: must-fail, provenance: *pretag_p, mutation: *pretag_m}
  - name: comment-policy
    input:
      policy: |
        queue:
          required:
            - { context: title-guard, workflow: title-guard.yml, job: title-guard }
          comment_jobs:
            - workflow: journey.yml
              job: evidence
              reviewed_script: frontend/scripts/journey/ci-post-evidence.mjs
              pat_secret: JOURNEY_GITHUB_USER_PAT
    expected: {}
    classification: must-pass
    provenance: { source: requirement, ref: "comment policy schema" }
    mutation: { description: "A listed reviewed evidence job has a literal script and secret." }
  - name: comment-without-workflow
    input:
      policy: |
        queue:
          required:
            - { context: title-guard, workflow: title-guard.yml, job: title-guard }
          comment_jobs:
            - job: evidence
    expected: { want_contains: ["has an empty workflow"] }
    sibling: comment-policy
    classification: must-fail
    provenance: { source: requirement, ref: "comment policy schema" }
    mutation: { description: "Omit the workflow." }
  - name: comment-without-job
    input:
      policy: |
        queue:
          required:
            - { context: title-guard, workflow: title-guard.yml, job: title-guard }
          comment_jobs:
            - workflow: journey.yml
    expected: { want_contains: ["has an empty job"] }
    sibling: comment-policy
    classification: must-fail
    provenance: { source: requirement, ref: "comment policy schema" }
    mutation: { description: "Omit the job." }
  - name: comment-invalid-pat-secret
    input:
      policy: |
        queue:
          required:
            - { context: title-guard, workflow: title-guard.yml, job: title-guard }
          comment_jobs:
            - { workflow: journey.yml, job: evidence, pat_secret: "secrets.PAT" }
    expected: { want_contains: ["invalid pat_secret"] }
    sibling: comment-policy
    classification: must-fail
    provenance: { source: requirement, ref: "comment policy schema" }
    mutation: { description: "Use an expression instead of a secret name." }
  - name: comment-invalid-script
    input:
      policy: |
        queue:
          required:
            - { context: title-guard, workflow: title-guard.yml, job: title-guard }
          comment_jobs:
            - { workflow: journey.yml, job: evidence, reviewed_script: "../script.mjs" }
    expected: { want_contains: ["invalid reviewed_script"] }
    sibling: comment-policy
    classification: must-fail
    provenance: { source: requirement, ref: "comment policy schema" }
    mutation: { description: "Name a script outside the checkout." }
  - name: comment-unknown-field
    input:
      policy: |
        queue:
          required:
            - { context: title-guard, workflow: title-guard.yml, job: title-guard }
          comment_jobs:
            - { workflow: journey.yml, job: evidence, pat: EXAMPLE }
    expected: { want_contains: ["cannot parse"] }
    sibling: comment-policy
    classification: must-fail
    provenance: { source: requirement, ref: "comment policy schema" }
    mutation: { description: "Use an unknown comment job key." }
  - name: strict-unknown-queue-key
    input:
      policy: |
        queue:
          require: []
    expected: { want_contains: ["cannot parse"] }
    sibling: queue-only
    classification: must-fail
    provenance: { source: requirement, ref: "peasant-labs/polyrepo#83 merge-queue policy loader" }
    mutation: { description: "typo the queue key so strict fields reject it" }

  - name: strict-unknown-required-key
    input:
      policy: |
        queue:
          required:
            - { context: title-guard, workflow: title-guard.yml, job: title-guard, gare: true }
    expected: { want_contains: ["cannot parse"] }
    sibling: queue-only
    classification: must-fail
    provenance: { source: requirement, ref: "peasant-labs/polyrepo#83 merge-queue policy loader" }
    mutation: { description: "typo a required entry key so strict fields reject it" }

  - name: strict-unknown-release-key
    input:
      policy: |
        queue:
          required:
            - { context: title-guard, workflow: title-guard.yml, job: title-guard }
          release_job:
            workflow: release-batch.yml
            job: release
            brunch: automation/release
    expected: { want_contains: ["cannot parse"] }
    sibling: queue-only
    classification: must-fail
    provenance: { source: requirement, ref: "peasant-labs/polyrepo#83 merge-queue policy loader" }
    mutation: { description: "typo a release job key so strict fields reject it" }

  - name: empty-required
    input:
      policy: |
        queue:
          required: []
    expected: { want_contains: ["declares no required contexts"] }
    sibling: queue-only
    classification: must-fail
    provenance: { source: requirement, ref: "peasant-labs/polyrepo#83 merge-queue policy loader" }
    mutation: { description: "leave the required list empty" }

  - name: required-without-context
    input:
      policy: |
        queue:
          required:
            - { workflow: title-guard.yml, job: title-guard }
    expected: { want_contains: ["has an empty context"] }
    sibling: queue-only
    classification: must-fail
    provenance: { source: requirement, ref: "peasant-labs/polyrepo#83 merge-queue policy loader" }
    mutation: { description: "drop the context from a required entry" }

  - name: required-without-workflow
    input:
      policy: |
        queue:
          required:
            - { context: title-guard, job: title-guard }
    expected: { want_contains: ["has an empty workflow"] }
    sibling: queue-only
    classification: must-fail
    provenance: { source: requirement, ref: "peasant-labs/polyrepo#83 merge-queue policy loader" }
    mutation: { description: "drop the workflow from a required entry" }

  - name: required-without-job
    input:
      policy: |
        queue:
          required:
            - { context: title-guard, workflow: title-guard.yml }
    expected: { want_contains: ["has an empty job"] }
    sibling: queue-only
    classification: must-fail
    provenance: { source: requirement, ref: "peasant-labs/polyrepo#83 merge-queue policy loader" }
    mutation: { description: "drop the job from a required entry" }

  - name: duplicate-context
    input:
      policy: |
        queue:
          required:
            - { context: title-guard, workflow: a.yml, job: title-guard }
            - { context: title-guard, workflow: b.yml, job: title-guard }
    expected: { want_contains: ['declares context "title-guard" twice'] }
    sibling: queue-only
    classification: must-fail
    provenance: { source: requirement, ref: "peasant-labs/polyrepo#83 merge-queue policy loader" }
    mutation: { description: "declare one required context twice" }

  - name: release-without-workflow
    input:
      policy: |
        queue:
          required:
            - { context: title-guard, workflow: title-guard.yml, job: title-guard }
          release_job:
            job: release
    expected: { want_contains: ["has an empty workflow"] }
    sibling: queue-only
    classification: must-fail
    provenance: { source: requirement, ref: "peasant-labs/polyrepo#83 merge-queue policy loader" }
    mutation: { description: "drop the workflow from the release job" }

  - name: release-without-job
    input:
      policy: |
        queue:
          required:
            - { context: title-guard, workflow: title-guard.yml, job: title-guard }
          release_job:
            workflow: release-batch.yml
    expected: { want_contains: ["has an empty job"] }
    sibling: queue-only
    classification: must-fail
    provenance: { source: requirement, ref: "peasant-labs/polyrepo#83 merge-queue policy loader" }
    mutation: { description: "drop the job from the release job" }

  - name: empty-pre-tag-step
    input:
      policy: |
        queue:
          required:
            - { context: title-guard, workflow: title-guard.yml, job: title-guard }
          release_job:
            workflow: release-batch.yml
            job: release
            pre_tag_steps: [{id: "", check: config}]
    expected: { want_contains: ["pre_tag_steps[0] is empty"] }
    sibling: queue-only
    classification: must-fail
    provenance: { source: requirement, ref: "peasant-labs/polyrepo#83 merge-queue policy loader" }
    mutation: { description: "leave a pre-tag step id empty" }

  - name: bot-without-kind
    input:
      policy: |
        queue:
          required:
            - { context: title-guard, workflow: title-guard.yml, job: title-guard }
          bot_jobs:
            - { workflow: cut-release.yml, job: cut }
    expected: { want_contains: ["names kind"] }
    sibling: queue-only
    classification: must-fail
    provenance: { source: requirement, ref: "peasant-labs/polyrepo#83 merge-queue policy loader" }
    mutation: { description: "drop the kind from a bot job" }

  - name: bot-with-release-kind
    input:
      policy: |
        queue:
          required:
            - { context: title-guard, workflow: title-guard.yml, job: title-guard }
          bot_jobs:
            - { workflow: release-batch.yml, job: release, kind: release }
    expected: { want_contains: ["names kind"] }
    sibling: queue-only
    classification: must-fail
    provenance: { source: requirement, ref: "peasant-labs/polyrepo#83 merge-queue policy loader" }
    mutation: { description: "claim the release kind from a bot job" }

  - name: bot-with-ordinary-kind
    input:
      policy: |
        queue:
          required:
            - { context: title-guard, workflow: title-guard.yml, job: title-guard }
          bot_jobs:
            - { workflow: ci.yml, job: lib, kind: ordinary }
    expected: { want_contains: ["names kind"] }
    sibling: queue-only
    classification: must-fail
    provenance: { source: requirement, ref: "peasant-labs/polyrepo#83 merge-queue policy loader" }
    mutation: { description: "claim the ordinary kind from a bot job" }

  - name: jobs-key-rejected
    input:
      policy: |
        jobs:
          - name: guard
        queue:
          required:
            - { context: title-guard, workflow: title-guard.yml, job: title-guard, guard: true }
    expected: { want_contains: ["cannot parse", "field jobs not found"] }
    sibling: queue-only
    classification: must-fail
    provenance: { source: requirement, ref: "the queue policy file carries a queue section only; job-graph rules live in the release-guard policy file" }
    mutation: { description: "add a top-level jobs key, which belongs to the release-guard policy file" }

  - name: no-queue-section
    input:
      policy: |
        {}
    expected: { want_contains: ["has no 'queue:' section"] }
    sibling: queue-only
    classification: must-fail
    provenance: { source: boundary, ref: "a policy file without a queue section checks nothing and must not load" }
    mutation: { description: "drop the queue section, leaving an empty mapping" }

  - name: empty-document
    input:
      policy: "# nothing here\n"
    expected: { want_contains: ["has no 'queue:' section"] }
    sibling: queue-only
    classification: must-fail
    provenance: { source: boundary, ref: "an empty policy file checks nothing and must not load" }
    mutation: { description: "leave the file with a comment and no document" }

  - name: queue-only
    input:
      policy: |
        queue:
          required:
            - { context: title-guard, workflow: title-guard.yml, job: title-guard, guard: true }
          bot_jobs:
            - { workflow: cut-release.yml, job: cut, kind: cut-release }
    expected: { want_contains: [] }
    sibling: ""
    classification: must-pass
    provenance: { source: requirement, ref: "peasant-labs/polyrepo#83 merge-queue policy loader" }
    mutation: { description: "a file whose only top-level key is queue loads" }
