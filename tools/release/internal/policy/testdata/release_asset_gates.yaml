required_names:
  - published-view-or-create
  - published-reversed
  - draft-view-and-create
  - draft-wrapped
  - reject-create-only
  - reject-view-only
  - reject-success-and-success
  - reject-failure-or-success
  - reject-same-step
  - reject-extra-disjunction
  - reject-status-function
cases:
  - name: published-view-or-create
    condition: "steps.view.outcome == 'success' || steps.create.outcome == 'success'"
    first: view
    second: create
  - name: published-reversed
    condition: "steps.create.outcome == 'success' || steps.view.outcome == 'success'"
    first: create
    second: view
  - name: draft-view-and-create
    condition: "steps.view.outcome == 'failure' && steps.create.outcome == 'success'"
    first: view
    second: create
    draft: true
  - name: draft-wrapped
    condition: "${{ ( steps.find_release.outcome=='failure' && steps.create_draft.outcome=='success' ) }}"
    first: find_release
    second: create_draft
    draft: true
  - name: reject-create-only
    condition: "steps.create.outcome == 'success'"
    sibling: draft-view-and-create
  - name: reject-view-only
    condition: "steps.view.outcome == 'success'"
    sibling: draft-view-and-create
  - name: reject-success-and-success
    condition: "steps.view.outcome == 'success' && steps.create.outcome == 'success'"
    sibling: draft-view-and-create
  - name: reject-failure-or-success
    condition: "steps.view.outcome == 'failure' || steps.create.outcome == 'success'"
    sibling: draft-view-and-create
  - name: reject-same-step
    condition: "steps.view.outcome == 'failure' && steps.view.outcome == 'success'"
    sibling: draft-view-and-create
  - name: reject-extra-disjunction
    condition: "steps.view.outcome == 'failure' && steps.create.outcome == 'success' || true"
    sibling: draft-view-and-create
  - name: reject-status-function
    condition: "always() && steps.view.outcome == 'failure' && steps.create.outcome == 'success'"
    sibling: draft-view-and-create
