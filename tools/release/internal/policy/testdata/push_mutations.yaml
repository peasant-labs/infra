# One-change mutations of the realistic consumer workflow set (the queue
# corpus base: a release job with its tag step, two bot jobs, a guard, and
# CI). The harness copies the base into a temp dir, proves the copy passes,
# then replaces find with replace in one file (find must occur exactly once,
# so only that place changes) and runs the production loaders and checker.
# rules is the exact set of rules that must fire, empty for a change that
# must pass; config_error is the code the release config loader must refuse
# with instead; want_contains are fragments the diagnostics must carry.
#
# The rows cover the default branch in every refspec form against each job
# class that may hold a credential, the push options and refspecs that name
# no single branch, every form a reviewer pushed the default branch past the
# earlier reader with (a variable command word, a substitution, a pipe or a
# here-document into bash, python, node and perl, a repository script, an
# actions/github-script step), the environment and shell a credential step
# may not change, a bot branch on the default branch, and the general steps
# a credential job may still run because they hold no credential.
#
# required_names is the manifest: every case must be listed and every listed
# case must exist.
required_names:
  - release-main
  - release-head-main
  - release-refs-heads-main
  - release-force-head-main
  - cut-main
  - cut-head-main
  - cut-refs-heads-main
  - cut-force-head-main
  - vendor-main
  - vendor-head-main
  - vendor-refs-heads-main
  - vendor-force-head-main
  - release-tag-step-main
  - release-tag-step-head-main
  - release-tag-step-refs-heads-main
  - release-tag-step-force-head-main
  - release-all
  - release-branches
  - release-mirror
  - release-tags
  - release-follow-tags
  - release-delete
  - release-delete-short
  - release-delete-refspec
  - release-no-refspec
  - release-head-alone
  - release-variable
  - release-unquoted-variable
  - release-pattern
  - release-other-bot
  - cut-tag
  - vendor-all
  - vendor-other-bot
  - cut-delete-refspec
  - release-tag-literal
  - release-tag-to-branch
  - release-git-config-option
  - release-git-directory-option
  - release-in-substitution
  - release-in-bash-c
  - release-variable-command-word
  - release-quoted-variable-command
  - release-braced-default-command
  - release-substitution-command-word
  - release-pipe-into-bash
  - release-heredoc-into-bash
  - release-python
  - release-node
  - release-perl
  - release-repo-script
  - release-bash-script
  - release-chained-push
  - release-github-script
  - release-env-bash-env
  - release-shell-override
  - release-merge-admin
  - release-pr-create-other-head
  - release-queue-mutation
  - release-config-default-branch
  - general-interpreters-in-release-job
  - general-repo-scripts-in-release-job
  - general-shell-forms-in-bot-job
cases:
  - name: release-main
    workflow: release-batch.yml
    find: "push --force-with-lease origin automation/release"
    replace: "push --force-with-lease origin main"
    rules: [credential-steps-run-one-template]
    want_contains: ["the refspec \"main\" is not the job's own bot branch \"automation/release\""]
  - name: release-head-main
    workflow: release-batch.yml
    find: "push --force-with-lease origin automation/release"
    replace: "push --force-with-lease origin HEAD:main"
    rules: [credential-steps-run-one-template]
    want_contains: ["the refspec \"HEAD:main\" is not the job's own bot branch \"automation/release\""]
  - name: release-refs-heads-main
    workflow: release-batch.yml
    find: "push --force-with-lease origin automation/release"
    replace: "push --force-with-lease origin refs/heads/main"
    rules: [credential-steps-run-one-template]
    want_contains: ["the refspec \"refs/heads/main\" is not the job's own bot branch \"automation/release\""]
  - name: release-force-head-main
    workflow: release-batch.yml
    find: "push --force-with-lease origin automation/release"
    replace: "push --force-with-lease origin +HEAD:main"
    rules: [credential-steps-run-one-template]
    want_contains: ["the refspec \"+HEAD:main\" is not the job's own bot branch \"automation/release\""]
  - name: cut-main
    workflow: cut-release.yml
    find: "push origin HEAD:automation/cut-release"
    replace: "push origin main"
    rules: [credential-steps-run-one-template]
    want_contains: ["the refspec \"main\" is not the job's own bot branch \"automation/cut-release\""]
  - name: cut-head-main
    workflow: cut-release.yml
    find: "push origin HEAD:automation/cut-release"
    replace: "push origin HEAD:main"
    rules: [credential-steps-run-one-template]
    want_contains: ["the refspec \"HEAD:main\" is not the job's own bot branch \"automation/cut-release\""]
  - name: cut-refs-heads-main
    workflow: cut-release.yml
    find: "push origin HEAD:automation/cut-release"
    replace: "push origin refs/heads/main"
    rules: [credential-steps-run-one-template]
    want_contains: ["the refspec \"refs/heads/main\" is not the job's own bot branch \"automation/cut-release\""]
  - name: cut-force-head-main
    workflow: cut-release.yml
    find: "push origin HEAD:automation/cut-release"
    replace: "push origin +HEAD:main"
    rules: [credential-steps-run-one-template]
    want_contains: ["the refspec \"+HEAD:main\" is not the job's own bot branch \"automation/cut-release\""]
  - name: vendor-main
    workflow: nix-vendor-hash.yml
    find: "push --force-with-lease origin HEAD:automation/vendor-hash"
    replace: "push --force-with-lease origin main"
    rules: [credential-steps-run-one-template]
    want_contains: ["the refspec \"main\" is not the job's own bot branch \"automation/vendor-hash\""]
  - name: vendor-head-main
    workflow: nix-vendor-hash.yml
    find: "push --force-with-lease origin HEAD:automation/vendor-hash"
    replace: "push --force-with-lease origin HEAD:main"
    rules: [credential-steps-run-one-template]
    want_contains: ["the refspec \"HEAD:main\" is not the job's own bot branch \"automation/vendor-hash\""]
  - name: vendor-refs-heads-main
    workflow: nix-vendor-hash.yml
    find: "push --force-with-lease origin HEAD:automation/vendor-hash"
    replace: "push --force-with-lease origin refs/heads/main"
    rules: [credential-steps-run-one-template]
    want_contains: ["the refspec \"refs/heads/main\" is not the job's own bot branch \"automation/vendor-hash\""]
  - name: vendor-force-head-main
    workflow: nix-vendor-hash.yml
    find: "push --force-with-lease origin HEAD:automation/vendor-hash"
    replace: "push --force-with-lease origin +HEAD:main"
    rules: [credential-steps-run-one-template]
    want_contains: ["the refspec \"+HEAD:main\" is not the job's own bot branch \"automation/vendor-hash\""]
  - name: release-tag-step-main
    workflow: release-batch.yml
    find: "push origin \"${{ steps.verdict.outputs.candidate }}:refs/tags/${{ steps.verdict.outputs.tag }}\""
    replace: "push origin main"
    rules: [credential-steps-run-one-template, release-actions-gated]
    want_contains: ["the refspec \"main\" is not the job's own bot branch \"automation/release\"", "no step pushes a tag"]
  - name: release-tag-step-head-main
    workflow: release-batch.yml
    find: "push origin \"${{ steps.verdict.outputs.candidate }}:refs/tags/${{ steps.verdict.outputs.tag }}\""
    replace: "push origin HEAD:main"
    rules: [credential-steps-run-one-template, release-actions-gated]
    want_contains: ["the refspec \"HEAD:main\" is not the job's own bot branch \"automation/release\"", "no step pushes a tag"]
  - name: release-tag-step-refs-heads-main
    workflow: release-batch.yml
    find: "push origin \"${{ steps.verdict.outputs.candidate }}:refs/tags/${{ steps.verdict.outputs.tag }}\""
    replace: "push origin refs/heads/main"
    rules: [credential-steps-run-one-template, release-actions-gated]
    want_contains: ["the refspec \"refs/heads/main\" is not the job's own bot branch \"automation/release\"", "no step pushes a tag"]
  - name: release-tag-step-force-head-main
    workflow: release-batch.yml
    find: "push origin \"${{ steps.verdict.outputs.candidate }}:refs/tags/${{ steps.verdict.outputs.tag }}\""
    replace: "push origin +HEAD:main"
    rules: [credential-steps-run-one-template, release-actions-gated]
    want_contains: ["the refspec \"+HEAD:main\" is not the job's own bot branch \"automation/release\"", "no step pushes a tag"]
  - name: release-all
    workflow: release-batch.yml
    find: "push --force-with-lease origin automation/release"
    replace: "push --all origin"
    rules: [credential-steps-run-one-template]
    want_contains: ["the push passes option \"--all\""]
  - name: release-branches
    workflow: release-batch.yml
    find: "push --force-with-lease origin automation/release"
    replace: "push --branches origin"
    rules: [credential-steps-run-one-template]
    want_contains: ["the push passes option \"--branches\""]
  - name: release-mirror
    workflow: release-batch.yml
    find: "push --force-with-lease origin automation/release"
    replace: "push --mirror origin"
    rules: [credential-steps-run-one-template]
    want_contains: ["the push passes option \"--mirror\""]
  - name: release-tags
    workflow: release-batch.yml
    find: "push --force-with-lease origin automation/release"
    replace: "push --tags origin"
    rules: [credential-steps-run-one-template]
    want_contains: ["the push passes option \"--tags\""]
  - name: release-follow-tags
    workflow: release-batch.yml
    find: "push --force-with-lease origin automation/release"
    replace: "push --follow-tags origin automation/release"
    rules: [credential-steps-run-one-template]
    want_contains: ["the push passes option \"--follow-tags\""]
  - name: release-delete
    workflow: release-batch.yml
    find: "push --force-with-lease origin automation/release"
    replace: "push --delete origin automation/release"
    rules: [credential-steps-run-one-template]
    want_contains: ["the push passes option \"--delete\""]
  - name: release-delete-short
    workflow: release-batch.yml
    find: "push --force-with-lease origin automation/release"
    replace: "push -d origin automation/release"
    rules: [credential-steps-run-one-template]
    want_contains: ["the push passes option \"-d\""]
  - name: release-delete-refspec
    workflow: release-batch.yml
    find: "push --force-with-lease origin automation/release"
    replace: "push --force-with-lease origin :automation/release"
    rules: [credential-steps-run-one-template]
    want_contains: ["the refspec \":automation/release\" is not the job's own bot branch \"automation/release\""]
  - name: release-no-refspec
    workflow: release-batch.yml
    find: "push --force-with-lease origin automation/release"
    replace: "push --force-with-lease origin"
    rules: [credential-steps-run-one-template]
    want_contains: ["the push names 1 operands"]
  - name: release-head-alone
    workflow: release-batch.yml
    find: "push --force-with-lease origin automation/release"
    replace: "push --force-with-lease origin HEAD"
    rules: [credential-steps-run-one-template]
    want_contains: ["the refspec \"HEAD\" is not the job's own bot branch \"automation/release\""]
  - name: release-variable
    workflow: release-batch.yml
    find: "push --force-with-lease origin automation/release"
    replace: "push --force-with-lease origin \"$BRANCH\""
    rules: [credential-steps-run-one-template]
    want_contains: ["expands, and the template takes the job's own bot branch as literal text"]
  - name: release-unquoted-variable
    workflow: release-batch.yml
    find: "push --force-with-lease origin automation/release"
    replace: "push --force-with-lease origin $BRANCH"
    rules: [credential-steps-run-one-template]
    want_contains: ["it uses '$' outside double quotes"]
  - name: release-pattern
    workflow: release-batch.yml
    find: "push --force-with-lease origin automation/release"
    replace: "push --force-with-lease origin 'refs/heads/*:refs/heads/*'"
    rules: [credential-steps-run-one-template]
    want_contains: ["the refspec \"refs/heads/*:refs/heads/*\" is not the job's own bot branch \"automation/release\""]
  - name: release-other-bot
    workflow: release-batch.yml
    find: "push --force-with-lease origin automation/release"
    replace: "push --force-with-lease origin automation/cut-release"
    rules: [credential-steps-run-one-template]
    want_contains: ["the refspec \"automation/cut-release\" is not the job's own bot branch \"automation/release\""]
  - name: cut-tag
    workflow: cut-release.yml
    find: "push origin HEAD:automation/cut-release"
    replace: "push origin HEAD:refs/tags/v9.9.9"
    rules: [credential-steps-run-one-template]
    want_contains: ["a bot job may not run the push-release-tag template"]
  - name: vendor-all
    workflow: nix-vendor-hash.yml
    find: "push --force-with-lease origin HEAD:automation/vendor-hash"
    replace: "push origin --all"
    rules: [credential-steps-run-one-template]
    want_contains: ["the push passes option \"--all\""]
  - name: vendor-other-bot
    workflow: nix-vendor-hash.yml
    find: "push --force-with-lease origin HEAD:automation/vendor-hash"
    replace: "push --force-with-lease origin HEAD:automation/release"
    rules: [credential-steps-run-one-template]
    want_contains: ["the refspec \"HEAD:automation/release\" is not the job's own bot branch \"automation/vendor-hash\""]
  - name: cut-delete-refspec
    workflow: cut-release.yml
    find: "push origin HEAD:automation/cut-release"
    replace: "push origin :automation/cut-release"
    rules: [credential-steps-run-one-template]
    want_contains: ["the refspec \":automation/cut-release\" is not the job's own bot branch \"automation/cut-release\""]
  - name: release-tag-literal
    workflow: release-batch.yml
    find: "push origin \"${{ steps.verdict.outputs.candidate }}:refs/tags/${{ steps.verdict.outputs.tag }}\""
    replace: "push origin refs/tags/v9.9.9"
    rules: [credential-steps-run-one-template]
    want_contains: ["is not [<candidate>:]refs/tags/<tag> with both read from the planner's outputs"]
  - name: release-tag-to-branch
    workflow: release-batch.yml
    find: "push origin \"${{ steps.verdict.outputs.candidate }}:refs/tags/${{ steps.verdict.outputs.tag }}\""
    replace: "push origin \"refs/tags/${{ steps.verdict.outputs.tag }}:refs/heads/main\""
    rules: [credential-steps-run-one-template]
    want_contains: ["is not [<candidate>:]refs/tags/<tag>"]
  - name: release-git-config-option
    workflow: release-batch.yml
    find: "git -c http.extraheader=\"AUTHORIZATION: bearer ${APP_TOKEN}\" push --force-with-lease origin automation/release"
    replace: "git -c remote.origin.url=https://example.invalid/fork push --force-with-lease origin automation/release"
    rules: [credential-steps-run-one-template]
    want_contains: ["is not the authorization header"]
  - name: release-git-directory-option
    workflow: release-batch.yml
    find: "git -c http.extraheader=\"AUTHORIZATION: bearer ${APP_TOKEN}\" push --force-with-lease origin automation/release"
    replace: "git -C . push --force-with-lease origin main"
    rules: [credential-steps-run-one-template]
    want_contains: ["the command is none of the credential templates"]
  - name: release-in-substitution
    workflow: release-batch.yml
    find: "git -c http.extraheader=\"AUTHORIZATION: bearer ${APP_TOKEN}\" push --force-with-lease origin automation/release"
    replace: "out=\"$(git push --force-with-lease origin main)\""
    rules: [credential-steps-run-one-template]
    want_contains: ["it uses a '$' form other than $NAME"]
  - name: release-in-bash-c
    workflow: release-batch.yml
    find: "git -c http.extraheader=\"AUTHORIZATION: bearer ${APP_TOKEN}\" push --force-with-lease origin automation/release"
    replace: "bash -c \"git push --force-with-lease origin main\""
    rules: [credential-steps-run-one-template]
    want_contains: ["the command is none of the credential templates"]
  - name: release-variable-command-word
    workflow: release-batch.yml
    find: "git -c http.extraheader=\"AUTHORIZATION: bearer ${APP_TOKEN}\" push --force-with-lease origin automation/release"
    replace: "G=git; $G push origin HEAD:main"
    rules: [credential-steps-run-one-template]
    want_contains: ["it holds \";\" outside quotes"]
  - name: release-quoted-variable-command
    workflow: release-batch.yml
    find: "git -c http.extraheader=\"AUTHORIZATION: bearer ${APP_TOKEN}\" push --force-with-lease origin automation/release"
    replace: "\"${GITBIN}\" push origin HEAD:main"
    rules: [credential-steps-run-one-template]
    want_contains: ["the command is none of the credential templates"]
  - name: release-braced-default-command
    workflow: release-batch.yml
    find: "git -c http.extraheader=\"AUTHORIZATION: bearer ${APP_TOKEN}\" push --force-with-lease origin automation/release"
    replace: "${GIT:-git} push origin HEAD:main"
    rules: [credential-steps-run-one-template]
    want_contains: ["it uses '$' outside double quotes"]
  - name: release-substitution-command-word
    workflow: release-batch.yml
    find: "git -c http.extraheader=\"AUTHORIZATION: bearer ${APP_TOKEN}\" push --force-with-lease origin automation/release"
    replace: "$(echo git) push origin HEAD:main"
    rules: [credential-steps-run-one-template]
    want_contains: ["it uses '$' outside double quotes"]
  - name: release-pipe-into-bash
    workflow: release-batch.yml
    find: "git -c http.extraheader=\"AUTHORIZATION: bearer ${APP_TOKEN}\" push --force-with-lease origin automation/release"
    replace: "echo \"git push origin HEAD:main\" | bash"
    rules: [credential-steps-run-one-template]
    want_contains: ["it holds \"|\" outside quotes"]
  - name: release-heredoc-into-bash
    workflow: release-batch.yml
    find: "git -c http.extraheader=\"AUTHORIZATION: bearer ${APP_TOKEN}\" push --force-with-lease origin automation/release"
    replace: "bash <<'SH'\n          git push origin HEAD:main\n          SH"
    rules: [credential-steps-run-one-template]
    want_contains: ["it holds \"<\" outside quotes"]
  - name: release-python
    workflow: release-batch.yml
    find: "git -c http.extraheader=\"AUTHORIZATION: bearer ${APP_TOKEN}\" push --force-with-lease origin automation/release"
    replace: "python3 -c \"import os; os.system('git push origin HEAD:main')\""
    rules: [credential-steps-run-one-template]
    want_contains: ["the command is none of the credential templates"]
  - name: release-node
    workflow: release-batch.yml
    find: "git -c http.extraheader=\"AUTHORIZATION: bearer ${APP_TOKEN}\" push --force-with-lease origin automation/release"
    replace: "node -e \"require('child_process').execSync('git push origin HEAD:main')\""
    rules: [credential-steps-run-one-template]
    want_contains: ["the command is none of the credential templates"]
  - name: release-perl
    workflow: release-batch.yml
    find: "git -c http.extraheader=\"AUTHORIZATION: bearer ${APP_TOKEN}\" push --force-with-lease origin automation/release"
    replace: "perl -e 'system(\"git push origin HEAD:main\")'"
    rules: [credential-steps-run-one-template]
    want_contains: ["the command is none of the credential templates"]
  - name: release-repo-script
    workflow: release-batch.yml
    find: "git -c http.extraheader=\"AUTHORIZATION: bearer ${APP_TOKEN}\" push --force-with-lease origin automation/release"
    replace: "./scripts/push.sh"
    rules: [credential-steps-run-one-template]
    want_contains: ["the command is none of the credential templates"]
  - name: release-bash-script
    workflow: release-batch.yml
    find: "git -c http.extraheader=\"AUTHORIZATION: bearer ${APP_TOKEN}\" push --force-with-lease origin automation/release"
    replace: "bash scripts/push.sh"
    rules: [credential-steps-run-one-template]
    want_contains: ["the command is none of the credential templates"]
  - name: release-chained-push
    workflow: release-batch.yml
    find: "git -c http.extraheader=\"AUTHORIZATION: bearer ${APP_TOKEN}\" push --force-with-lease origin automation/release"
    replace: "git -c http.extraheader=\"AUTHORIZATION: bearer ${APP_TOKEN}\" push --force-with-lease origin automation/release && git push origin HEAD:main"
    rules: [credential-steps-run-one-template]
    want_contains: ["it holds \"&\" outside quotes"]
  - name: release-github-script
    workflow: release-batch.yml
    find: "      - id: gate\n"
    replace: "      - id: script\n        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea\n        with:\n          github-token: ${{ steps.mint.outputs.token }}\n          script: |\n            await github.rest.git.updateRef({owner: context.repo.owner, repo: context.repo.repo, ref: 'heads/main', sha: context.sha, force: true})\n      - id: gate\n"
    rules: [credentials-stay-in-listed-jobs, credential-jobs-use-pinned-actions, release-actions-gated]
    want_contains: ["uses \"actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea\", which is not an allowed action", "reads steps.mint (the minted App token) in with"]
  - name: release-env-bash-env
    workflow: release-batch.yml
    find: "          APP_TOKEN: ${{ steps.mint.outputs.token }}\n        run: |\n          git -c http.extraheader=\"AUTHORIZATION: bearer ${APP_TOKEN}\" push --force-with-lease origin automation/release"
    replace: "          APP_TOKEN: ${{ steps.mint.outputs.token }}\n          BASH_ENV: ./scripts/push.sh\n        run: |\n          git -c http.extraheader=\"AUTHORIZATION: bearer ${APP_TOKEN}\" push --force-with-lease origin automation/release"
    rules: [credential-steps-run-one-template]
    want_contains: ["its env sets BASH_ENV"]
  - name: release-shell-override
    workflow: release-batch.yml
    find: "          APP_TOKEN: ${{ steps.mint.outputs.token }}\n        run: |\n          git -c http.extraheader=\"AUTHORIZATION: bearer ${APP_TOKEN}\" push --force-with-lease origin automation/release"
    replace: "          APP_TOKEN: ${{ steps.mint.outputs.token }}\n        shell: python {0}\n        run: |\n          git -c http.extraheader=\"AUTHORIZATION: bearer ${APP_TOKEN}\" push --force-with-lease origin automation/release"
    rules: [credential-steps-run-one-template]
    want_contains: ["runs under shell \"python {0}\""]
  - name: release-merge-admin
    workflow: release-batch.yml
    find: "gh pr merge --auto --squash 7"
    replace: "gh pr merge --admin --squash 7"
    rules: [credential-steps-run-one-template]
    want_contains: ["the command passes \"--admin\""]
  - name: release-pr-create-other-head
    workflow: release-batch.yml
    find: "gh pr create --head automation/release"
    replace: "gh pr create --head main"
    rules: [credential-steps-run-one-template]
    want_contains: ["gh pr create opens from \"main\", not the job's own bot branch \"automation/release\""]
  - name: release-queue-mutation
    workflow: release-batch.yml
    find: "-f query='query("
    replace: "-f query='mutation("
    rules: [credential-steps-run-one-template]
    want_contains: ["the GraphQL document is not one query"]
  - name: release-config-default-branch
    file: .github/release-intent.yaml
    find: "  release: automation/release\n"
    replace: "  release: main\n"
    rules: []
    config_error: config-invalid
    want_contains: ["bot_branches entry \"release\" names branch \"main\", which is not under \"automation/\""]
  - name: general-interpreters-in-release-job
    workflow: release-batch.yml
    find: "      - id: push\n"
    replace: "      - id: notes\n        run: |\n          python3 -c \"print('notes')\" > notes.txt\n          node -e \"console.log('notes')\" >> notes.txt\n          perl -e 'print \"notes\\n\"' >> notes.txt\n      - id: push\n"
    rules: []
    want_contains: []
  - name: general-repo-scripts-in-release-job
    workflow: release-batch.yml
    find: "      - id: push\n"
    replace: "      - id: prepare\n        run: |\n          ./scripts/prepare.sh\n          bash scripts/prepare.sh\n      - id: push\n"
    rules: []
    want_contains: []
  - name: general-shell-forms-in-bot-job
    workflow: cut-release.yml
    find: "      - id: push\n"
    replace: "      - id: inspect\n        run: |\n          G=git; $G log -1\n          echo \"git status\" | bash\n      - id: push\n"
    rules: []
    want_contains: []
