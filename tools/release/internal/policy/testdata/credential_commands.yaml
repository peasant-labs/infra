# Commands of a job that may hold a credential, read by the production
# tokenizer and the template and plumbing matchers. Each row is one run block
# with the job it runs in: its class (release job, bot job, tag-triggered
# publish job), its own bot branch, and the step's effective env. The job
# needs the planning job "plan" of the test's workflow, whose outputs map its
# planner's tag and a PR number. plumbing selects the plumbing matcher. An
# accepting row names the template the command must match exactly; a
# rejecting row names a fragment of the reason it is refused and its
# accepting sibling. Every template of both sets has an accepting row.
#
# required_names is the manifest: every case must be listed and every listed
# case must exist.
required_names:
  - accept-push-own-branch
  - accept-push-own-branch-head
  - accept-push-own-branch-ref
  - accept-push-release-tag
  - accept-pr-create
  - accept-pr-edit
  - accept-pr-close
  - accept-pr-merge-auto
  - accept-pr-merge-disable
  - accept-queue-read
  - accept-release-view
  - accept-release-edit
  - accept-release-create
  - accept-fetch-bundle-branch
  - accept-fetch-bundle-branch-ref
  - accept-fetch-bundle-tag
  - reject-two-lines
  - reject-separator
  - reject-and-chain
  - reject-pipe
  - reject-substitution-in-quotes
  - reject-backtick
  - reject-ansi-c-quote
  - reject-process-substitution
  - reject-glob
  - reject-brace-expansion
  - reject-tilde
  - reject-escape
  - reject-comment
  - reject-parameter-operator
  - reject-special-parameter
  - reject-stderr-redirect
  - reject-append-redirect
  - reject-unterminated-quote
  - reject-expression-quoted
  - reject-expression-unquoted
  - reject-push-default-branch
  - reject-push-other-remote
  - reject-push-two-refspecs
  - reject-push-header-other-key
  - reject-push-header-unset
  - reject-push-no-branch
  - reject-tag-from-bot
  - reject-tag-force
  - reject-tag-single-sided
  - reject-tag-to-branch
  - reject-tag-not-planner-output
  - reject-tag-from-unneeded-job
  - reject-tag-literal-env
  - reject-tag-not-planner-step
  - reject-pr-create-no-head
  - reject-pr-create-token-title
  - reject-pr-edit-base
  - reject-pr-edit-other-branch
  - reject-pr-close-delete-branch
  - reject-pr-merge-now
  - reject-pr-merge-admin
  - reject-pr-number-unmapped
  - reject-pr-number-unguarded
  - reject-queue-mutation
  - reject-queue-query-file
  - reject-queue-rest
  - reject-queue-input
  - reject-release-create-no-verify
  - reject-release-create-other-tag
  - reject-release-create-target
  - reject-release-edit-retag
  - reject-release-ref-name-overridden
  - reject-publish-pushes
  - reject-release-from-release-job
  - reject-interpreter
  - reject-repo-script
  - reject-quoted-command-word
  - reject-fetch-into-default-branch
  - reject-fetch-not-a-bundle
  - reject-fetch-url
  - reject-fetch-upload-pack
  - reject-fetch-tag-from-bot
  - reject-fetch-tag-single-sided
  - reject-fetch-in-publish
  - reject-plumbing-git-config
  - reject-plumbing-env-file
  - reject-plumbing-copy
cases:
  - name: accept-push-own-branch
    class: release job
    branch: "automation/release"
    env: {"APP_TOKEN": "${{ steps.mint.outputs.token }}"}
    run: "git -c http.extraheader=\"AUTHORIZATION: bearer ${APP_TOKEN}\" push --force-with-lease origin automation/release"
    template: push-own-branch
  - name: accept-push-own-branch-head
    class: bot job
    branch: "automation/cut-release"
    env: {"APP_TOKEN": "${{ steps.mint.outputs.token }}"}
    run: "git -c http.extraheader=\"AUTHORIZATION: bearer ${APP_TOKEN}\" push origin HEAD:automation/cut-release"
    template: push-own-branch
  - name: accept-push-own-branch-ref
    class: bot job
    branch: "automation/cut-release"
    env: {"APP_TOKEN": "${{ steps.mint.outputs.token }}"}
    run: "git push --force origin refs/heads/automation/cut-release"
    template: push-own-branch
  - name: accept-push-release-tag
    class: release job
    branch: "automation/release"
    env: {"APP_TOKEN": "${{ steps.mint.outputs.token }}", "TAG": "${{ needs.plan.outputs.tag }}"}
    run: "git -c http.extraheader=\"AUTHORIZATION: bearer ${APP_TOKEN}\" push origin \"refs/tags/${TAG}:refs/tags/${TAG}\""
    template: push-release-tag
  - name: accept-pr-create
    class: release job
    branch: "automation/release"
    env: {"GH_TOKEN": "${{ steps.mint.outputs.token }}", "TITLE": "${{ needs.plan.outputs.tag }}"}
    run: "gh pr create --head automation/release --base main --title \"${TITLE}\" --body 'bot'"
    template: pr-create
  - name: accept-pr-edit
    class: release job
    branch: "automation/release"
    env: {"GH_TOKEN": "${{ steps.mint.outputs.token }}", "PR_NUMBER": "${{ needs.plan.outputs.number }}", "TITLE": "x", "BODY": "y"}
    run: "gh pr edit --title \"release: ${TITLE}\" --body \"${BODY}\" -- \"${PR_NUMBER}\""
    template: pr-edit
  - name: accept-pr-close
    class: bot job
    branch: "automation/cut-release"
    env: {"GH_TOKEN": "${{ steps.mint.outputs.token }}"}
    run: "gh pr close --comment \"superseded\" automation/cut-release"
    template: pr-close
  - name: accept-pr-merge-auto
    class: bot job
    branch: "automation/cut-release"
    env: {"GH_TOKEN": "${{ steps.mint.outputs.token }}"}
    run: "gh pr merge --auto --squash automation/cut-release"
    template: pr-merge
  - name: accept-pr-merge-disable
    class: release job
    branch: "automation/release"
    env: {"GH_TOKEN": "${{ steps.mint.outputs.token }}", "PR_NUMBER": "${{ needs.plan.outputs.number }}"}
    run: "gh pr merge --disable-auto -- \"${PR_NUMBER}\""
    template: pr-merge
  - name: accept-queue-read
    class: release job
    branch: "automation/release"
    env: {"GH_TOKEN": "${{ steps.mint.outputs.token }}"}
    run: "gh api graphql -F owner='{owner}' -F repo='{repo}' -F branch=main -f query='\n  query($owner:String!,$repo:String!,$branch:String!) {\n    repository(owner:$owner,name:$repo) { mergeQueue(branch:$branch) { entries(first:100) { nodes { position } } } } }' > queue.json"
    template: merge-queue-read
  - name: accept-release-view
    class: tag-triggered publish job
    branch: ""
    env: {"GH_TOKEN": "${{ github.token }}", "TAG": "${{ github.ref_name }}"}
    run: "gh release view \"$TAG\" --repo \"$GITHUB_REPOSITORY\""
    template: release-view
  - name: accept-release-edit
    class: tag-triggered publish job
    branch: ""
    env: {"GH_TOKEN": "${{ github.token }}", "PRERELEASE": "false"}
    run: "gh release edit \"$GITHUB_REF_NAME\" --notes-file notes/notes.md --latest --prerelease=\"$PRERELEASE\""
    template: release-edit
  - name: accept-release-create
    class: tag-triggered publish job
    branch: ""
    env: {"GH_TOKEN": "${{ github.token }}", "TAG": "${{ github.ref_name }}"}
    run: "gh release create \"$GITHUB_REF_NAME\" \\\n  --repo peasant-labs/fairtrade-design-system \\\n  --verify-tag \\\n  --title \"${TAG}\" \\\n  --notes-file notes/notes.md \\\n  --prerelease=false"
    template: release-create
  - name: accept-fetch-bundle-branch
    class: release job
    branch: "automation/release"
    plumbing: true
    run: "git fetch --no-tags bundles/release.bundle automation/release:automation/release"
    template: fetch-bundle-branch
  - name: accept-fetch-bundle-branch-ref
    class: bot job
    branch: "automation/cut-release"
    plumbing: true
    run: "git fetch bundle/cut.bundle +refs/heads/automation/cut-release:refs/heads/automation/cut-release"
    template: fetch-bundle-branch
  - name: accept-fetch-bundle-tag
    class: release job
    branch: "automation/release"
    env: {"TAG": "${{ needs.plan.outputs.tag }}"}
    plumbing: true
    run: "git fetch --no-tags bundles/tag.bundle \"refs/tags/${TAG}:refs/tags/${TAG}\""
    template: fetch-bundle-tag
  - name: reject-two-lines
    class: release job
    branch: "automation/release"
    env: {"APP_TOKEN": "${{ steps.mint.outputs.token }}"}
    run: "git push origin automation/release\ngit push origin main"
    fault: "more than one line"
    sibling: accept-push-own-branch
  - name: reject-separator
    class: release job
    branch: "automation/release"
    env: {"APP_TOKEN": "${{ steps.mint.outputs.token }}"}
    run: "git push origin automation/release; git push origin main"
    fault: "\";\" outside quotes"
    sibling: accept-push-own-branch
  - name: reject-and-chain
    class: release job
    branch: "automation/release"
    env: {"APP_TOKEN": "${{ steps.mint.outputs.token }}"}
    run: "git push origin automation/release && git push origin main"
    fault: "\"&\" outside quotes"
    sibling: accept-push-own-branch
  - name: reject-pipe
    class: release job
    branch: "automation/release"
    env: {"APP_TOKEN": "${{ steps.mint.outputs.token }}"}
    run: "echo x | git push origin automation/release"
    fault: "\"|\" outside quotes"
    sibling: accept-push-own-branch
  - name: reject-substitution-in-quotes
    class: release job
    branch: "automation/release"
    env: {"APP_TOKEN": "${{ steps.mint.outputs.token }}"}
    run: "git push origin \"$(echo main)\""
    fault: "'$' form other than"
    sibling: accept-push-own-branch
  - name: reject-backtick
    class: release job
    branch: "automation/release"
    env: {"APP_TOKEN": "${{ steps.mint.outputs.token }}"}
    run: "git push origin \"`echo main`\""
    fault: "backtick"
    sibling: accept-push-own-branch
  - name: reject-ansi-c-quote
    class: release job
    branch: "automation/release"
    env: {"APP_TOKEN": "${{ steps.mint.outputs.token }}"}
    run: "git push origin $'main'"
    fault: "'$' outside double quotes"
    sibling: accept-push-own-branch
  - name: reject-process-substitution
    class: release job
    branch: "automation/release"
    env: {"APP_TOKEN": "${{ steps.mint.outputs.token }}"}
    run: "git push origin <(echo main)"
    fault: "\"<\" outside quotes"
    sibling: accept-push-own-branch
  - name: reject-glob
    class: release job
    branch: "automation/release"
    env: {"APP_TOKEN": "${{ steps.mint.outputs.token }}"}
    run: "git push origin automation/*"
    fault: "\"*\" outside quotes"
    sibling: accept-push-own-branch
  - name: reject-brace-expansion
    class: release job
    branch: "automation/release"
    env: {"APP_TOKEN": "${{ steps.mint.outputs.token }}"}
    run: "git push origin automation/{release,main}"
    fault: "\"{\" outside quotes"
    sibling: accept-push-own-branch
  - name: reject-tilde
    class: release job
    branch: "automation/release"
    env: {"APP_TOKEN": "${{ steps.mint.outputs.token }}"}
    run: "git push origin ~/main"
    fault: "\"~\" outside quotes"
    sibling: accept-push-own-branch
  - name: reject-escape
    class: release job
    branch: "automation/release"
    env: {"APP_TOKEN": "${{ steps.mint.outputs.token }}"}
    run: "g\\it push origin automation/release"
    fault: "backslash"
    sibling: accept-push-own-branch
  - name: reject-comment
    class: release job
    branch: "automation/release"
    env: {"APP_TOKEN": "${{ steps.mint.outputs.token }}"}
    run: "git push origin automation/release #"
    fault: "\"#\" outside quotes"
    sibling: accept-push-own-branch
  - name: reject-parameter-operator
    class: release job
    branch: "automation/release"
    env: {"APP_TOKEN": "${{ steps.mint.outputs.token }}"}
    run: "git push origin \"${BRANCH:-main}\""
    fault: "with an operator inside"
    sibling: accept-push-own-branch
  - name: reject-special-parameter
    class: release job
    branch: "automation/release"
    env: {"APP_TOKEN": "${{ steps.mint.outputs.token }}"}
    run: "git push origin \"$1\""
    fault: "'$' form other than"
    sibling: accept-push-own-branch
  - name: reject-stderr-redirect
    class: release job
    branch: "automation/release"
    env: {"APP_TOKEN": "${{ steps.mint.outputs.token }}"}
    run: "git push origin automation/release 2>&1"
    fault: "numbered file descriptor"
    sibling: accept-push-own-branch
  - name: reject-append-redirect
    class: release job
    branch: "automation/release"
    env: {"APP_TOKEN": "${{ steps.mint.outputs.token }}"}
    run: "git push origin automation/release >> out.txt"
    fault: "redirection other than one plain '>'"
    sibling: accept-push-own-branch
  - name: reject-unterminated-quote
    class: release job
    branch: "automation/release"
    env: {"APP_TOKEN": "${{ steps.mint.outputs.token }}"}
    run: "git push origin \"automation/release"
    fault: "never closes"
    sibling: accept-push-own-branch
  - name: reject-expression-quoted
    class: release job
    branch: "automation/release"
    env: {"APP_TOKEN": "${{ steps.mint.outputs.token }}"}
    run: "git push origin \"${{ needs.plan.outputs.branch }}\""
    fault: "interpolates a GitHub expression"
    sibling: accept-push-own-branch
  - name: reject-expression-unquoted
    class: release job
    branch: "automation/release"
    env: {"APP_TOKEN": "${{ steps.mint.outputs.token }}"}
    run: "git push origin ${{ needs.plan.outputs.branch }}"
    fault: "interpolates a GitHub expression"
    sibling: accept-push-own-branch
  - name: reject-push-default-branch
    class: release job
    branch: "automation/release"
    env: {"APP_TOKEN": "${{ steps.mint.outputs.token }}"}
    run: "git -c http.extraheader=\"AUTHORIZATION: bearer ${APP_TOKEN}\" push origin HEAD:main"
    fault: "is not the job's own bot branch"
    sibling: accept-push-own-branch
  - name: reject-push-other-remote
    class: release job
    branch: "automation/release"
    env: {"APP_TOKEN": "${{ steps.mint.outputs.token }}"}
    run: "git -c http.extraheader=\"AUTHORIZATION: bearer ${APP_TOKEN}\" push upstream automation/release"
    fault: "pushes only to origin"
    sibling: accept-push-own-branch
  - name: reject-push-two-refspecs
    class: release job
    branch: "automation/release"
    env: {"APP_TOKEN": "${{ steps.mint.outputs.token }}"}
    run: "git -c http.extraheader=\"AUTHORIZATION: bearer ${APP_TOKEN}\" push origin automation/release main"
    fault: "names 3 operands"
    sibling: accept-push-own-branch
  - name: reject-push-header-other-key
    class: release job
    branch: "automation/release"
    env: {"APP_TOKEN": "${{ steps.mint.outputs.token }}"}
    run: "git -c \"http.https://example.invalid/.extraheader=AUTHORIZATION: bearer ${APP_TOKEN}\" push origin automation/release"
    fault: "is not the authorization header"
    sibling: accept-push-own-branch
  - name: reject-push-header-unset
    class: release job
    branch: "automation/release"
    env: {"GH_TOKEN": "${{ steps.mint.outputs.token }}"}
    run: "git -c http.extraheader=\"AUTHORIZATION: bearer ${APP_TOKEN}\" push origin automation/release"
    fault: "is not set in the step env"
    sibling: accept-push-own-branch
  - name: reject-push-no-branch
    class: bot job
    branch: ""
    env: {"APP_TOKEN": "${{ steps.mint.outputs.token }}"}
    run: "git push origin HEAD:automation/cut-release"
    fault: "owns no branch"
    sibling: accept-push-own-branch-head
  - name: reject-tag-from-bot
    class: bot job
    branch: "automation/cut-release"
    env: {"APP_TOKEN": "${{ steps.mint.outputs.token }}", "TAG": "${{ needs.plan.outputs.tag }}"}
    run: "git -c http.extraheader=\"AUTHORIZATION: bearer ${APP_TOKEN}\" push origin \"refs/tags/${TAG}:refs/tags/${TAG}\""
    fault: "may not run the push-release-tag template"
    sibling: accept-push-own-branch-head
  - name: reject-tag-force
    class: release job
    branch: "automation/release"
    env: {"APP_TOKEN": "${{ steps.mint.outputs.token }}", "TAG": "${{ needs.plan.outputs.tag }}"}
    run: "git -c http.extraheader=\"AUTHORIZATION: bearer ${APP_TOKEN}\" push --force origin \"refs/tags/${TAG}:refs/tags/${TAG}\""
    fault: "pushed once and never moved"
    sibling: accept-push-release-tag
  - name: reject-tag-single-sided
    class: release job
    branch: "automation/release"
    env: {"APP_TOKEN": "${{ steps.mint.outputs.token }}", "TAG": "${{ needs.plan.outputs.tag }}"}
    run: "git -c http.extraheader=\"AUTHORIZATION: bearer ${APP_TOKEN}\" push origin \"refs/tags/${TAG}\""
    fault: "is not \"refs/tags/${TAG}:refs/tags/${TAG}\""
    sibling: accept-push-release-tag
  - name: reject-tag-to-branch
    class: release job
    branch: "automation/release"
    env: {"APP_TOKEN": "${{ steps.mint.outputs.token }}", "TAG": "${{ needs.plan.outputs.tag }}"}
    run: "git -c http.extraheader=\"AUTHORIZATION: bearer ${APP_TOKEN}\" push origin \"refs/tags/${TAG}:refs/heads/main\""
    fault: "is not \"refs/tags/${TAG}:refs/tags/${TAG}\""
    sibling: accept-push-release-tag
  - name: reject-tag-not-planner-output
    class: release job
    branch: "automation/release"
    env: {"APP_TOKEN": "${{ steps.mint.outputs.token }}", "TAG": "${{ needs.plan.outputs.version }}"}
    run: "git -c http.extraheader=\"AUTHORIZATION: bearer ${APP_TOKEN}\" push origin \"refs/tags/${TAG}:refs/tags/${TAG}\""
    fault: "which is not steps.<plan>.outputs.tag"
    sibling: accept-push-release-tag
  - name: reject-tag-from-unneeded-job
    class: release job
    branch: "automation/release"
    env: {"APP_TOKEN": "${{ steps.mint.outputs.token }}", "TAG": "${{ needs.lint.outputs.tag }}"}
    run: "git -c http.extraheader=\"AUTHORIZATION: bearer ${APP_TOKEN}\" push origin \"refs/tags/${TAG}:refs/tags/${TAG}\""
    fault: "which is not steps.<plan>.outputs.tag"
    sibling: accept-push-release-tag
  - name: reject-tag-literal-env
    class: release job
    branch: "automation/release"
    env: {"APP_TOKEN": "${{ steps.mint.outputs.token }}", "TAG": "v9.9.9"}
    run: "git -c http.extraheader=\"AUTHORIZATION: bearer ${APP_TOKEN}\" push origin \"refs/tags/${TAG}:refs/tags/${TAG}\""
    fault: "which is not steps.<plan>.outputs.tag"
    sibling: accept-push-release-tag
  - name: reject-tag-not-planner-step
    class: release job
    branch: "automation/release"
    env: {"APP_TOKEN": "${{ steps.mint.outputs.token }}", "TAG": "${{ needs.plan.outputs.forged-tag }}"}
    run: "git -c http.extraheader=\"AUTHORIZATION: bearer ${APP_TOKEN}\" push origin \"refs/tags/${TAG}:refs/tags/${TAG}\""
    fault: "which does not run release-intent plan"
    sibling: accept-push-release-tag
  - name: reject-pr-create-no-head
    class: release job
    branch: "automation/release"
    env: {"GH_TOKEN": "${{ steps.mint.outputs.token }}"}
    run: "gh pr create --base main --title \"x\""
    fault: "names no --head"
    sibling: accept-pr-create
  - name: reject-pr-create-token-title
    class: release job
    branch: "automation/release"
    env: {"GH_TOKEN": "${{ steps.mint.outputs.token }}"}
    run: "gh pr create --head automation/release --title \"${GH_TOKEN}\""
    fault: "would publish the credential"
    sibling: accept-pr-create
  - name: reject-pr-edit-base
    class: release job
    branch: "automation/release"
    env: {"GH_TOKEN": "${{ steps.mint.outputs.token }}"}
    run: "gh pr edit --base main 7"
    fault: "does not take"
    sibling: accept-pr-edit
  - name: reject-pr-edit-other-branch
    class: release job
    branch: "automation/release"
    env: {"GH_TOKEN": "${{ steps.mint.outputs.token }}"}
    run: "gh pr edit --title x automation/cut-release"
    fault: "is neither the job's own bot branch"
    sibling: accept-pr-edit
  - name: reject-pr-close-delete-branch
    class: bot job
    branch: "automation/cut-release"
    env: {"GH_TOKEN": "${{ steps.mint.outputs.token }}"}
    run: "gh pr close --delete-branch automation/cut-release"
    fault: "does not take"
    sibling: accept-pr-close
  - name: reject-pr-merge-now
    class: bot job
    branch: "automation/cut-release"
    env: {"GH_TOKEN": "${{ steps.mint.outputs.token }}"}
    run: "gh pr merge --squash automation/cut-release"
    fault: "neither or both of --auto and --disable-auto"
    sibling: accept-pr-merge-auto
  - name: reject-pr-merge-admin
    class: bot job
    branch: "automation/cut-release"
    env: {"GH_TOKEN": "${{ steps.mint.outputs.token }}"}
    run: "gh pr merge --auto --admin automation/cut-release"
    fault: "does not take"
    sibling: accept-pr-merge-auto
  - name: reject-pr-number-unmapped
    class: release job
    branch: "automation/release"
    env: {"GH_TOKEN": "${{ steps.mint.outputs.token }}", "PR_NUMBER": "7"}
    run: "gh pr merge --disable-auto -- \"${PR_NUMBER}\""
    fault: "does not map from exactly one step output"
    sibling: accept-pr-merge-disable
  - name: reject-pr-number-unguarded
    class: release job
    branch: "automation/release"
    env: {"GH_TOKEN": "${{ steps.mint.outputs.token }}", "PR_NUMBER": "${{ needs.plan.outputs.number }}"}
    run: "gh pr merge --disable-auto \"${PR_NUMBER}\""
    fault: "before \"--\""
    sibling: accept-pr-merge-disable
  - name: reject-queue-mutation
    class: release job
    branch: "automation/release"
    env: {"GH_TOKEN": "${{ steps.mint.outputs.token }}"}
    run: "gh api graphql -f query='mutation { updateRef(input:{}) { clientMutationId } } # mergeQueue'"
    fault: "is not one query"
    sibling: accept-queue-read
  - name: reject-queue-query-file
    class: release job
    branch: "automation/release"
    env: {"GH_TOKEN": "${{ steps.mint.outputs.token }}"}
    run: "gh api graphql -F query=@query.graphql"
    fault: "reads a file"
    sibling: accept-queue-read
  - name: reject-queue-rest
    class: release job
    branch: "automation/release"
    env: {"GH_TOKEN": "${{ steps.mint.outputs.token }}"}
    run: "gh api -X PATCH repos/o/r/git/refs/heads/main -f sha=x"
    fault: "none of the credential templates"
    sibling: accept-queue-read
  - name: reject-queue-input
    class: release job
    branch: "automation/release"
    env: {"GH_TOKEN": "${{ steps.mint.outputs.token }}"}
    run: "gh api graphql --input body.json -f query='query { mergeQueue }'"
    fault: "takes only -F/-f"
    sibling: accept-queue-read
  - name: reject-release-create-no-verify
    class: tag-triggered publish job
    branch: ""
    env: {"GH_TOKEN": "${{ github.token }}"}
    run: "gh release create \"$GITHUB_REF_NAME\" --notes-file notes.md"
    fault: "does not pass --verify-tag"
    sibling: accept-release-create
  - name: reject-release-create-other-tag
    class: tag-triggered publish job
    branch: ""
    env: {"GH_TOKEN": "${{ github.token }}"}
    run: "gh release create v9.9.9 --verify-tag"
    fault: "is not the triggering tag"
    sibling: accept-release-create
  - name: reject-release-create-target
    class: tag-triggered publish job
    branch: ""
    env: {"GH_TOKEN": "${{ github.token }}"}
    run: "gh release create \"$GITHUB_REF_NAME\" --verify-tag --target main"
    fault: "does not take"
    sibling: accept-release-create
  - name: reject-release-edit-retag
    class: tag-triggered publish job
    branch: ""
