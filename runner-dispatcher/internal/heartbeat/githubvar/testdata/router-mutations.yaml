# Named mutations for the router contract test
# (TestRouterMutationsAreKilled in router_test.go). Each mutation is a
# literal old -> new substitution applied to the runner-router.yml file
# text; the test re-extracts the route script from the mutated text (and
# re-reads the declaration and env), runs every case in router.yaml, and
# requires the case named in killedBy to fail. A mutation whose old text is
# absent from the workflow fails the test.
#
# killedBy: declaration means the mutation is killed by the input
# declaration assertion rather than by a case. That is the only option for
# required-slots-default-zero: GitHub's input defaulting cannot run
# locally, so no case can observe the default.
mutations:
- name: capacity-allows-one-short
  old: ">= $required"
  new: ">= $required - 1"
  killedBy: four required with three free slots falls back
- name: capacity-requires-one-extra
  old: ">= $required"
  new: "> $required"
  killedBy: one required with one free slot routes to the pool
- name: required-slots-default-zero
  old: "default: 1"
  new: "default: 0"
  killedBy: declaration
- name: required-slots-env-dropped
  old: "REQUIRED_SLOTS: ${{ inputs.required_slots }}"
  new: ""
  killedBy: declaration
- name: missing-max-capacity-treated-as-full
  old: "((.max_capacity // 0) | tonumber) <= 0"
  new: "((.max_capacity // 0) | tonumber) < 0"
  killedBy: four required with no capacity routes to the pool
- name: freshness-window-widened
  old: "| fabs) < 300)"
  new: "| fabs) < 300000)"
  killedBy: record older than the freshness window falls back
- name: required-slots-validation-dropped
  old: "=~ ^[1-9][0-9]*$"
  new: "=~ ^.*$"
  killedBy: required_slots 0 falls back
expectedMutationNames:
- capacity-allows-one-short
- capacity-requires-one-extra
- freshness-window-widened
- missing-max-capacity-treated-as-full
- required-slots-default-zero
- required-slots-env-dropped
- required-slots-validation-dropped
