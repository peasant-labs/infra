# Cases for the router's pool decision (.github/workflows/runner-router.yml,
# step "Pick a runner"), fed a record written by this package's publisher.
#
# ageSeconds   how old the published timestamp is when the router reads it;
#              negative means the dispatcher's clock runs ahead.
# healthy      the record's listener_healthy flag.
# assignedJobs the record's assigned job count (booting and running).
# maxCapacity  the record's slot count; 0 means the record carries no
#              capacity and the router skips the capacity gate. omitFields
#              deletes keys from the publisher's JSON after Publish (keeping
#              the real publisher and its fresh timestamp) for cases where
#              the key must be truly absent rather than zero.
# rawValue     replaces the published record with literal text.
# queryFails   the variable read fails (missing variable, auth, network).
# token        RUNNER_STATUS_TOKEN; omitted means a token is present.
# labels       the router's labels input; omitted means the workflow default.
# requiredSlots
#              the router's required_slots input, as a string so invalid
#              values can be expressed; omitted means the workflow default.
# wantNoticeLine
#              the exact notice line the router script must print;
#              asserted against the script's output. It names the
#              assigned, max, and required counts, so the numbers are pinned
#              too, not just the wording.
# wantRunner   explicit expected output when the case asserts an exact label set.
- name: idle healthy pool uses the workflow microvm default
  ageSeconds: 10
  healthy: true
  maxCapacity: 4
  wantPool: "true"
  wantReason: pool-online
  wantRunner: '["self-hosted","linux","x64","microvm"]'

- name: explicit labels override the workflow default
  ageSeconds: 10
  healthy: true
  labels: '["self-hosted","custom"]'
  wantPool: "true"
  wantReason: pool-online
  wantRunner: '["self-hosted","custom"]'

- name: fresh healthy record routes to the pool
  ageSeconds: 10
  healthy: true
  wantPool: "true"
  wantReason: pool-online

- name: pool with free capacity routes to the pool
  ageSeconds: 10
  healthy: true
  assignedJobs: 3
  maxCapacity: 4
  wantPool: "true"
  wantReason: pool-online

- name: full pool falls back to the fallback runner
  ageSeconds: 10
  healthy: true
  assignedJobs: 4
  maxCapacity: 4
  wantPool: "false"
  wantReason: pool-busy
  wantNoticeLine: "::notice::pool has fewer free slots than required (assigned=4 max=4 required=1)"

- name: four required with two free slots falls back
  ageSeconds: 10
  healthy: true
  assignedJobs: 2
  maxCapacity: 4
  requiredSlots: "4"
  wantPool: "false"
  wantReason: pool-busy
  wantNoticeLine: "::notice::pool has fewer free slots than required (assigned=2 max=4 required=4)"

- name: four required with three free slots falls back
  ageSeconds: 10
  healthy: true
  assignedJobs: 1
  maxCapacity: 4
  requiredSlots: "4"
  wantPool: "false"
  wantReason: pool-busy
  wantNoticeLine: "::notice::pool has fewer free slots than required (assigned=1 max=4 required=4)"

- name: four required with four free slots routes to the pool
  ageSeconds: 10
  healthy: true
  maxCapacity: 4
  requiredSlots: "4"
  wantPool: "true"
  wantReason: pool-online

- name: six required with four slots idle falls back as exceeding capacity
  ageSeconds: 10
  healthy: true
  maxCapacity: 4
  requiredSlots: "6"
  wantPool: "false"
  wantReason: pool-busy
  wantNoticeLine: "::notice::request for 6 slots exceeds the pool capacity (assigned=0 max=4 required=6)"

- name: four required with no capacity routes to the pool
  ageSeconds: 10
  healthy: true
  assignedJobs: 3
  requiredSlots: "4"
  wantPool: "true"
  wantReason: pool-online

- name: four required with a record lacking max_capacity routes to the pool
  ageSeconds: 10
  healthy: true
  assignedJobs: 3
  omitFields: [max_capacity]
  requiredSlots: "4"
  wantPool: "true"
  wantReason: pool-online

- name: one required with one free slot routes to the pool
  ageSeconds: 10
  healthy: true
  assignedJobs: 3
  maxCapacity: 4
  requiredSlots: "1"
  wantPool: "true"
  wantReason: pool-online

- name: required_slots 0 falls back
  ageSeconds: 10
  healthy: true
  maxCapacity: 4
  requiredSlots: "0"
  wantPool: "false"
  wantReason: query-failed

- name: required_slots -1 falls back
  ageSeconds: 10
  healthy: true
  maxCapacity: 4
  requiredSlots: "-1"
  wantPool: "false"
  wantReason: query-failed

- name: required_slots 4.5 falls back
  ageSeconds: 10
  healthy: true
  maxCapacity: 4
  requiredSlots: "4.5"
  wantPool: "false"
  wantReason: query-failed

- name: required_slots 04 falls back
  ageSeconds: 10
  healthy: true
  maxCapacity: 4
  requiredSlots: "04"
  wantPool: "false"
  wantReason: query-failed

- name: record older than the freshness window falls back
  ageSeconds: 301
  healthy: true
  wantPool: "false"
  wantReason: pool-stale

- name: fresh record with an unhealthy listener falls back
  ageSeconds: 10
  healthy: false
  wantPool: "false"
  wantReason: pool-stale

- name: record from a clock far ahead falls back
  ageSeconds: -400
  healthy: true
  wantPool: "false"
  wantReason: pool-stale

- name: unparseable record falls back
  rawValue: "not json"
  wantPool: "false"
  wantReason: pool-stale

- name: failed variable read falls back
  queryFails: true
  wantPool: "false"
  wantReason: query-failed

- name: missing token falls back
  ageSeconds: 10
  healthy: true
  token: ""
  wantPool: "false"
  wantReason: query-failed

- name: invalid labels input falls back
  ageSeconds: 10
  healthy: true
  labels: "[]"
  wantPool: "false"
  wantReason: query-failed
