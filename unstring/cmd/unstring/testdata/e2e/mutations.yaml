# End-to-end mutations, run through the built binary with the real ast-grep.
#
# Every mutation starts from a fresh copy of tree/ in a new git repository,
# with schema-module/ served from a file:// module proxy. Setup runs `init`,
# which must exit 0, and commits the baseline. At first adoption the baseline
# has these entries (the test asserts them before any step):
#
#   closed-set-literal:     web/src/compare.ts 3
#   exported-literal-union: web/src/phase.ts 1
#   go-closed-set-literal:  server/handle.go 2
#   go-json-key-assert:     server/handle.go 2
#   jsx-literal-testid:     web/src/view.tsx 2
#
# A step is one of:
#   replace: {file, old, new}   replace the one occurrence of old in file
#                               (file is relative to the repository; the
#                               baseline is .unstring-baseline.yaml)
#   delete: file                remove a file
#   git: [args]                 run git in the repository
#   stubAstGrep: version        put an ast-grep that reports this version
#                               first on PATH for the following runs
#   emptyProxy: true            serve no module for the following runs
#   run: [args]                 run unstring with these arguments, then check:
#     exit      the exit code
#     kinds     the exact set of finding kinds the report prints
#     stdout    substrings of standard output
#     stderr    substrings of standard error
#     baseline  unchanged: true          byte-identical to before the run
#               changedLines: [lines]    only these lines differ, same count
#               contains / lacks: [lines] whole lines present or absent

setupEntries:
  - "  closed-set-literal:"
  - "    web/src/compare.ts: 3"
  - "  exported-literal-union:"
  - "    web/src/phase.ts: 1"
  - "  go-closed-set-literal:"
  - "    server/handle.go: 2"
  - "  go-json-key-assert:"
  - "    server/handle.go: 2"
  - "  jsx-literal-testid:"
  - "    web/src/view.tsx: 2"

mutations:
  - name: clean-tree
    steps:
      - run: [check]
        exit: 0
        kinds: []
        stdout: ["unstring check: no findings."]

  - name: command-name-and-version
    steps:
      - run: [show, version]
        exit: 0
        stdout: ["unstring v0.0.1 (requires ast-grep 0.51.2)"]

  - name: new-hit-listed-file-ts
    steps:
      - replace:
          file: web/src/view.tsx
          old: 'export const Cell'
          new: "export const Foot = () => <tfoot data-testid=\"foot\" />;\nexport const Cell"
      - run: [check]
        exit: 1
        kinds: [raised]
        stdout: ["web/src/view.tsx:2", "allowed 2, found 3"]

  - name: new-hit-listed-file-go
    steps:
      - replace:
          file: server/handle.go
          old: "\treturn n + k\n"
          new: "\tv, _ := m[\"extra\"].(string)\n\treturn n + k + v\n"
      - run: [check]
        exit: 1
        kinds: [raised]
        stdout: ["server/handle.go:6", "allowed 2, found 3"]

  - name: new-hit-unlisted-file-ts
    steps:
      - replace: {file: web/src/plain.tsx, old: "<div>plain", new: "<div data-testid=\"plain\">plain"}
      - run: [check]
        exit: 1
        kinds: [new-file]
        stdout: ["web/src/plain.tsx:1", "allowed 0, found 1"]

  - name: new-hit-unlisted-file-go
    steps:
      - replace:
          file: server/plain.go
          old: "func plain() int { return 1 }"
          new: "func plain(m map[string]any) int { n, _ := m[\"n\"].(int); return n }"
      - run: [check]
        exit: 1
        kinds: [new-file]
        stdout: ["server/plain.go:3", "allowed 0, found 1"]

  - name: hit-removed-then-update
    steps:
      - replace: {file: web/src/view.tsx, old: '<td data-testid="cell">', new: "<td>"}
      - run: [check]
        exit: 1
        kinds: [stale-lower]
        stdout: ["allowed 2, found 1"]
      - run: [update]
        exit: 0
        baseline: {contains: ["    web/src/view.tsx: 1"], lacks: ["    web/src/view.tsx: 2"]}
      - run: [check]
        exit: 0
        kinds: []

  - name: update-refuses-raise
    steps:
      - replace:
          file: web/src/view.tsx
          old: 'export const Cell'
          new: "export const Foot = () => <tfoot data-testid=\"foot\" />;\nexport const Cell"
      - run: [update]
        exit: 1
        kinds: [raised]
        stdout: ["allowed 2, found 3", "is unchanged"]
        baseline: {unchanged: true}

  - name: rename-moves-entry
    steps:
      - git: [mv, web/src/view.tsx, web/src/view2.tsx]
      - run: [update]
        exit: 0
        baseline: {contains: ["    web/src/view2.tsx: 2"], lacks: ["    web/src/view.tsx: 2"]}
      - run: [check]
        exit: 0
        kinds: []

  - name: catalog-growth-closed-member
    steps:
      - replace:
          file: web/src/status.ts
          old: '  Failed: closed("failed", "failed"),'
          new: "  Failed: closed(\"failed\", \"failed\"),\n  Queued: closed(\"queued\", \"queued\"),"
      - run: [check]
        exit: 1
        kinds: [new-file]
        stdout: ["web/src/queue.ts:1"]
      - run: [update]
        exit: 1
        kinds: [new-file]
        baseline: {unchanged: true}

  - name: catalog-growth-union-member
    steps:
      - replace: {file: web/src/phase.ts, old: '"draft" | "final"', new: '"draft" | "final" | "queued"'}
      - run: [check]
        exit: 1
        kinds: [new-file]
        stdout: ["web/src/queue.ts:1"]
      - run: [update]
        exit: 1
        kinds: [new-file]
        baseline: {unchanged: true}

  - name: catalog-growth-go-constant
    steps:
      - replace:
          file: server/status.go
          old: "\tStatusFailed Status = \"failed\"\n"
          new: "\tStatusFailed Status = \"failed\"\n\tStatusQueued Status = \"queued\"\n"
      - run: [check]
        exit: 1
        kinds: [new-file]
        stdout: ["server/queue.go:5", "go-closed-set-literal"]
      - run: [update]
        exit: 1
        kinds: [new-file]
        baseline: {unchanged: true}

  - name: baseline-from-other-tool-version
    steps:
      - replace: {file: .unstring-baseline.yaml, old: "tool: v0.0.1", new: "tool: v0.0.9"}
      - run: [check]
        exit: 1
        kinds: [baseline-header]
        stdout: ["tool v0.0.9", "unstring update"]
      - run: [init]
        exit: 1
        stdout: ["already exists", "unstring update"]
        baseline: {unchanged: true}
      - run: [update]
        exit: 0
        baseline: {changedLines: ["tool: v0.0.1"]}
      - run: [check]
        exit: 0
        kinds: []

  - name: tool-upgrade-with-new-hit
    steps:
      - replace: {file: .unstring-baseline.yaml, old: "tool: v0.0.1", new: "tool: v0.0.9"}
      - replace:
          file: web/src/view.tsx
          old: 'export const Cell'
          new: "export const Foot = () => <tfoot data-testid=\"foot\" />;\nexport const Cell"
      - run: [check]
        exit: 1
        kinds: [baseline-header, raised]
      - run: [update]
        exit: 1
        kinds: [raised]
        baseline: {unchanged: true}
      - replace:
          file: web/src/view.tsx
          old: "export const Foot = () => <tfoot data-testid=\"foot\" />;\n"
          new: ""
      - run: [update]
        exit: 0
        baseline: {changedLines: ["tool: v0.0.1"]}
      - run: [check]
        exit: 0
        kinds: []

  - name: tool-upgrade-new-hit-marked
    steps:
      - replace: {file: .unstring-baseline.yaml, old: "tool: v0.0.1", new: "tool: v0.0.9"}
      - replace:
          file: server/handle.go
          old: "\treturn n + k\n"
          new: "\t// unstring-allow: go-json-key-assert — walks untrusted raw json\n\tv, _ := m[\"extra\"].(string)\n\treturn n + k + v\n"
      - run: [update]
        exit: 0
        baseline: {changedLines: ["tool: v0.0.1"]}
      - run: [check]
        exit: 0
        kinds: []

  - name: init-first-adoption
    steps:
      - delete: .unstring-baseline.yaml
      - run: [init]
        exit: 0
        baseline: {contains: ["tool: v0.0.1", "ast-grep: 0.51.2", "    web/src/view.tsx: 2", "    server/handle.go: 2"]}
      - run: [check]
        exit: 0
        kinds: []

  - name: init-refused-when-baseline-exists
    steps:
      - run: [init]
        exit: 1
        stdout: ["already exists", "unstring update"]
        baseline: {unchanged: true}

  - name: marker-on-closed-set-rule
    steps:
      - replace:
          file: web/src/compare.ts
          old: "export const isReady"
          new: "// unstring-allow: closed-set-literal — this value is ours\nexport const isReady"
      - run: [check]
        exit: 1
        kinds: [marker-not-accepted]

  - name: marker-on-go-closed-set-rule
    steps:
      - replace:
          file: server/handle.go
          old: "\tcase \"ready\":\n"
          new: "\t// unstring-allow: go-closed-set-literal — this value is ours\n\tcase \"ready\":\n"
      - run: [check]
        exit: 1
        kinds: [marker-not-accepted]

  - name: marker-accepted-on-other-rule
    steps:
      - replace:
          file: server/handle.go
          old: "\tn, _ := m[\"name\"].(string)\n"
          new: "\t// unstring-allow: go-json-key-assert — walks untrusted raw json\n\tn, _ := m[\"name\"].(string)\n"
      - run: [check]
        exit: 1
        kinds: [stale-lower]
      - run: [update]
        exit: 0
        baseline: {changedLines: ["    server/handle.go: 1"]}
      - run: [check]
        exit: 0
        kinds: []

  - name: wrong-ast-grep
    steps:
      - stubAstGrep: 0.45.0
      - run: [check]
        exit: 2
        stderr: ["ast-grep 0.45.0 found at", "requires exactly 0.51.2", "npm install --global @ast-grep/cli@0.51.2", "No file was scanned"]

  - name: schema-module-missing
    steps:
      - emptyProxy: true
      - run: [check]
        exit: 2
        stderr: ["example.test/schema", "go mod download"]
