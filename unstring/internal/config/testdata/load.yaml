# Cases for config.Load. Each case writes `files` into a temporary directory,
# writes `config` as .unstring.yaml there, and loads it.
#
# want      the loaded values (valid cases). Omitted keys are not compared.
# exempted  Exempted(rule, file) results on the loaded config.
# excluded  Excluded(file) results on the loaded config.
# error     substrings the failure must contain (refused cases). Every refusal
#           is a failure with non-empty what, why, where and fix.

cases:
  - name: defaults-applied
    files: {web/a.ts: "", server/a.go: ""}
    config: |
      version: 1
      ts: {roots: [web]}
      go: {roots: [server]}
    want:
      baseline: .unstring-baseline.yaml
      tsRoots: [web]
      goRoots: [server]
      prefixes: [/api/v1]
      dataDirs: [testdata, fixtures, __fixtures__, captures]

  - name: explicit-settings-kept
    files: {frontend/a.ts: "", backend/internal/router/router.go: ""}
    config: |
      version: 1
      baseline: ci/unstring-baseline.yaml
      ts: {roots: [frontend]}
      schema: {module: github.com/peasant-labs/schema}
      endpoints:
        prefixes: ["/api/v1", "/internal/v2"]
        callees: [api, client.get]
        mountFiles: [backend/internal/router/router.go]
      dataDirs: [golden]
    want:
      baseline: ci/unstring-baseline.yaml
      tsRoots: [frontend]
      prefixes: [/api/v1, /internal/v2]
      callees: [api, client.get]
      mountFiles: [backend/internal/router/router.go]
      dataDirs: [golden]
      schemaModule: github.com/peasant-labs/schema

  - name: accepts-glob-mount-file
    files: {backend/internal/router/auth.go: "package router\n"}
    config: |
      version: 1
      go: {roots: [backend]}
      endpoints:
        mountFiles: [backend/internal/router/*.go]
    want:
      goRoots: [backend]
      mountFiles: [backend/internal/router/*.go]

  - name: root-dot-accepted
    files: {a.ts: ""}
    config: |
      version: 1
      ts: {roots: ["."]}
    want:
      tsRoots: ["."]

  - name: exempt-generated-files-for-closed-set
    files:
      backend/gen/db.go: |
        // Code generated by sqlc. DO NOT EDIT.
        package gen
      backend/gen/sub/q.go: |
        // Code generated by sqlc. DO NOT EDIT.
        package sub
      backend/main.go: "package main\n"
    config: |
      version: 1
      go: {roots: [backend]}
      exempt:
        - rule: go-closed-set-literal
          paths: [backend/gen/**]
          reason: sqlc output, regenerated from the queries
        - rule: "*"
          paths: [backend/gen]
          reason: sqlc output, regenerated from the queries
    exempted:
      - {rule: go-closed-set-literal, file: backend/gen/db.go, want: true}
      - {rule: go-closed-set-literal, file: backend/gen/sub/q.go, want: true}
      - {rule: go-json-key-assert, file: backend/gen/sub/q.go, want: true}
      - {rule: go-closed-set-literal, file: backend/main.go, want: false}

  - name: exempt-hand-written-file-for-other-rule
    files: {frontend/scripts/visual/lib/test-id-selector.mjs: "export const s = 1;\n"}
    config: |
      version: 1
      ts: {roots: [frontend]}
      exempt:
        - rule: testid-selector-string
          paths: [frontend/scripts/visual/lib/test-id-selector.mjs]
          reason: the one place a test-id selector string is built
    exempted:
      - {rule: testid-selector-string, file: frontend/scripts/visual/lib/test-id-selector.mjs, want: true}
      - {rule: jsx-literal-testid, file: frontend/scripts/visual/lib/test-id-selector.mjs, want: false}
      - {rule: testid-selector-string, file: frontend/scripts/visual/lib/other.mjs, want: false}

  - name: refuses-unknown-key
    files: {web/a.ts: ""}
    config: |
      version: 1
      ts: {roots: [web]}
      excludes: [web/gen]
    error: ["field excludes not found", "unknown keys"]

  - name: exclude-vendored-directory
    files:
      third_party/sqlite/blob.go: "package sqlite\n"
      third_party_owned/x.go: "package owned\n"
      server/a.go: "package server\n"
    config: |
      version: 1
      go: {roots: ["."]}
      exclude:
        - paths: [third_party]
          reason: vendored copy of an upstream SQLite driver
    excluded:
      - {file: third_party/sqlite/blob.go, want: true}
      - {file: third_party/UPSTREAM.json, want: true}
      - {file: third_party_owned/x.go, want: false}
      - {file: server/a.go, want: false}

  - name: exclude-glob-inside-root
    files:
      web/vendor-lib/a.js: ""
      web/vendor-lib/deep/b.js: ""
      web/src/a.ts: ""
    config: |
      version: 1
      ts: {roots: [web]}
      exclude:
        - paths: [web/vendor-*/**]
          reason: vendored upstream bundle
    excluded:
      - {file: web/vendor-lib/a.js, want: true}
      - {file: web/vendor-lib/deep/b.js, want: true}
      - {file: web/src/a.ts, want: false}

  - name: refuses-exclude-without-paths
    files: {web/a.ts: ""}
    config: |
      version: 1
      ts: {roots: [web]}
      exclude:
        - reason: vendored upstream bundle
    error: ["exclude entry 1", "lists no paths"]

  - name: refuses-exclude-without-reason
    files: {web/vendor/a.js: ""}
    config: |
      version: 1
      ts: {roots: [web]}
      exclude:
        - paths: [web/vendor]
          reason: "  "
    error: ["exclude entry 1", "has no reason", "add `reason:"]

  - name: refuses-absolute-exclude-path
    files: {web/vendor/a.js: ""}
    config: |
      version: 1
      ts: {roots: [web]}
      exclude:
        - paths: [/srv/web/vendor]
          reason: vendored upstream bundle
    error: ["\"/srv/web/vendor\"", "is absolute"]

  - name: refuses-exclude-path-outside-config-directory
    files: {web/vendor/a.js: ""}
    config: |
      version: 1
      ts: {roots: [web]}
      exclude:
        - paths: [../vendor]
          reason: vendored upstream bundle
    error: ["\"../vendor\"", "leaves the config's directory"]

  - name: refuses-exclude-path-with-backslash
    files: {web/vendor/a.js: ""}
    config: |
      version: 1
      ts: {roots: [web]}
      exclude:
        - paths: ['web\vendor']
          reason: vendored upstream bundle
    error: ["uses `\\` separators"]

  - name: refuses-exclude-covering-root
    files: {web/a.ts: ""}
    config: |
      version: 1
      ts: {roots: [web]}
      exclude:
        - paths: [web]
          reason: vendored upstream bundle
    error: ["covers the whole ts root \"web\"", "remove \"web\" from `ts.roots`"]

  - name: refuses-exclude-above-root
    files: {server/internal/a.go: "package internal\n"}
    config: |
      version: 1
      go: {roots: [server/internal]}
      exclude:
        - paths: [server]
          reason: vendored upstream bundle
    error: ["covers the whole go root \"server/internal\""]

  - name: refuses-exclude-glob-covering-root
    files: {a.go: "package a\n"}
    config: |
      version: 1
      go: {roots: ["."]}
      exclude:
        - paths: ["**"]
          reason: vendored upstream bundle
    error: ["covers the whole go root \".\""]

  - name: refuses-exclude-matching-nothing
    files: {web/a.ts: ""}
    config: |
      version: 1
      ts: {roots: [web]}
      exclude:
        - paths: [web/thrid_party]
          reason: vendored upstream bundle
    error: ["\"web/thrid_party\"", "matches no file under a configured root"]

  - name: refuses-exclude-matching-only-outside-roots
    files: {web/a.ts: "", third_party/lib.js: ""}
    config: |
      version: 1
      ts: {roots: [web]}
      exclude:
        - paths: [third_party]
          reason: vendored upstream bundle
    error: ["\"third_party\"", "matches no file under a configured root"]

  - name: refuses-other-version
    files: {web/a.ts: ""}
    config: |
      version: 2
      ts: {roots: [web]}
    error: ["`version: 2`", "only `version: 1`"]

  - name: refuses-empty-file
    config: ""
    error: ["is empty"]

  - name: refuses-no-language
    config: |
      version: 1
    error: ["neither a `ts` nor a `go` section"]

  - name: refuses-language-without-roots
    config: |
      version: 1
      go: {roots: []}
    error: ["`go` section", "has no roots"]

  - name: refuses-missing-root
    config: |
      version: 1
      ts: {roots: [frontend]}
    error: ["\"frontend\"", "is not a directory"]

  - name: refuses-absolute-root
    config: |
      version: 1
      ts: {roots: [/srv/web]}
    error: ["is absolute"]

  - name: refuses-mount-file-parent
    files: {backend/a.go: "package backend\n"}
    config: |
      version: 1
      go: {roots: [backend]}
      endpoints:
        mountFiles: [../router.go]
    error: ["\"../router.go\"", "leaves the config's directory"]

  - name: refuses-root-outside-config-directory
    config: |
      version: 1
      ts: {roots: [../web]}
    error: ["leaves the config's directory"]

  - name: refuses-baseline-not-clean
    files: {web/a.ts: ""}
    config: |
      version: 1
      baseline: ./ci/../baseline.yaml
      ts: {roots: [web]}
    error: ["not in clean form"]

  - name: refuses-endpoint-prefix-without-slash
    files: {web/a.ts: ""}
    config: |
      version: 1
      ts: {roots: [web]}
      endpoints: {prefixes: [api/v1]}
    error: ["\"api/v1\"", "does not start with `/`"]

  - name: refuses-callee-that-is-not-an-identifier
    files: {web/a.ts: ""}
    config: |
      version: 1
      ts: {roots: [web]}
      endpoints: {callees: ["api()"]}
    error: ["\"api()\"", "not a TS identifier"]

  - name: refuses-data-dir-with-slash
    files: {web/a.ts: ""}
    config: |
      version: 1
      ts: {roots: [web]}
      dataDirs: [test/data]
    error: ["\"test/data\"", "single directory name"]

  - name: refuses-schema-module-with-version
    files: {web/a.ts: ""}
    config: |
      version: 1
      ts: {roots: [web]}
      schema: {module: github.com/peasant-labs/schema@v0.51.0}
    error: ["not a module path"]

  - name: refuses-unknown-exempt-rule
    files: {web/a.ts: ""}
    config: |
      version: 1
      ts: {roots: [web]}
      exempt:
        - rule: testid-selector
          paths: [web/a.ts]
          reason: the one place a selector is built
    error: ["\"testid-selector\"", "does not exist", "unstring show rules"]

  - name: refuses-exempt-without-reason
    files: {web/a.ts: ""}
    config: |
      version: 1
      ts: {roots: [web]}
      exempt:
        - rule: testid-selector-string
          paths: [web/a.ts]
          reason: "   "
    error: ["has no reason"]

  - name: refuses-exempt-without-paths
    files: {web/a.ts: ""}
    config: |
      version: 1
      ts: {roots: [web]}
      exempt:
        - rule: testid-selector-string
          reason: the one place a selector is built
    error: ["lists no paths"]

  - name: refuses-malformed-exempt-glob
    files: {web/a.ts: ""}
    config: |
      version: 1
      ts: {roots: [web]}
      exempt:
        - rule: testid-selector-string
          paths: ["web/[a.ts"]
          reason: the one place a selector is built
    error: ["malformed glob"]

  - name: refuses-closed-set-exempt-on-hand-written-file
    files:
      web/gen/types.ts: |
        // Code generated by schema-gen. DO NOT EDIT.
        export type A = "a" | "b";
      web/gen/handwritten.ts: |
        export const isA = (v: string) => v === "a";
    config: |
      version: 1
      ts: {roots: [web]}
      exempt:
        - rule: closed-set-literal
          paths: [web/gen/*.ts]
          reason: generated contract types
    error: ["hand-written file web/gen/handwritten.ts", "Code generated", "DO NOT EDIT"]

  - name: refuses-all-rules-exempt-on-hand-written-file
    files:
      server/legacy/old.go: "package legacy\n"
    config: |
      version: 1
      go: {roots: [server]}
      exempt:
        - rule: "*"
          paths: [server/legacy]
          reason: old code we do not want to look at
    error: ["hand-written file server/legacy/old.go"]

  - name: typed-mount-defaults-applied
    files: {server/a.go: ""}
    config: |
      version: 1
      go: {roots: [server]}
      typed:
        goMountLiteral: {enabled: true}
    want:
      mountEnabled: true
      mountRouters: [github.com/go-chi/chi/v5]
      mountIncludeTests: false

  - name: typed-mount-explicit-settings-kept
    files: {server/a.go: ""}
    config: |
      version: 1
      go: {roots: [server]}
      typed:
        goMountLiteral:
          enabled: true
          routers: [github.com/go-chi/chi/v5, net/http]
          includeTests: true
    want:
      mountEnabled: true
      mountRouters: [github.com/go-chi/chi/v5, net/http]
      mountIncludeTests: true

  - name: typed-mount-off-by-default
    files: {server/a.go: ""}
    config: |
      version: 1
      go: {roots: [server]}
    want:
      mountEnabled: false
      mountRouters: []
      mountIncludeTests: false

  - name: refuses-mount-settings-without-enabled
    files: {server/a.go: ""}
    config: |
      version: 1
      go: {roots: [server]}
      typed:
        goMountLiteral: {routers: [net/http]}
    error: ["without `enabled: true`", "add `enabled: true`"]

  - name: refuses-include-tests-without-enabled
    files: {server/a.go: ""}
    config: |
      version: 1
      go: {roots: [server]}
      typed:
        goMountLiteral: {includeTests: true}
    error: ["includeTests without `enabled: true`"]

  - name: refuses-false-include-tests-without-enabled
    files: {server/a.go: ""}
    config: |
      version: 1
      go: {roots: [server]}
      typed:
        goMountLiteral: {includeTests: false}
    error: ["includeTests without `enabled: true`"]

  - name: refuses-null-router-setting-without-enabled
    files: {server/a.go: ""}
    config: |
      version: 1
      go: {roots: [server]}
      typed:
        goMountLiteral: {routers: null}
    error: ["routers or typed.goMountLiteral.includeTests without `enabled: true`"]

  - name: refuses-null-router-setting-when-enabled
    files: {server/a.go: ""}
    config: |
      version: 1
      go: {roots: [server]}
      typed:
        goMountLiteral: {enabled: true, routers: null}
    error: ["typed.goMountLiteral.routers", "is null", "list of import paths", "omit"]

  - name: refuses-null-include-tests-when-enabled
    files: {server/a.go: ""}
    config: |
      version: 1
      go: {roots: [server]}
      typed:
        goMountLiteral: {enabled: true, includeTests: null}
    error: ["typed.goMountLiteral.includeTests", "is null", "true or false", "omit"]

  - name: refuses-mount-router-not-import-path
    files: {server/a.go: ""}
    config: |
      version: 1
      go: {roots: [server]}
      typed:
        goMountLiteral: {enabled: true, routers: ["github.com/go-chi/chi/v5@v5.3.2"]}
    error: ["is not a Go import path", "typed.goMountLiteral.routers"]

  - name: refuses-repeated-mount-router
    files: {server/a.go: ""}
    config: |
      version: 1
      go: {roots: [server]}
      typed:
        goMountLiteral: {enabled: true, routers: [net/http, net/http]}
    error: ["listed twice"]

# MatchPath cases: pattern, file, and whether it matches.
globs:
  - {pattern: web/gen/**, file: web/gen/a.ts, match: true}
  - {pattern: web/gen/**, file: web/gen/deep/b.ts, match: true}
  - {pattern: web/gen/**, file: web/generated/a.ts, match: false}
  - {pattern: "**/*.gen.ts", file: a.gen.ts, match: true}
  - {pattern: "**/*.gen.ts", file: web/src/a.gen.ts, match: true}
  - {pattern: "**/*.gen.ts", file: web/src/a.ts, match: false}
  - {pattern: web/*.ts, file: web/a.ts, match: true}
  - {pattern: web/*.ts, file: web/sub/a.ts, match: false}
  - {pattern: web/gen, file: web/gen/a.ts, match: true}
  - {pattern: web/gen, file: web/generated/a.ts, match: false}
  - {pattern: web/a.ts, file: web/a.ts, match: true}
  - {pattern: web/a.ts, file: web/a.tsx, match: false}
