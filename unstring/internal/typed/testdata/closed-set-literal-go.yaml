- name: direct comparison
  code: |
    package fixture
    type Role string
    const User Role = "user"
    func test(r Role) bool { return r == "user" }
  expect: [{set: Role, member: User, literal: user, line: 4}]
- name: reversed comparison
  code: |
    package fixture
    type Role string
    const User Role = "user"
    func test(r Role) bool { return "user" != r }
  expect: [{set: Role, member: User, literal: user, line: 4}]
- name: switch case
  code: |
    package fixture
    type Role string
    const User Role = "user"
    func test(r Role) { switch r { case "user": } }
  expect: [{set: Role, member: User, literal: user, line: 4}]
