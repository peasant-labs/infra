- name: directive locations keep distinct physical sites
  roots: [., sub]
  files:
    sub/a.go: |
      package fixture
      type Role string
      const User Role = "user"
      //line generated.go:10
      func F(r Role) bool { return r == "user" }
      //line generated.go:10
      func G(r Role) bool { return r == "user" }
  expect: [{file: sub/a.go, set: Role, member: User, literal: user, line: 5}, {file: sub/a.go, set: Role, member: User, literal: user, line: 7}]
