- name: overlapping roots
  roots: [., sub]
  files:
    sub/router.go: |
      package sub
      import (
      	"net/http"
      	"github.com/go-chi/chi/v5"
      )
      func New(h http.HandlerFunc) { chi.NewRouter().Get("/health", h) }
  expect: [{file: sub/router.go, line: 6, receiver: "*chi.Mux", method: Get, pattern: /health}]
