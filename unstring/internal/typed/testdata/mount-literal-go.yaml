- name: test file included on opt-in
  includeTests: true
  files:
    router.go: |
      package fixture
      import (
      	"net/http"
      	"github.com/go-chi/chi/v5"
      )
      func New(h http.HandlerFunc) { chi.NewRouter().Get("/health", h) }
    router_test.go: |
      package fixture
      import (
      	"net/http"
      	"github.com/go-chi/chi/v5"
      )
      func newTestRouter(h http.HandlerFunc) *chi.Mux {
      	r := chi.NewRouter()
      	r.Get("/fixture", h)
      	return r
      }
    external_test.go: |
      package fixture_test
      import (
      	"net/http"
      	"github.com/go-chi/chi/v5"
      )
      func mount(r chi.Router, h http.HandlerFunc) { r.Get("/external", h) }
  expect:
    - {file: external_test.go, line: 6, receiver: chi.Router, method: Get, pattern: /external}
    - {file: router.go, line: 6, receiver: "*chi.Mux", method: Get, pattern: /health}
    - {file: router_test.go, line: 8, receiver: "*chi.Mux", method: Get, pattern: /fixture}
- name: wrapper embedding a router
  files:
    api.go: |
      package fixture
      import (
      	"net/http"
      	"github.com/go-chi/chi/v5"
      )
      type API struct{ chi.Router }
      type Server struct{ *chi.Mux }
      func New(h http.HandlerFunc) {
      	a := &API{Router: chi.NewRouter()}
      	a.Get("/promoted", h)
      	s := Server{Mux: chi.NewRouter()}
      	s.Post("/promoted-mux", h)
      }
  expect:
    - {file: api.go, line: 10, receiver: "*fixture.API", method: Get, pattern: /promoted}
    - {file: api.go, line: 12, receiver: fixture.Server, method: Post, pattern: /promoted-mux}
- name: wrapper forwarding a parameter
  files:
    api.go: |
      package fixture
      import (
      	"net/http"
      	"github.com/go-chi/chi/v5"
      )
      type API struct{ r chi.Router }
      func (a *API) Get(path string, h http.HandlerFunc) { a.r.Get(path, h) }
      func mount(r chi.Router, path string, h http.HandlerFunc) { r.Route(path, func(chi.Router) {}) }
      func New(h http.HandlerFunc) {
      	a := &API{r: chi.NewRouter()}
      	a.Get("/wrapped", h)
      	mount(chi.NewRouter(), "/forwarded", h)
      }
  expect: []
- name: non-router receiver with mount method names
  files:
    cache.go: |
      package fixture
      import (
      	"net/http"
      	"github.com/go-chi/chi/v5"
      )
      var _ chi.Router
      type Cache struct{}
      func (Cache) Get(key string, fallback http.HandlerFunc) string { return key }
      func (Cache) Route(key string, fn func(chi.Router)) {}
      type Getter interface{ Get(key string, fallback http.HandlerFunc) string }
      func use(c Cache, g Getter, h http.HandlerFunc) {
      	c.Get("/cache/key", h)
      	c.Route("/cache/route", nil)
      	g.Get("/interface/key", h)
      }
  expect: []
- name: serve mux not configured
  files:
    mux.go: |
      package fixture
      import (
      	"net/http"
      	"github.com/go-chi/chi/v5"
      )
      var _ chi.Router
      func New(h http.HandlerFunc) *http.ServeMux {
      	mux := http.NewServeMux()
      	mux.HandleFunc("GET /x", h)
      	mux.Handle("/y", h)
      	return mux
      }
  expect: []
- name: serve mux configured
  routers: [net/http]
  files:
    mux.go: |
      package fixture
      import "net/http"
      func New(h http.HandlerFunc, req *http.Request, c *http.Client) *http.ServeMux {
      	mux := http.NewServeMux()
      	mux.HandleFunc("GET /x", h)
      	mux.Handle("/y", h)
      	_ = req.Header.Get("Accept")
      	_, _ = c.Get("/relative")
      	return mux
      }
  expect:
    - {file: mux.go, line: 5, receiver: "*http.ServeMux", method: HandleFunc, pattern: GET /x}
    - {file: mux.go, line: 6, receiver: "*http.ServeMux", method: Handle, pattern: /y}
- name: non-literal patterns
  files:
    router.go: |
      package fixture
      import (
      	"fmt"
      	"net/http"
      	"github.com/go-chi/chi/v5"
      )
      const healthPath = "/health"
      type route struct{ pattern string }
      func (r route) Pattern() string { return r.pattern }
      func New(h http.HandlerFunc, id string, rt route) {
      	r := chi.NewRouter()
      	r.Get(healthPath, h)
      	r.Get(fmt.Sprintf("/items/%s", id), h)
      	r.Get("/items/"+id, h)
      	r.Get(rt.Pattern(), h)
      	r.Get("health", h)
      }
  expect: []
- name: literal concatenation
  files:
    router.go: |
      package fixture
      import (
      	"net/http"
      	"github.com/go-chi/chi/v5"
      )
      func New(h http.HandlerFunc) {
      	chi.NewRouter().Get("/api" + ("/v1"), h)
      }
  expect: [{file: router.go, line: 7, receiver: "*chi.Mux", method: Get, pattern: /api/v1, text: '"/api" + ("/v1")'}]
