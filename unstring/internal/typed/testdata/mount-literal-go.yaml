# Cases for the typed mount pass. Each case writes `files` into a fresh module
# whose go.mod requires github.com/go-chi/chi/v5 and replaces it with the
# offline stub in testdata/chi, then runs the pass.
#
# routers  router packages; omitted means the default (chi v5 only).
# includeTests  true scans _test.go files too; omitted means they are excluded.
# roots    the roots; omitted means ".".
# error    a substring the load or pass error must contain.
# expect   every finding, in report order: file, line, receiver, method,
#          pattern (the literal's value) and, when given, text (the source).
- name: mount on chi mux
  files:
    router.go: |
      package fixture
      import (
      	"net/http"
      	"github.com/go-chi/chi/v5"
      )
      func New(h http.HandlerFunc) *chi.Mux {
      	r := chi.NewRouter()
      	r.Get("/health", h)
      	return r
      }
  expect: [{file: router.go, line: 8, receiver: "*chi.Mux", method: Get, pattern: /health, text: '"/health"'}]
- name: router interface in route callback
  files:
    router.go: |
      package fixture
      import (
      	"net/http"
      	"github.com/go-chi/chi/v5"
      )
      func mountAuth(r chi.Router, h http.HandlerFunc) {
      	r.Get("/auth/me", h)
      	r.Delete(`/auth/me`, h)
      }
  expect:
    - {file: router.go, line: 7, receiver: chi.Router, method: Get, pattern: /auth/me}
    - {file: router.go, line: 8, receiver: chi.Router, method: Delete, pattern: /auth/me, text: '`/auth/me`'}
- name: mount after with
  files:
    router.go: |
      package fixture
      import (
      	"net/http"
      	"github.com/go-chi/chi/v5"
      )
      func New(h http.HandlerFunc, mw func(http.Handler) http.Handler) {
      	r := chi.NewRouter()
      	r.With(mw).Post("/auth/logout", h)
      }
  expect: [{file: router.go, line: 8, receiver: chi.Router, method: Post, pattern: /auth/logout}]
- name: route and mount group literals
  files:
    router.go: |
      package fixture
      import (
      	"net/http"
      	"github.com/go-chi/chi/v5"
      )
      func New(h http.HandlerFunc, admin http.Handler) {
      	r := chi.NewRouter()
      	r.Route("/api/v1", func(r chi.Router) {
      		r.Get("/users/{username}", h)
      	})
      	r.Mount("/admin", admin)
      }
  expect:
    - {file: router.go, line: 8, receiver: "*chi.Mux", method: Route, pattern: /api/v1}
    - {file: router.go, line: 9, receiver: chi.Router, method: Get, pattern: "/users/{username}"}
    - {file: router.go, line: 11, receiver: "*chi.Mux", method: Mount, pattern: /admin}
- name: method pattern argument
  files:
    router.go: |
      package fixture
      import (
      	"net/http"
      	"github.com/go-chi/chi/v5"
      )
      func New(h http.HandlerFunc, hh http.Handler) {
      	r := chi.NewRouter()
      	r.MethodFunc("GET", "/x", h)
      	r.Method(http.MethodPost, "/y", hh)
      	r.HandleFunc("/z", h)
      }
  expect:
    - {file: router.go, line: 8, receiver: "*chi.Mux", method: MethodFunc, pattern: /x}
    - {file: router.go, line: 9, receiver: "*chi.Mux", method: Method, pattern: /y}
    - {file: router.go, line: 10, receiver: "*chi.Mux", method: HandleFunc, pattern: /z}
- name: mount outside router file
  files:
    internal/handler/extra.go: |
      package handler
      import (
      	"net/http"
      	"github.com/go-chi/chi/v5"
      )
      func Register(r chi.Router, h http.HandlerFunc) { r.Put("/extra", h) }
  expect: [{file: internal/handler/extra.go, line: 6, receiver: chi.Router, method: Put, pattern: /extra}]
- name: string helpers
  files:
    path.go: |
      package fixture
      import (
      	"strings"
      	"github.com/go-chi/chi/v5"
      )
      var _ chi.Router
      func Split(pattern, path string) (bool, []string) {
      	return strings.HasPrefix(pattern, "/"), strings.Split(path, "/")
      }
  expect: []
