- name: narrowed receiver retains declared set
  language: ts
  code: |
    type Role = 'user' | 'assistant'
    const Role = { User: 'user', Assistant: 'assistant' } as const
    function test(role: Role) {
      if (role === Role.User) return role === 'user'
      return false
    }
  expect: [{set: Role, member: User, literal: user, line: 4, column: 43}]
- name: narrowed property comparisons use declared set
  language: ts
  code: |
    type Role = 'user' | 'assistant' | 'tool' | 'system'
    const Role = { User: 'user', Assistant: 'assistant', Tool: 'tool', System: 'system' } as const
    interface Turn { role: Role }
    function test(x: Turn) {
      if (x.role === 'user') return 1
      if (x.role === 'assistant') return 2
      return 0
    }
  expect: [{set: Role, member: User, literal: user, line: 5, column: 18}, {set: Role, member: Assistant, literal: assistant, line: 6, column: 18}]
