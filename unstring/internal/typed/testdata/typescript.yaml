- name: ts comparison
  language: ts
  code: |
    type Role = 'user' | 'assistant'
    const Role = { User: 'user', Assistant: 'assistant' } as const
    declare const role: Role
    role === 'user'
  expect: [{set: Role, member: User, literal: user, line: 4, column: 10}]
- name: reversed comparison
  language: ts
  code: |
    type Role = 'user' | 'assistant'
    const Role = { User: 'user', Assistant: 'assistant' } as const
    declare const role: Role
    'assistant' != role
  expect: [{set: Role, member: Assistant, literal: assistant, line: 4, column: 1}]
- name: switch case
  language: ts
  code: |
    type Role = 'user' | 'assistant'
    const Role = { User: 'user', Assistant: 'assistant' } as const
    declare const role: Role
    switch (role) { case 'user': break }
  expect: [{set: Role, member: User, literal: user, line: 4, column: 22}]
- name: structural twin
  language: ts
  code: |
    type Role = 'user' | 'assistant'
    const Role = { User: 'user', Assistant: 'assistant' } as const
    type TypeOrigin = 'user' | 'assistant'
    declare const origin: TypeOrigin
    origin === 'user'
  expect: []
