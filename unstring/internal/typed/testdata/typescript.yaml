- name: closed value wire
  language: ts
  code: |
    type Role = 'user' | 'assistant'
    declare function closed<W extends string>(wire: W, label: string): { readonly wire: W }
    const Role = { User: closed('user', 'user'), Assistant: closed('assistant', 'assistant') } as const
    declare const role: Role
    role === 'user'
  expect: [{set: Role, member: User, literal: user, line: 5, column: 10}]
