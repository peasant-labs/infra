# closed-set-literal: a catalog member written as a literal operand of a
# comparison or as a case label, in TS and JS. Flat: the other operand's name
# is never read. Each case is a tree and the exact hit lines the generated
# rule reports after the definition-site exemption and the per-line dedupe.
# Every exclusion case uses a literal that is a catalog member, so it fails if
# the exclusion is removed or widened.
rule: closed-set-literal

cases:
  - name: flags-member-in-comparison
    files:
      src/view.ts: |
        export const GroupBy = { Project: closed("project", "project") } as const;
      src/page.tsx: |
        export const a = (groupBy: string) => groupBy === "project";
        export const b = (x: string) => "project" !== x;
        export const c = (r: { kind: string }) => r.kind == 'project';
        export const d = (x: string) => x != `project`;
    hits:
      src/page.tsx: [1, 2, 3, 4]

  - name: flags-case-label
    files:
      src/view.ts: |
        export const GroupBy = { Project: closed("project", "project") } as const;
      src/page.ts: |
        export function label(v: string) {
          switch (v) {
            case "project":
              return 1;
            case 'other':
              return 2;
          }
        }
    hits:
      src/page.ts: [3]

  - name: flags-two-matches-on-one-line-count-once
    files:
      src/view.ts: |
        export const GroupBy = { Project: closed("project", "p"), Agent: closed("agent", "a") } as const;
      src/page.ts: |
        export const both = (x: string) => x === "project" || x === "agent";
    hits:
      src/page.ts: [1]

  - name: flags-member-from-closed-call
    files:
      lib/size.mjs: |
        export const Small = closed("small", "small");
      lib/use.js: |
        export const isSmall = (s) => s === "small";
    hits:
      lib/use.js: [1]

  - name: flags-member-from-record-table
    files:
      src/labels.ts: |
        export const ToneLabel: Readonly<Record<Tone, string>> = Object.freeze({ wait: "waiting" });
      src/use.ts: |
        export const waiting = (t: string) => t === "wait";
    hits:
      src/use.ts: [1]

  - name: flags-member-from-ts-alias-union
    files:
      src/types.ts: |
        export type ReadState = 'ready' | 'failed';
      src/use.ts: |
        export const ready = (status: string) => status === "ready";
    hits:
      src/use.ts: [1]

  - name: flags-member-from-inline-property-union
    files:
      src/types.ts: |
        export interface Row { phase: 'draft' | 'final' }
      src/use.ts: |
        export const isDraft = (row: { phase: string }) => row.phase === 'draft';
    hits:
      src/use.ts: [1]

  - name: flags-member-from-jsdoc-typedef
    files:
      src/view.js: |
        /** @typedef {'list' | 'graph'} ViewMode */
      src/use.js: |
        export const isGraph = (viewMode) => viewMode !== 'list';
    hits:
      src/use.js: [1]

  - name: flags-member-from-schema-go-constant
    schema: { module: example.test/schema, version: v0.0.1, tree: schema-module }
    files:
      package.json: |
        { "dependencies": { "@peasant-labs/schema": "0.0.1" } }
      src/use.ts: |
        export const isPublic = (want: string) => want === "public";
    hits:
      src/use.ts: [1]

  - name: flags-member-from-schema-generated-ts
    schema: { module: example.test/schema, version: v0.0.1, tree: schema-module }
    files:
      package.json: |
        { "dependencies": { "@peasant-labs/schema": "0.0.1" } }
      src/use.ts: |
        export const queued = (s: string) => s === "queued";
    hits:
      src/use.ts: [1]

  - name: flags-comparison-in-the-union-file
    files:
      src/state.ts: |
        type ReadState = 'ready' | 'error';
        export const failed = (status: ReadState) => status === "error";
    hits:
      src/state.ts: [2]

  - name: passes-in-closed-definition-file
    files:
      src/view.ts: |
        export const GroupBy = { Project: closed("project", "project") } as const;
        export const parse = (raw: string) => raw === "project" ? GroupBy.Project : null;
    hits: {}

  - name: passes-in-record-table-definition-file
    files:
      src/labels.ts: |
        export const ToneLabel: Record<Tone, string> = Object.freeze({ wait: "waiting" });
        export const isWait = (raw: string) => raw === "wait";
    hits: {}

