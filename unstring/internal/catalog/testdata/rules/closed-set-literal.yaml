      src/view.ts: |
        export const GroupBy = { Project: closed("project", "project") } as const;
        export const isOpen = (raw: string) => raw === "open";
      src/defs.ts: |
        export type S = 'open' | 'error';
    hits:
      src/view.ts: [2]

  - name: passes-word-no-set-declares
    files:
