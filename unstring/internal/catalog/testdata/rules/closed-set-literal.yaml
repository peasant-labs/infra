  - name: passes-lone-literal-type-is-not-a-source
    files:
      src/types.ts: |
        export type Profile = { kind: 'profile' };
      src/use.ts: |
        export const isProfile = (x: { kind: string }) => x.kind === 'profile';
    hits: {}

  - name: passes-member-outside-comparison
    files:
      src/defs.ts: |
        export type S = 'open' | 'error';
      src/use.ts: |
        export const v = "open";
        send("open");
        export const t = `${v}open`;
        export const lt = (x: string) => x < "open";
    hits: {}

  - name: passes-excluded-typeof-comparison
    files:
      src/defs.ts: |
        export type S = 'open' | 'error';
      src/case.ts: |
        export async function f(v: unknown, e: any, el: any, loc: any, event: any, ev: any, evt: any, row: any, message: any) {
          typeof v === 'error';
        }
    hits: {}

