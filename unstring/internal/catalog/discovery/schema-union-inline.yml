# A string member of an unnamed union in the schema module's generated TS: an
# interface or object-type property, a parameter, a nested union. Unlike
# union-inline.yml it skips a union that is a type argument (Omit<S, "a" | "b">,
# Pick<…>, Array<…>) or the index of an indexed access type (S["a" | "b"]).
# Such a union is type manipulation, not a vocabulary: it has no name, so no
# same-named const table can own it, which is what the TypeScript typed rule
# requires of a set. A named alias used in those positions is still found by
# union-alias.yml.
id: unstring-discover-schema-union-inline
language: tsx
severity: hint
message: string member of an inline literal union in the schema module
utils:
  union-chain:
    any: [{ kind: union_type }, { kind: parenthesized_type }]
rule:
  kind: string
  inside:
    kind: literal_type
    all:
      - inside:
          stopBy: { not: { matches: union-chain } }
          kind: union_type
      - not:
          inside:
            stopBy: { not: { matches: union-chain } }
            kind: type_alias_declaration
      - not:
          inside:
            stopBy: { not: { matches: union-chain } }
            any: [{ kind: type_arguments }, { kind: lookup_type }]
