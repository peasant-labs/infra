# Runtime members of the generated schema package's closed sets. SET and NAME
# are captured from the actual exported object, not guessed from a Go constant.
# Bare literals are accepted because the scanned generated enums.gen.ts contains
# only closed-set tables; other exported string tables there would require
# tightening this rule.
id: unstring-discover-schema-export
language: tsx
severity: hint
message: exported schema member
rule:
  kind: string
  any:
    - inside: { matches: exported-member }
    - nthChild: 1
      inside:
        kind: arguments
        inside:
          kind: call_expression
          has: { field: function, pattern: '$VALIDATOR.parse' }
          inside: { matches: exported-member }
utils:
  exported-member:
    kind: pair
    has: { field: key, kind: property_identifier, pattern: '$NAME' }
    inside:
      kind: object
      inside:
        kind: as_expression
        inside:
          kind: arguments
          inside:
            kind: call_expression
            has: { field: function, pattern: 'Object.freeze' }
            inside:
              kind: variable_declarator
              has: { field: name, kind: identifier, pattern: '$SET' }
              inside:
                kind: lexical_declaration
                inside: { kind: export_statement }
