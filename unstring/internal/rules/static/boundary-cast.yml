# Rule 8: `as X` applied directly to a value read across a trust boundary.
id: boundary-cast
language: tsx
severity: warning
message: a type assertion is applied directly to a value read across a boundary.
metadata:
  why: >-
    the value comes from outside the program (parsed JSON, a response or form body, a URL or
    route parameter, browser storage), so `as` tells the type checker a shape nothing has
    checked; a changed payload then fails far from where it entered.
  fix: >-
    parse the value at the boundary: read it as unknown and narrow it with the closed set's
    parser or the contract type's validator, then use the parsed value. `as const` and
    `as unknown` are not flagged. The rule accepts an unstring-allow marker with a reason.
utils:
  boundary-call:
    kind: call_expression
    any:
      - has: { field: function, regex: '^JSON\.parse$' }
      - has: { field: function, kind: member_expression, has: { field: property, regex: '^(json|formData)$' } }
      - has: { field: function, regex: '(^|\.)(searchParams|params|query|localStorage|sessionStorage)\.(get|getAll|getItem)$' }
      - has: { field: function, regex: '^(useParams|useSearchParams)$' }
  boundary-value:
    any:
      - matches: boundary-call
      - kind: await_expression
        has: { matches: boundary-call }
      - kind: parenthesized_expression
        has:
          any:
            - matches: boundary-call
            - kind: await_expression
              has: { matches: boundary-call }
rule:
  kind: as_expression
  all:
    - has: { nthChild: 1, matches: boundary-value }
    - not: { regex: '\bas\s+(const|unknown)\s*$' }
