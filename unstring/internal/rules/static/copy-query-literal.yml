# Rule 5: literal copy in a text, label or role-name query.
id: copy-query-literal
language: tsx
severity: warning
message: a text, label or role-name query is called with literal copy.
metadata:
  why: >-
    the literal repeats copy the component renders; a copy change makes the query match
    nothing, and the type checker cannot connect the test to the text it looks for.
  fix: >-
    for app copy, query with the member of the label set exported next to the component that
    renders it (for example getByRole("button", { name: DeleteCollectiveLabels.Trigger }));
    a regex query becomes that member with a non-exact match option. For fixture content,
    query with the field of the fixture object the test rendered. The role itself stays a
    literal. The rule accepts an unstring-allow marker with a reason.
utils:
  copy-literal:
    any:
      - kind: string
      - kind: template_string
        not: { has: { kind: template_substitution } }
      - kind: regex
rule:
  any:
    - kind: call_expression
      all:
        - has:
            field: function
            regex: '(^|\.)((get|getAll|find|findAll|query|queryAll)By(Text|LabelText|PlaceholderText|AltText|Title|DisplayValue)|getBy(Label|Placeholder))$'
        - has: { field: arguments, has: { nthChild: 1, matches: copy-literal } }
    - kind: call_expression
      all:
        - has: { field: function, regex: '(^|\.)(get|getAll|find|findAll|query|queryAll)ByRole$' }
        - has:
            field: arguments
            has:
              kind: object
              has:
                kind: pair
                all:
                  - has: { field: key, regex: '^[''"]?(name|description)[''"]?$' }
                  - has: { field: value, matches: copy-literal }
