# Rule 2: a test-id query (Testing Library or Playwright) called with a literal.
id: testid-query-literal
language: tsx
severity: warning
message: a test-id query is called with a string literal.
metadata:
  why: >-
    the literal repeats an id the component renders; when the component's id changes, the
    query matches nothing and the type checker cannot see it.
  fix: >-
    import the component's typed test-id set and pass its member (for example
    getByTestId(HomeTestId.Row.wire)). The rule accepts an unstring-allow marker with a reason.
rule:
  kind: call_expression
  all:
    - has:
        field: function
        regex: '(^|\.)(get|getAll|find|findAll|query|queryAll)ByTestId$'
    - has:
        field: arguments
        has:
          nthChild: 1
          any:
            - kind: string
            - kind: template_string
              not: { has: { kind: template_substitution } }
