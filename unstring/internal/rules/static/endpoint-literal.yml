# Rule 12: an API path written as a literal (TS and JS). Rendered with the
# repository's endpoint prefixes and client callees.
id: endpoint-literal
language: tsx
severity: warning
message: an API endpoint path is written as a literal.
metadata:
  why: >-
    the path restates a route the schema contract declares; when the route changes, this
    copy keeps calling the old path and only a runtime 404 shows it.
  fix: >-
    build the path from the route member in @peasant-labs/schema (for example
    VillageRoute.GetPullRequestAttachment.path({ owner, name, number })), and take the method
    from the same member. If the pinned schema has no route members yet, re-pin to the release
    that has them. The rule accepts an unstring-allow marker with a reason.
utils:
  text-literal:
    any: [{ kind: string }, { kind: template_string }]
rule:
  matches: text-literal
  any:
    - all:
        - regex: '^[`"'']([A-Z]+ )?(\$\{[^}]*\}|https?://[^/`"'']+)?{{ .PrefixRegex }}(/|[`"''?#]|$)'
        - not:
            inside:
              any:
                - kind: import_statement
                - kind: export_statement
                  has: { field: source, kind: string }
{{- if .CalleeRegex }}
    - all:
        - regex: '^[`"'']/'
        - nthChild: 1
        - inside:
            kind: arguments
            inside:
              kind: call_expression
              has: { field: function, regex: '{{ .CalleeRegex }}' }
{{- end }}
