name: Runner VM network diagnosis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, linux, x64, microvm]
    timeout-minutes: 12
    steps:
      - name: Debug daemon and manual enslave test
        continue-on-error: true
        run: |
          podman run --rm --privileged --network=host --pid=host docker.io/library/alpine:3.20 sh -ec '
            apk add -q iproute2
            echo "== manual bridge + veth + enslave"
            nsenter -t 1 -n ip link add br-manual type bridge
            nsenter -t 1 -n ip link set br-manual up
            nsenter -t 1 -n ip link add veth-manual type veth peer name vpeer-manual
            if nsenter -t 1 -n ip link set veth-manual master br-manual; then echo "manual enslave OK"; else echo "manual enslave FAILED"; fi
            nsenter -t 1 -n ip link del veth-manual
            nsenter -t 1 -n ip link del br-manual
            echo "== starting debug daemon"
            nsenter -t 1 -m -u -i -p -- sh -c "setsid /run/current-system/sw/bin/podman system service --log-level=debug --timeout 300 unix:///var/lib/containers/runner/podman-dbg.sock > /var/lib/containers/runner/podman-dbg.log 2>&1 < /dev/null &"
            sleep 4
            ls -l /var/lib/containers/runner/podman-dbg.sock || echo "socket missing"
          '

      - name: Container through the debug daemon
        continue-on-error: true
        run: |
          export CONTAINER_HOST=unix:///var/lib/containers/runner/podman-dbg.sock
          podman network create dbg-net
          podman run -d --name dbg-db --network dbg-net --network-alias db -e POSTGRES_PASSWORD=probe docker.io/library/postgres:16-alpine
          sleep 6
          echo "== netavark debug lines"
          grep -iE 'netavark|veth|bridge|master|error|warn' /var/lib/containers/runner/podman-dbg.log | tail -60
          echo "== bridge state again"
          podman run --rm --privileged --network=host --pid=host docker.io/library/alpine:3.20 sh -ec '
            apk add -q iproute2
            nsenter -t 1 -n ip -br link | grep -E "podman|veth" || echo "no podman/veth links"
            nsenter -t 1 -n ip -d link show | grep -B1 -A1 "master" | head -10
          '

      - name: Clean up
        if: always()
        run: |
          podman rm -f dbg-db 2>&1
          podman network rm dbg-net 2>&1
          podman run --rm --privileged --network=host --pid=host docker.io/library/alpine:3.20 sh -ec '
            pkill -f podman-dbg.sock || true
            rm -f /var/lib/containers/runner/podman-dbg.sock /var/lib/containers/runner/podman-dbg.log
          ' 2>/dev/null
          true
