name: Runner VM network diagnosis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, linux, x64, microvm]
    timeout-minutes: 15
    steps:
      - name: Persistence with timestamps and journal
        continue-on-error: true
        run: |
          podman run --rm --privileged --network=host --pid=host docker.io/library/alpine:3.20 sh -ec '
            apk add -q iproute2
            printf "%s\n" \
              "#!/bin/sh" \
              "ip -ts monitor link > /mon.log 2>&1 &" \
              "monpid=\$!" \
              "ip link add br-p type bridge" \
              "ip link set br-p up" \
              "ip link add master br-p type veth peer name pv0" \
              "echo created; date +%s" \
              "sleep 18" \
              "echo after18; date +%s" \
              "ip -d link show | grep -E \"master br-p|veth0|pv0\" || echo none" \
              "kill \$monpid" \
              "echo == monitor" \
              "cat /mon.log" > /t.sh
            nsenter -t 1 -n sh /t.sh
          '
          echo "== guest journal, last 2 minutes"
          podman run --rm --privileged --network=host --pid=host docker.io/library/alpine:3.20 sh -ec '
            apk add -q util-linux
            nsenter -t 1 -m -u -i -p -- /run/current-system/sw/bin/journalctl -b --no-pager -o short-precise -S "-2 min" 2>&1 | grep -viE "chronyd|dhcp|python" | tail -100
          '

      - name: Clean up
        if: always()
        run: |
          true
