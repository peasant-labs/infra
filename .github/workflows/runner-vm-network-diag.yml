name: Runner VM network diagnosis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, linux, x64, microvm]
    timeout-minutes: 12
    steps:
      - name: Host namespace inspection from a privileged container
        continue-on-error: true
        run: |
          podman run --rm --privileged --network=host --pid=host docker.io/library/alpine:3.20 sh -ec '
            apk add -q iproute2 nftables kmod
            echo "== kernel.modprobe: $(cat /proc/sys/kernel/modprobe)"
            echo "== loaded bridge/veth/kmod"
            awk "{print \$1}" /proc/modules | grep -E "^(bridge|veth)$" || echo "bridge/veth NOT loaded"
            echo "== guest links"
            nsenter -t 1 -n ip -br link
            echo "== guest addrs"
            nsenter -t 1 -n ip -br addr | head -20
            echo "== can we create a bridge?"
            if nsenter -t 1 -n ip link add name diagtest0 type bridge 2>&1; then
              echo "bridge creation OK"
              nsenter -t 1 -n ip link del diagtest0
            else
              echo "bridge creation FAILED"
            fi
            echo "== nat rules"
            nsenter -t 1 -n nft list ruleset 2>&1 | head -80
            echo "== dmesg tail"
            dmesg 2>/dev/null | tail -15 || echo "dmesg unavailable"
          '

      - name: Container setup with observable failure
        continue-on-error: true
        run: |
          podman network create diag-net 2>&1
          podman run -d --name diag-db --network diag-net --network-alias db -e POSTGRES_PASSWORD=probe docker.io/library/postgres:16-alpine; echo "run exit=$?"
          sleep 8
          podman inspect diag-db --format '{{json .NetworkSettings.Networks}}' | head -c 400; echo
          podman run --rm --privileged --network=host --pid=host docker.io/library/alpine:3.20 sh -ec '
            apk add -q iproute2
            echo "== guest links after container start"
            nsenter -t 1 -n ip -br link
            echo "== guest addrs after container start"
            nsenter -t 1 -n ip -br addr | grep -E "10.89|podman|veth|br-" || true
          '

      - name: Clean up
        if: always()
        run: |
          podman rm -f diag-db 2>&1
          podman network rm diag-net 2>&1
          true
