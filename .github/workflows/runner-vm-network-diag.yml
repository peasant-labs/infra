name: Runner VM network diagnosis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, linux, x64, microvm]
    timeout-minutes: 12
    steps:
      - name: Container start with netavark debug
        continue-on-error: true
        run: |
          podman network create diag-net
          podman run -d --name diag-db --network diag-net --network-alias db -e POSTGRES_PASSWORD=probe docker.io/library/postgres:16-alpine
          sleep 5
          echo "== bridge and ports"
          podman run --rm --privileged --network=host --pid=host docker.io/library/alpine:3.20 sh -ec '
            apk add -q iproute2 bridge nftables
            nsenter -t 1 -n ip -d link show podman1 2>&1 | head -12
            echo "--- ports on bridges"
            nsenter -t 1 -n bridge -c link show 2>&1 | head -10
            echo "--- veth detail"
            nsenter -t 1 -n ip -d link show 2>&1 | grep -A3 -E "veth" | head -20
            echo "--- container eth0 via its netns"
            cpid=$(nsenter -t 1 -p -- pgrep -f "postgres" | head -1)
            echo "container pid guess: $cpid"
            nsenter -t 1 -n nft list ruleset 2>&1 | grep -B1 -A20 "table ip nat" | head -45
          '
          echo "== debug run of a second container"
          podman --log-level=debug run --rm --name diag-dbg --network diag-net docker.io/library/alpine:3.20 true 2>&1 | grep -iE 'netavark|veth|bridge|failed|error|warning' | head -30
          echo "== podman journal"
          podman run --rm --privileged --network=host --pid=host docker.io/library/alpine:3.20 sh -ec '
            nsenter -t 1 -m -u -i -p -- /run/current-system/sw/bin/journalctl -u podman --no-pager -n 40 2>&1 | tail -40
          '

      - name: Clean up
        if: always()
        run: |
          podman rm -f diag-db diag-dbg 2>&1
          podman network rm diag-net 2>&1
          true
