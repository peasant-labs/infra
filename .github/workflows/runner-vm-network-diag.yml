name: Runner VM network diagnosis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, linux, x64, microvm]
    timeout-minutes: 15
    steps:
      - name: Debug daemon under strace
        continue-on-error: true
        run: |
          podman run --rm --privileged --network=host --pid=host docker.io/library/alpine:3.20 sh -ec '
            apk add -q strace
            mkdir -p /var/lib/containers/runner/dbgroot /var/lib/containers/runner/dbgrun
            nsenter -t 1 -m -u -i -p -- /run/current-system/sw/bin/systemd-run --collect --unit=podman-dbg \
              --property=StandardOutput=file:/var/lib/containers/runner/dbg.log \
              --property=StandardError=file:/var/lib/containers/runner/dbg.log \
              /run/current-system/sw/bin/strace -f -e trace=sendmsg -o /var/lib/containers/runner/nav.strace -xx -s 400 \
              /run/current-system/sw/bin/podman --log-level=debug \
              --root /var/lib/containers/runner/dbgroot --runroot /var/lib/containers/runner/dbgrun \
              system service --timeout 240 unix:///var/lib/containers/runner/dbg.sock
            sleep 6
            if [ -S /var/lib/containers/runner/dbg.sock ]; then echo "socket up"; else echo "socket MISSING"; tail -20 /var/lib/containers/runner/dbg.log; fi
          '

      - name: Create a container and read the trace
        continue-on-error: true
        run: |
          export CONTAINER_HOST=unix:///var/lib/containers/runner/dbg.sock
          podman network create dbg3-net 2>&1
          podman run -d --name dbg3-a --network dbg3-net docker.io/library/alpine:3.20 sleep 180 2>&1
          sleep 6
          echo "== RTM_NEWLINK messages"
          grep -n 'RTM_NEWLINK' /var/lib/containers/runner/nav.strace | sed -E 's/^([0-9]+:[0-9]+ )/\1/' | cut -c1-600
          echo "== IFLA_MASTER occurrences"
          grep -c 'IFLA_MASTER' /var/lib/containers/runner/nav.strace
          echo "== links"
          podman run --rm --privileged --network=host --pid=host docker.io/library/alpine:3.20 sh -ec '
            apk add -q iproute2
            nsenter -t 1 -n ip -d link show 2>&1 | grep -E "master|veth" | head -6
          '

      - name: Clean up
        if: always()
        run: |
          CONTAINER_HOST=unix:///var/lib/containers/runner/dbg.sock podman rm -f dbg3-a 2>/dev/null
          CONTAINER_HOST=unix:///var/lib/containers/runner/dbg.sock podman network rm dbg3-net 2>/dev/null
          podman run --rm --privileged --network=host --pid=host docker.io/library/alpine:3.20 sh -ec '
            nsenter -t 1 -m -u -i -p -- /run/current-system/sw/bin/systemctl stop podman-dbg 2>/dev/null || true
            rm -rf /var/lib/containers/runner/dbg.sock /var/lib/containers/runner/dbg.log /var/lib/containers/runner/nav.strace /var/lib/containers/runner/dbgroot /var/lib/containers/runner/dbgrun
          ' 2>/dev/null
          true
