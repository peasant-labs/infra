name: Runner VM network diagnosis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, linux, x64, microvm]
    timeout-minutes: 15
    steps:
      - name: Start debug daemon
        continue-on-error: true
        run: |
          podman run --rm --privileged --network=host --pid=host docker.io/library/alpine:3.20 sh -ec '
            mkdir -p /out/dbgroot /out/dbgrun
            nsenter -t 1 -m -u -i -p -- /run/current-system/sw/bin/systemd-run --collect --unit=podman-dbg \
              --property=StandardOutput=file:/var/lib/containers/runner/dbg.log \
              --property=StandardError=file:/var/lib/containers/runner/dbg.log \
              /run/current-system/sw/bin/podman --log-level=debug \
              --root /var/lib/containers/runner/dbgroot --runroot /var/lib/containers/runner/dbgrun \
              system service --timeout 240 unix:///var/lib/containers/runner/dbg.sock
          ' 2>/dev/null || true
          podman run --rm -v /var/lib/containers/runner:/out docker.io/library/alpine:3.20 sh -c 'ls -l /out/dbg.sock 2>/dev/null || echo "socket not visible"'
          ls -l /var/lib/containers/runner/dbg.sock 2>/dev/null || echo "runner-side socket missing"

      - name: Strace attach and create
        continue-on-error: true
        run: |
          podman run -d --rm --name tracer --privileged --network=host --pid=host -v /var/lib/containers/runner:/out docker.io/library/alpine:3.20 sh -c '
            apk add -q strace
            pid=$(pgrep -f "system servic[e]" | head -1)
            echo "tracing pid $pid" > /out/tracer.log
            exec strace -f -e trace=sendmsg -o /out/nav.strace -xx -s 400 -p "$pid"
          '
          sleep 8
          podman logs tracer 2>&1 | tail -3
          export CONTAINER_HOST=unix:///var/lib/containers/runner/dbg.sock
          podman network create dbg5-net 2>&1
          podman run -d --name dbg5-a --network dbg5-net docker.io/library/alpine:3.20 sleep 180 2>&1
          sleep 6
          podman rm -f tracer >/dev/null 2>&1
          echo "== trace file"
          ls -l /var/lib/containers/runner/nav.strace 2>&1
          echo "== RTM_NEWLINK messages from netavark"
          grep 'RTM_NEWLINK' /var/lib/containers/runner/nav.strace 2>/dev/null | sed -E 's/^[0-9]+ +//' | cut -c1-500 | head -20
          echo "== IFLA_MASTER count"
          grep -c 'IFLA_MASTER' /var/lib/containers/runner/nav.strace 2>/dev/null || echo 0

      - name: Clean up
        if: always()
        run: |
          CONTAINER_HOST=unix:///var/lib/containers/runner/dbg.sock podman rm -f dbg5-a 2>/dev/null
          CONTAINER_HOST=unix:///var/lib/containers/runner/dbg.sock podman network rm dbg5-net 2>/dev/null
          podman rm -f tracer >/dev/null 2>&1
          podman run --rm --privileged --network=host --pid=host docker.io/library/alpine:3.20 sh -ec '
            nsenter -t 1 -m -u -i -p -- /run/current-system/sw/bin/systemctl stop podman-dbg 2>/dev/null || true
          ' 2>/dev/null
          true
