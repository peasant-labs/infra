name: Runner VM network diagnosis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, linux, x64, microvm]
    timeout-minutes: 10
    steps:
      - name: Identity
        run: echo "runner=${RUNNER_NAME} host=$(uname -n) kernel=$(uname -r)"

      - name: Modules loaded
        continue-on-error: true
        run: |
          awk '{print $1}' /proc/modules | grep -E '^(nf_tables|nft_|nf_nat|nf_conntrack)' | sort
          echo "ip_forward=$(cat /proc/sys/net/ipv4/ip_forward)"

      - name: Forward sysctl and firewall
        continue-on-error: true
        run: |
          sysctl net.ipv4.ip_forward net.ipv4.conf.all.forwarding 2>/dev/null
          echo "== host firewall"
          (nft list tables 2>&1 || true) | head
          (iptables -S 2>&1 || true) | head -20
          echo "== forwarding policy"
          (nft list chain inet firewalld filter_FORWARD 2>&1 || true) | head
          (nft list chain inet nixos-fw filter 2>&1 || true) | head -10

      - name: Podman and netavark
        continue-on-error: true
        run: |
          podman version --format 'server={{.Server.Version}}'
          podman info --format 'backend={{.Host.NetworkBackend}}' 2>&1
          podman network ls

      - name: Inter-container and egress
        continue-on-error: true
        run: |
          podman network create diag-net 2>&1
          podman run -d --name diag-db --network diag-net --network-alias db -e POSTGRES_PASSWORD=probe docker.io/library/postgres:16-alpine
          sleep 10
          echo "== container addresses"
          podman inspect diag-db --format '{{.NetworkSettings.Networks}}'
          echo "== DNS and egress from a bridge container"
          podman run --rm --network diag-net docker.io/library/alpine:3.20 sh -c '
            cat /etc/resolv.conf
            if (echo > /dev/tcp/1.1.1.1/443) 2>/dev/null; then echo ip-egress-ok; else echo ip-egress-FAIL; fi
            if (echo > /dev/tcp/api.github.com/443) 2>/dev/null; then echo dns-egress-ok; else echo dns-egress-FAIL; fi' 2>&1
          echo "== db reachable from a bridge container"
          podman run --rm --network diag-net docker.io/library/alpine:3.20 sh -c '
            if (echo > /dev/tcp/db/5432) 2>/dev/null; then echo db-reachable; else echo db-UNREACHABLE; fi' 2>&1

      - name: Published port
        continue-on-error: true
        run: |
          podman run -d --name diag-pub --network diag-net -p 5433:5432 -e POSTGRES_PASSWORD=probe docker.io/library/postgres:16-alpine
          sleep 10
          ss -ltn | grep 5433 || echo "nothing listening on 5433"
          echo "== from host netns"
          podman run --rm --network=host docker.io/library/alpine:3.20 sh -c '
            if nc -z -w 3 127.0.0.1 5433; then echo loopback-ok; else echo loopback-FAIL; fi' 2>&1
          guest_ip=$(ip -4 route get 1.1.1.1 | grep -oP "src \K[0-9.]+")
          podman run --rm --network=host docker.io/library/alpine:3.20 sh -c "if nc -z -w 3 ${guest_ip} 5433; then echo guestip-ok; else echo guestip-FAIL; fi" 2>&1

      - name: nft ruleset
        continue-on-error: true
        run: |
          (nft list ruleset 2>&1 || true) | grep -vE '^\s*$' | head -120

      - name: Clean up
        if: always()
        run: |
          podman rm -f diag-db diag-pub 2>/dev/null
          podman network rm diag-net 2>/dev/null
          true
