name: Runner VM network diagnosis

# Dispatch-only diagnostics for container networking inside a VM slot:
# kernel netfilter modules, podman's network backend, nftables state, egress,
# inter-container DNS, and published-port reachability. Scratch branch; delete
# after the findings become a fix.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, linux, x64, microvm]
    timeout-minutes: 10
    steps:
      - name: Identity
        run: echo "runner=${RUNNER_NAME} host=$(uname -n) kernel=$(uname -r) uid=$(id -u)"

      - name: Kernel netfilter state
        continue-on-error: true
        run: |
          echo "== modules present in the guest closure"
          for f in /run/current-system/kernel-modules/lib/modules/*/kernel/net/netfilter/nft_* /run/current-system/kernel-modules/lib/modules/*/kernel/net/netfilter/nf_tables*; do
            [ -e "$f" ] && basename "$f"
          done | sort | head -30
          echo "== modprobe nft_nat"
          if modprobe nft_nat; then echo "modprobe ok"; else echo "modprobe FAILED: $?"; fi
          if grep -q '^nf_tables ' /proc/modules; then echo "nf_tables loaded"; else echo "nf_tables NOT loaded"; fi
          echo "== loaded netfilter modules"
          awk '{print $1}' /proc/modules | grep -E '^(nf_tables|nft_|nf_nat|nf_conntrack)' | sort | head -20
          echo "== forward sysctls"
          cat /proc/sys/net/ipv4/ip_forward /proc/sys/net/ipv4/conf/all/forwarding 2>/dev/null

      - name: Podman network backend
        continue-on-error: true
        run: |
          podman version --format 'server={{.Server.Version}}'
          grep -rE 'firewall_backend|network_backend|dns_enabled' /etc/containers/containers.conf /etc/containers/containers.conf.d/ 2>/dev/null | head
          podman info --format 'backend={{.Host.NetworkBackend}}' 2>&1
          grep -i firewall /etc/containers/containers.conf 2>/dev/null || echo "no containers.conf firewall setting"
          podman network ls

      - name: Inter-container connectivity
        continue-on-error: true
        run: |
          podman network create diag-net
          podman run -d --name diag-db --network diag-net --network-alias db -e POSTGRES_PASSWORD=probe docker.io/library/postgres:16-alpine
          sleep 8
          echo "== DNS: service name and public name, from a bridge-network container"
          podman run --rm --network diag-net docker.io/library/alpine:3.20 sh -c '
            getent hosts db || echo "dns db FAILED"
            getent hosts api.github.com || echo "dns api.github.com FAILED"'
          echo "== container to container over the bridge"
          podman run --rm --network diag-net docker.io/library/alpine:3.20 sh -c '
            (echo > /dev/tcp/db/5432) 2>/dev/null && echo db-reachable || echo db-UNREACHABLE'
          echo "== egress by IP and by name"
          podman run --rm --network diag-net docker.io/library/alpine:3.20 sh -c '
            if (echo > /dev/tcp/1.1.1.1/443) 2>/dev/null; then echo ip-egress-ok; else echo ip-egress-FAIL; fi
            if (echo > /dev/tcp/api.github.com/443) 2>/dev/null; then echo dns-egress-ok; else echo dns-egress-FAIL; fi'

      - name: Published-port reachability
        continue-on-error: true
        run: |
          podman run -d --name diag-pub --network diag-net -p 5433:5432 -e POSTGRES_PASSWORD=probe docker.io/library/postgres:16-alpine
          sleep 8
          ss -ltn | grep 5433 || echo "nothing listening on 5433"
          guest_ip=$(ip -4 route get 1.1.1.1 | grep -oP 'src \K[0-9.]+')
          echo "guest ip $guest_ip"
          podman run --rm --network=host docker.io/library/alpine:3.20 sh -c 'nc -z -w 3 127.0.0.1 5433 && echo loopback-ok || echo loopback-FAIL'
          podman run --rm --network=host docker.io/library/alpine:3.20 sh -c "nc -z -w 3 ${guest_ip} 5433 && echo guestip-ok || echo guestip-FAIL"

      - name: nftables state
        continue-on-error: true
        run: |
          if command -v sudo >/dev/null; then sudo nft list ruleset; else nft list ruleset; fi 2>&1 | head -100
          echo "== routes"
          ip route

      - name: Clean up
        if: always()
        run: |
          podman rm -f diag-db diag-pub
          podman network rm diag-net
