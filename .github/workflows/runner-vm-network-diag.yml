name: Runner VM network diagnosis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, linux, x64, microvm]
    timeout-minutes: 15
    steps:
      - name: Unnamed veth with master at create
        continue-on-error: true
        run: |
          podman run --rm --privileged --network=host --pid=host docker.io/library/alpine:3.20 sh -ec '
            apk add -q iproute2
            nsenter -t 1 -n ip link add br-t0 type bridge
            nsenter -t 1 -n ip link set br-t0 up
            nsenter -t 1 -n ip netns add manualns
            echo "== unnamed host end, peer in netns, master at create"
            if nsenter -t 1 -n ip link add master br-t0 type veth peer name tvc netns manualns 2>/tmp/opencode/err; then echo "create ok"; else echo "create FAILED: $(cat /tmp/opencode/err)"; fi
            nsenter -t 1 -n ip -d link show 2>&1 | grep -E "master|veth" | head -6
            nsenter -t 1 -n ip link del br-t0 2>/dev/null || true
            nsenter -t 1 -n ip netns del manualns 2>/dev/null || true
          '

      - name: Manual attach of netavark veth
        continue-on-error: true
        run: |
          podman network create fix-net 2>&1
          podman run -d --name fx1 --network fix-net --network-alias db -e POSTGRES_PASSWORD=probe docker.io/library/postgres:16-alpine 2>&1
          sleep 8
          bridge=$(podman network inspect fix-net --format '{{.network_interface}}')
          echo "bridge=$bridge"
          podman run --rm --privileged --network=host --pid=host docker.io/library/alpine:3.20 sh -ec "
            apk add -q iproute2
            echo '== before attach'
            nsenter -t 1 -n ip -d link show 2>&1 | grep -E 'veth' | head -5
            veth=\$(nsenter -t 1 -n ip -br link | awk '\$3==\"UP\" && \$1 ~ /^veth/ {print \$1}' | head -1)
            echo \"attaching \$veth to $bridge\"
            nsenter -t 1 -n ip link set \$veth master $bridge
            nsenter -t 1 -n ip -br link | grep -E 'podman|veth'
          "
          echo "== connectivity after manual attach"
          podman run --rm --network fix-net docker.io/library/alpine:3.20 sh -c 'if nc -z -w 3 db 5432; then echo db-reachable; else echo db-UNREACHABLE; fi'
          podman run -d --name fx2 --network fix-net docker.io/library/alpine:3.20 sleep 120
          sleep 3
          podman exec fx2 sh -c 'if nc -z -w 3 1.1.1.1 443; then echo ip-egress-ok; else echo ip-egress-FAIL; fi'

      - name: Clean up
        if: always()
        run: |
          podman rm -f fx1 fx2 2>/dev/null
          podman network rm fix-net 2>/dev/null
          true
