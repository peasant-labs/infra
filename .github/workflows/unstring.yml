name: unstring

# The unstring guard's own tests: the rule fixtures and the end-to-end
# mutations run the real ast-grep, pinned to the exact version the tool
# requires, so the job installs it before go test. Hosted runner on purpose,
# as for the dispatcher: the tool's tests must not need the pool.

on:
  pull_request:
    paths:
      - "unstring/**"
      - ".github/workflows/unstring.yml"
  push:
    branches:
      - main
    paths:
      - "unstring/**"
      - ".github/workflows/unstring.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: unstring
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: unstring/go.mod
          cache-dependency-path: unstring/go.sum

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4

      # The exact version unstring asserts (astgrep.RequiredVersion). The tests
      # fail, never skip, without it.
      - name: Install ast-grep
        run: |
          npm install --global @ast-grep/cli@0.51.2
          ast-grep --version

      - name: Formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...
