name: Runner routing probe

# Diagnostic: runs the same routing block that every routed workflow uses, then
# reports the machine it selected. Dispatch it once with the runner pool online
# and once with the pool stopped to prove both branches.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  determine-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - name: Pick a runner
        id: pick
        env:
          GH_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
        run: |
          set -euo pipefail
          if ! online=$(gh api /orgs/peasant-labs/actions/runners --paginate \
              --jq '.runners[] | select(.status == "online") | select(any(.labels[]; .name == "container")) | .name' 2>/dev/null | wc -l); then
            echo "::warning::runner availability query failed; using the fallback"
            online=0
          fi
          echo "online runners: ${online}"
          if [ "${online}" -gt 0 ]; then
            echo 'runner=["self-hosted","container"]' >> "$GITHUB_OUTPUT"
          else
            echo 'runner=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          fi
      - name: Report chosen runner
        env:
          CHOSEN: ${{ steps.pick.outputs.runner }}
        run: 'echo "chosen: $CHOSEN"'

  probe:
    name: Probe
    needs: determine-runner
    runs-on: ${{ fromJson(needs.determine-runner.outputs.runner) }}
    timeout-minutes: 5
    steps:
      - name: Report the machine
        run: |
          echo "runner: ${{ needs.determine-runner.outputs.runner }}"
          uname -m
          hostname
          if [ -e /run/current-system ]; then echo nixos; else echo ubuntu; fi
