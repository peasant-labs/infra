name: Terraform checks

on:
  pull_request:
    paths:
      - ".github/dependabot.yml"
      - ".github/workflows/**"
      - ".terraform-version"
      - "Makefile"
      - "README.md"
      - "docs/**"
      - "modules/**"
      - "scripts/**"
      - "stacks/**"
  push:
    branches:
      - main
    paths:
      - ".github/dependabot.yml"
      - ".github/workflows/**"
      - ".terraform-version"
      - "Makefile"
      - "modules/**"
      - "scripts/**"
      - "stacks/**"

permissions:
  contents: read

jobs:
  determine-runner:
    uses: peasant-labs/infra/.github/workflows/runner-router.yml@runner-router-v1
    with:
      fallback: '["ubuntu-24.04"]'
    secrets:
      RUNNER_STATUS_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}

  validate:
    name: Validate ${{ matrix.stack }}
    needs: determine-runner
    runs-on: ${{ fromJson(needs.determine-runner.outputs.runner) }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        stack:
          - village-production
          - pkgs-production
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check production destruction guards
        run: bash scripts/check-production-guards.sh

      # hashicorp/setup-terraform extracts the CLI through @actions/tool-cache,
      # which shells out to `unzip` on Linux. The GitHub-hosted fallback ships
      # unzip; the pool image does not, though its apt sources still reach the
      # pinned snapshot. Guarded so the hosted path pays nothing.
      - name: Ensure unzip is present
        run: |
          set -euo pipefail
          if command -v unzip >/dev/null 2>&1; then
            echo "unzip already present"
            exit 0
          fi
          if [ "$(id -u)" -eq 0 ]; then apt="apt-get"; else apt="sudo apt-get"; fi
          $apt update -qq
          $apt install -y -qq --no-install-recommends unzip
          unzip -v | head -1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: v1.16.4
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize without remote state
        run: terraform -chdir="stacks/${{ matrix.stack }}" init -backend=false -lockfile=readonly

      - name: Validate configuration
        run: terraform -chdir="stacks/${{ matrix.stack }}" validate

      - name: Test resource contract
        run: terraform -chdir="stacks/${{ matrix.stack }}" test
