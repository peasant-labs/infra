name: Terraform checks

on:
  pull_request:
    paths:
      - ".github/dependabot.yml"
      - ".github/workflows/**"
      - ".terraform-version"
      - "Makefile"
      - "modules/**"
      - "scripts/**"
      - "stacks/**"
  push:
    branches:
      - main
    paths:
      - ".github/dependabot.yml"
      - ".github/workflows/**"
      - ".terraform-version"
      - "Makefile"
      - "modules/**"
      - "scripts/**"
      - "stacks/**"

permissions:
  contents: read

jobs:
  validate:
    name: Validate ${{ matrix.stack }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        stack:
          - village-production
          - pkgs-production
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check production destruction guards
        run: bash scripts/check-production-guards.sh

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize without remote state
        run: terraform -chdir="stacks/${{ matrix.stack }}" init -backend=false -lockfile=readonly

      - name: Validate configuration
        run: terraform -chdir="stacks/${{ matrix.stack }}" validate

      - name: Test resource contract
        run: terraform -chdir="stacks/${{ matrix.stack }}" test
