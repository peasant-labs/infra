name: stringly

# The stringly guard's own tests: the rule fixtures and the end-to-end
# mutations run the real ast-grep, pinned to the exact version the tool
# requires, so the job installs it before go test. Hosted runner on purpose,
# as for the dispatcher: the tool's tests must not need the pool.

on:
  pull_request:
    paths:
      - "stringly/**"
      - ".github/workflows/stringly.yml"
  push:
    branches:
      - main
    paths:
      - "stringly/**"
      - ".github/workflows/stringly.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: stringly
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: stringly/go.mod
          cache-dependency-path: stringly/go.sum

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4

      # The exact version stringly asserts (astgrep.RequiredVersion). The tests
      # fail, never skip, without it.
      - name: Install ast-grep
        run: |
          npm install --global @ast-grep/cli@0.51.2
          ast-grep --version

      - name: Formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: |
          go vet ./...
          go vet -tags stringly_stub ./cmd/stringly/

      - name: Test
        run: go test ./...
