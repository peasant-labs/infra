# Builds, pushes, and keylessly signs the runner container image on Quay.
#
# This workflow is the ORG's trust anchor for CI. The image is published to the
# peasant-labs Quay namespace and every routed repository ultimately runs code
# from it, so the recipe and its signing identity live here in infra rather than
# in any personal dotfiles repository. A rename or a private flip on a personal
# repo would otherwise break verification org-wide.
#
# The signature is keyless (Sigstore): Fulcio binds it to this workflow's OIDC
# identity and Rekor logs it, so consumers verify the image without a stored key.
# The identity consumers pin is:
#
#   https://github.com/peasant-labs/infra/.github/workflows/runner-image.yml@refs/heads/main
#
# CUTOVER WARNING: the consuming NixOS module pins BOTH the image digest and
# that signer identity. They must move in the same commit, and the module must
# not be switched to a digest this workflow has not signed, or pull-and-verify
# fails and no runner starts.
#
# Manual dispatch on purpose: publishing an image is a deliberate act, and the
# digest this workflow reports is the one the module pins. The digest changes
# with every build, so pin the new one; a tag push is not a re-publish.
name: Runner image

on:
  workflow_dispatch:

concurrency:
  group: runner-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    permissions:
      contents: read
      id-token: write
    name: build, sign, push
    runs-on: ubuntu-26.04
    outputs:
      digest: ${{ steps.verify.outputs.digest }}
    env:
      IMAGE: quay.io/peasant-labs/github-runner
      IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/runner-image.yml@${{ github.ref }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      # This repository's Actions policy allows GitHub-owned actions plus
      # hashicorp/setup-terraform and nothing else, so sigstore/cosign-installer
      # cannot be used here: a workflow referencing a non-allow-listed action
      # fails at startup, before any job runs. The binary is installed inline
      # instead and pinned by SHA-256, which is a stronger guarantee than the
      # action's own version check. To bump it:
      #   gh api repos/sigstore/cosign/releases/tags/v<COSIGN_VERSION> \
      #     --jq '.assets[] | select(.name=="cosign-linux-amd64").digest'
      - name: Install cosign
        env:
          COSIGN_VERSION: v3.0.6
          COSIGN_SHA256: c956e5dfcac53d52bcf058360d579472f0c1d2d9b69f55209e256fe7783f4c74
        run: |
          set -euo pipefail
          bin_dir="$RUNNER_TEMP/cosign-bin"
          mkdir -p "$bin_dir"
          curl -fsSL --retry 3 \
            -o "$bin_dir/cosign" \
            "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          echo "${COSIGN_SHA256}  ${bin_dir}/cosign" | sha256sum -c -
          chmod 0755 "$bin_dir/cosign"
          echo "${bin_dir}" >> "$GITHUB_PATH"
          "${bin_dir}/cosign" version

      - name: Log in to Quay
        env:
          QUAY_ROBOT_TOKEN: ${{ secrets.QUAY_ROBOT_TOKEN }}
        run: echo "$QUAY_ROBOT_TOKEN" | docker login quay.io --username 'peasant-labs+builder' --password-stdin

      - name: Build
        working-directory: runner-image
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^ARG RUNNER_VERSION=([^[:space:]]+)$/\1/p' Containerfile)"
          test -n "$version"
          echo "runner_version=$version" >> "$GITHUB_ENV"
          docker build --file Containerfile --tag "${IMAGE}:${version}" .

      - name: Push and resolve the stored digest
        run: |
          set -euo pipefail
          docker push "${IMAGE}:${runner_version}"

          # Quay re-serializes the manifest on the fly per Accept media type,
          # and the converted form is not addressable by digest. Hash the served
          # bytes and accept only a digest the registry itself resolves.
          repository="${IMAGE#quay.io/}"
          url="https://quay.io/v2/${repository}/manifests/${runner_version}"
          digest=""
          accept=""
          for candidate_accept in \
            application/vnd.docker.distribution.manifest.v2+json \
            application/vnd.oci.image.manifest.v1+json; do
            curl -fsS -H "Accept: ${candidate_accept}" "${url}" -o "${RUNNER_TEMP}/manifest.json"
            candidate="sha256:$(sha256sum "${RUNNER_TEMP}/manifest.json" | awk '{print $1}')"
            if curl -fsS -o /dev/null -H "Accept: ${candidate_accept}" \
                "https://quay.io/v2/${repository}/manifests/${candidate}"; then
              digest="${candidate}"
              accept="${candidate_accept}"
              break
            fi
          done
          test -n "${digest}"
          echo "digest=${digest}" >> "$GITHUB_ENV"
          echo "manifest media type: ${accept}"

      - name: Sign
        run: cosign sign --yes "${IMAGE}@${digest}"

      - name: Verify the signature
        id: verify
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE}@${digest}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          {
            echo "### Runner image published"
            echo ""
            echo "- tag: \`${IMAGE}:${runner_version}\`"
            echo "- digest: \`${digest}\`"
            echo "- signature identity: \`${IDENTITY}\`"
            echo ""
            echo "Pin the digest in modules/nixos/services/github-runner/default.nix."
          } >> "$GITHUB_STEP_SUMMARY"

  prepare:
    needs: [publish]
    if: github.repository == 'peasant-labs/infra' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.ref == 'refs/heads/main'
    name: prepare candidate pin
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      push: ${{ steps.prepare.outputs.push }}
      digest: ${{ steps.prepare.outputs.digest }}
      base_sha: ${{ steps.prepare.outputs.base_sha }}
      commit_sha: ${{ steps.prepare.outputs.commit_sha }}
      expected_head: ${{ steps.prepare.outputs.expected_head }}
      pr_number: ${{ steps.prepare.outputs.pr_number }}
      title: ${{ steps.prepare.outputs.title }}
      body: ${{ steps.prepare.outputs.body }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare and verify candidate digest bundle
        id: prepare
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/prepare-runner-image-digest-pr.sh

      - name: Upload verified digest bundle
        if: steps.prepare.outputs.push == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: runner-image-digest-bundle
          path: ${{ runner.temp }}/runner-image-bundle
          if-no-files-found: error
          overwrite: true
          retention-days: 1

      - name: Summary
        if: always() && (steps.prepare.outputs.push == 'true' || steps.prepare.outputs.push == 'false')
        run: |
          {
            echo "### Candidate digest handoff"
            echo ""
            echo "- digest: \`${{ steps.prepare.outputs.digest }}\`"
            echo "- base commit: \`${{ steps.prepare.outputs.base_sha }}\`"
            echo "- push required: \`${{ steps.prepare.outputs.push }}\`"
            echo "- candidate commit: \`${{ steps.prepare.outputs.commit_sha }}\`"
            echo "- known remote head: \`${{ steps.prepare.outputs.expected_head }}\`"
            echo "- open PR: \`${{ steps.prepare.outputs.pr_number }}\`"
            if [ "${{ steps.prepare.outputs.push }}" = "true" ] && [ -z "${{ steps.prepare.outputs.expected_head }}" ]; then
              echo "- status: \`bootstrap pending\` (remote branch \`automation/runner-image-digest\` does not exist; update-only slice does not create it)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.prepare.outputs.push }}" = "true" ] && [ -z "${{ steps.prepare.outputs.expected_head }}" ]; then
            echo "::notice::Bootstrap pending: remote branch automation/runner-image-digest does not exist; skipping push and PR creation."
          fi

  update-pr:
    needs: [prepare]
    if: github.repository == 'peasant-labs/infra' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.ref == 'refs/heads/main' && needs.prepare.outputs.push == 'true' && needs.prepare.outputs.expected_head != ''
    name: update runner-image digest PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download verified digest bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: runner-image-digest-bundle
          path: bundle

      - name: Fetch prepared candidate branch
        run: git fetch --no-tags bundle/runner-image-digest.bundle refs/heads/automation/runner-image-digest:refs/heads/automation/runner-image-digest

      - name: Mint the releaser App token
        id: mint
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.PEASANT_RELEASER_CLIENT_ID }}
          private-key: ${{ secrets.PEASANT_RELEASER_APP_PRIVATE_KEY }}
          owner: peasant-labs
          repositories: infra
          permission-contents: write
          permission-pull-requests: write

      - name: Push candidate branch with exact lease
        id: push
        if: needs.prepare.outputs.expected_head != ''
        env:
          APP_TOKEN: ${{ steps.mint.outputs.token }}
          EXPECTED_HEAD: ${{ needs.prepare.outputs.expected_head }}
        run: |
          git -c credential.helper='!f() { echo "username=x-access-token"; echo "password=${APP_TOKEN}"; }; f' push --force-with-lease="refs/heads/automation/runner-image-digest:${EXPECTED_HEAD}" origin refs/heads/automation/runner-image-digest:refs/heads/automation/runner-image-digest

      - name: Open the runner-image digest PR
        if: steps.push.outcome == 'success' && needs.prepare.outputs.push == 'true' && needs.prepare.outputs.expected_head != '' && needs.prepare.outputs.pr_number == '' && needs.prepare.outputs.title != '' && needs.prepare.outputs.body != ''
        env:
          GH_TOKEN: ${{ steps.mint.outputs.token }}
          TITLE: ${{ needs.prepare.outputs.title }}
          BODY: ${{ needs.prepare.outputs.body }}
        run: gh pr create --head automation/runner-image-digest --base main --title "${TITLE}" --body "${BODY}"

      - name: Update the runner-image digest PR
        if: steps.push.outcome == 'success' && needs.prepare.outputs.push == 'true' && needs.prepare.outputs.expected_head != '' && needs.prepare.outputs.pr_number != '' && needs.prepare.outputs.title != '' && needs.prepare.outputs.body != ''
        env:
          GH_TOKEN: ${{ steps.mint.outputs.token }}
          TITLE: ${{ needs.prepare.outputs.title }}
          BODY: ${{ needs.prepare.outputs.body }}
        run: gh pr edit --title "${TITLE}" --body "${BODY}" -- automation/runner-image-digest
