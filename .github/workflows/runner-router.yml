name: Runner router

# One source of truth for pool routing. Callers use it as a job:
#
#   determine-runner:
#     uses: peasant-labs/infra/.github/workflows/runner-router.yml@<reviewed-40-character-commit-sha>
#     with:
#       fallback: '["ubuntu-24.04"]'
#     secrets:
#       RUNNER_STATUS_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
#
# and route with runs-on: ${{ fromJson(needs.determine-runner.outputs.runner) }}.
# The called job itself always runs on ubuntu-latest, never on the pool, and
# uses no third-party actions.
#
# Inputs:
#   fallback   JSON label array for runs-on when the pool is unavailable
#              (required).
#   labels     JSON array of labels the pool carries (default
#              '["self-hosted","linux","x64","microvm"]'). Returned unchanged when the
#              pool is chosen.
#   required_slots
#              How many pool slots the calling run uses at once (default 1).
#              The pool is chosen only when max_capacity - assigned_jobs
#              leaves at least this many free slots. Must be a positive
#              integer; anything else warns and falls back with reason
#              'query-failed'. A caller whose jobs run at once passes its
#              demand (a matrix that places four jobs passes 4).
# Outputs:
#   runner     the label array for the caller's runs-on (pool set or fallback).
#   pool       'true' when the pool was chosen, else 'false', so callers can
#              condition pool-only adaptations on it.
#   reason     'pool-online' | 'pool-busy' | 'pool-stale' | 'query-failed', so
#              a silent regression to the fallback stays visible.
#              'pool-busy' means the pool is healthy and fresh but has fewer
#              free slots than 'required_slots', including a request larger
#              than the pool's max_capacity; with the default of 1 it means
#              every slot is taken.
#              'pool-stale' means the pool-health record is older than the
#              freshness window, unhealthy, or unparseable. 'query-failed'
#              covers a missing token (expected on fork PRs, notice-level,
#              not an outage), a failed variable read (including a record
#              that was never published), and an invalid 'labels' or
#              'required_slots' input.
#
# Behaviour: the fallback is written to the outputs before the pool check, so
# any abort still yields a runnable label set. The pool is online when the
# dispatcher's health record (repository variable RUNNER_POOL_HEALTH in
# peasant-labs/infra) is healthy, fresher than 5 minutes, and has room for
# the calling run. A record without max_capacity keeps the pre-capacity
# behaviour and routes by health alone. This replaces probing for an online
# runner: a scale set reports no registered runners while idle, so a runner
# list is not a pool-availability signal. The check is bounded (timeout 30s);
# a failure keeps the fallback and warns with the captured error, while a
# missing token (expected on fork PRs) is notice-level.

on:
  workflow_call:
    inputs:
      fallback:
        description: >-
          JSON label array for runs-on when the pool is unavailable
          (for example '["ubuntu-24.04"]').
        required: true
        type: string
      labels:
        description: >-
          JSON array of labels to select when the pool is available.
        required: false
        default: '["self-hosted","linux","x64","microvm"]'
        type: string
      required_slots:
        description: >-
          How many pool slots the calling run will use at once.
        required: false
        default: 1
        type: number
    secrets:
      RUNNER_STATUS_TOKEN:
        description: >-
          Token with repository variables read access; map it explicitly from the caller.
        required: true
    outputs:
      runner:
        description: The label array for the caller's runs-on.
        value: ${{ jobs.pick.outputs.runner }}
      pool:
        description: "'true' when the pool was chosen, else 'false'."
        value: ${{ jobs.pick.outputs.pool }}
      reason:
        description: "'pool-online' | 'pool-busy' | 'pool-stale' | 'query-failed'."
        value: ${{ jobs.pick.outputs.reason }}

permissions:
  contents: read

jobs:
  pick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runner: ${{ steps.route.outputs.runner }}
      pool: ${{ steps.route.outputs.pool }}
      reason: ${{ steps.route.outputs.reason }}
    steps:
      - name: Pick a runner
        id: route
        env:
          GH_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
          FALLBACK: ${{ inputs.fallback }}
          LABELS: ${{ inputs.labels }}
          REQUIRED_SLOTS: ${{ inputs.required_slots }}
        run: |
          set -euo pipefail
          # Pre-arm the safe default: any abort below still leaves a runnable
          # label set for the caller (GitHub keeps the last-written output).
          {
            echo "runner<<RUNNER_ROUTER_EOF"
            echo "${FALLBACK}"
            echo "RUNNER_ROUTER_EOF"
            echo "pool=false"
            echo "reason=query-failed"
          } >> "$GITHUB_OUTPUT"
          if ! printf '%s' "${LABELS}" | jq -e 'type == "array" and length > 0 and all(.[]; type == "string")' >/dev/null 2>&1; then
            echo "::warning::invalid 'labels' input (must be a non-empty JSON array of strings); using the fallback runner"
            echo "chosen: ${FALLBACK} (pool=false, reason=query-failed)"
            exit 0
          fi
          if ! [[ "${REQUIRED_SLOTS:-}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::warning::invalid 'required_slots' input (must be a positive integer); using the fallback runner"
            echo "chosen: ${FALLBACK} (pool=false, reason=query-failed)"
            exit 0
          fi
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::notice::RUNNER_STATUS_TOKEN is unavailable (expected on fork PRs); using the fallback runner"
            echo "online runners: 0 (token unavailable)"
            echo "chosen: ${FALLBACK} (pool=false, reason=query-failed)"
            exit 0
          fi
          err_file="$(mktemp)"
          # The dispatcher publishes one pool-health record per queue cycle:
          # a repository variable whose value is a JSON object with an RFC3339
          # timestamp (whole seconds), listener_healthy, job counters, and the
          # pool's max_capacity. Freshness, health and free capacity decide
          # pool availability; the runner list is not consulted because an
          # idle scale set has no registered runners.
          if health=$(timeout 30s gh api repos/peasant-labs/infra/actions/variables/RUNNER_POOL_HEALTH \
              --jq '.value' 2>"${err_file}"); then
            if printf '%s' "${health}" | jq -e --argjson now "$(date -u +%s)" '
                  .listener_healthy == true
                  and ((($now - (.timestamp | fromdateiso8601)) | fabs) < 300)
                ' >/dev/null 2>&1; then
              # Route only when enough slots stay free for required_slots.
              capacity="$(printf '%s' "${health}" | jq -r --argjson required "${REQUIRED_SLOTS}" \
                '"assigned=\(.assigned_jobs // 0) max=\(.max_capacity // 0) required=\($required)"')"
              if printf '%s' "${health}" | jq -e --argjson required "${REQUIRED_SLOTS}" '
                    ((.max_capacity // 0) | tonumber) <= 0
                    or (((.max_capacity // 0) | tonumber) - ((.assigned_jobs // 0) | tonumber) >= $required)
                  ' >/dev/null 2>&1; then
                {
                  echo "runner<<RUNNER_ROUTER_EOF"
                  echo "${LABELS}"
                  echo "RUNNER_ROUTER_EOF"
                  echo "pool=true"
                  echo "reason=pool-online"
                } >> "$GITHUB_OUTPUT"
                echo "pool health: fresh and healthy (${capacity})"
                echo "chosen: ${LABELS} (pool=true, reason=pool-online)"
              elif printf '%s' "${health}" | jq -e --argjson required "${REQUIRED_SLOTS}" '
                    ((.max_capacity // 0) | tonumber) > 0 and ((.max_capacity // 0) | tonumber) < $required
                  ' >/dev/null 2>&1; then
                echo "reason=pool-busy" >> "$GITHUB_OUTPUT"
                echo "::notice::request for ${REQUIRED_SLOTS} slots exceeds the pool capacity (${capacity}); using the fallback runner"
                echo "chosen: ${FALLBACK} (pool=false, reason=pool-busy)"
              else
                echo "reason=pool-busy" >> "$GITHUB_OUTPUT"
                echo "::notice::pool has fewer free slots than required (${capacity}); using the fallback runner"
                echo "chosen: ${FALLBACK} (pool=false, reason=pool-busy)"
              fi
            else
              echo "reason=pool-stale" >> "$GITHUB_OUTPUT"
              echo "::notice::pool-health record missing, stale or unhealthy; using the fallback runner"
              echo "chosen: ${FALLBACK} (pool=false, reason=pool-stale)"
            fi
          else
            query_err="$(tr '\n' ' ' < "${err_file}")"
            echo "::warning::pool-health query failed (${query_err}); using the fallback runner"
            echo "chosen: ${FALLBACK} (pool=false, reason=query-failed)"
          fi
          rm -f "${err_file}"
      - name: Report chosen runner
        env:
          CHOSEN: ${{ steps.route.outputs.runner }}
          POOL: ${{ steps.route.outputs.pool }}
          REASON: ${{ steps.route.outputs.reason }}
        run: 'echo "chosen: $CHOSEN (pool=$POOL, reason=$REASON)"'
