name: Runner router

# One source of truth for pool routing. Callers use it as a job:
#
#   determine-runner:
#     uses: peasant-labs/infra/.github/workflows/runner-router.yml@runner-router-v1
#     with:
#       fallback: '["ubuntu-24.04"]'
#     secrets:
#       RUNNER_STATUS_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
#
# and route with runs-on: ${{ fromJson(needs.determine-runner.outputs.runner) }}.
# The called job itself always runs on ubuntu-latest, never on the pool, and
# uses no third-party actions.
#
# Inputs:
#   fallback   JSON label array for runs-on when the pool is unavailable
#              (required).
#   labels     JSON array of labels the pool carries (default
#              '["self-hosted","container"]'). Returned unchanged when the
#              pool is chosen.
# Outputs:
#   runner     the label array for the caller's runs-on (pool set or fallback).
#   pool       'true' when the pool was chosen, else 'false', so callers can
#              condition pool-only adaptations on it.
#   reason     'pool-online' | 'pool-stale' | 'query-failed', so a silent
#              regression to the fallback stays visible.
#              'pool-stale' means the pool-health record is missing, older
#              than the freshness window, or unhealthy. 'query-failed' covers
#              a missing token (expected on fork PRs, notice-level, not an
#              outage), an API failure, and an invalid 'labels' input.
#
# Behaviour: the fallback is written to the outputs before the pool check, so
# any abort still yields a runnable label set. The pool is online when the
# dispatcher's health record (repository variable RUNNER_POOL_HEALTH in
# peasant-labs/infra) is healthy and fresher than 5 minutes. This replaces
# probing for an online runner: a scale set reports no registered runners
# while idle, so a runner list is not a pool-availability signal. The check is
# bounded (timeout 30s); a failure keeps the fallback and warns with the
# captured error, while a missing token (expected on fork PRs) is
# notice-level.

on:
  workflow_call:
    inputs:
      fallback:
        description: >-
          JSON label array for runs-on when the pool is unavailable
          (for example '["ubuntu-24.04"]').
        required: true
        type: string
      labels:
        description: >-
          JSON array of labels an online pool runner must carry.
          Matched case-insensitively.
        required: false
        default: '["self-hosted","container"]'
        type: string
    secrets:
      RUNNER_STATUS_TOKEN:
        description: >-
          Token for the org runner readiness probe; map it explicitly from
          the caller.
        required: true
    outputs:
      runner:
        description: The label array for the caller's runs-on.
        value: ${{ jobs.pick.outputs.runner }}
      pool:
        description: "'true' when the pool was chosen, else 'false'."
        value: ${{ jobs.pick.outputs.pool }}
      reason:
        description: "'pool-online' | 'pool-stale' | 'query-failed'."
        value: ${{ jobs.pick.outputs.reason }}

permissions:
  contents: read

jobs:
  pick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runner: ${{ steps.route.outputs.runner }}
      pool: ${{ steps.route.outputs.pool }}
      reason: ${{ steps.route.outputs.reason }}
    steps:
      - name: Pick a runner
        id: route
        env:
          GH_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
          FALLBACK: ${{ inputs.fallback }}
          LABELS: ${{ inputs.labels }}
        run: |
          set -euo pipefail
          # Pre-arm the safe default: any abort below still leaves a runnable
          # label set for the caller (GitHub keeps the last-written output).
          {
            echo "runner<<RUNNER_ROUTER_EOF"
            echo "${FALLBACK}"
            echo "RUNNER_ROUTER_EOF"
            echo "pool=false"
            echo "reason=query-failed"
          } >> "$GITHUB_OUTPUT"
          if ! printf '%s' "${LABELS}" | jq -e 'type == "array" and length > 0 and all(.[]; type == "string")' >/dev/null 2>&1; then
            echo "::warning::invalid 'labels' input (must be a non-empty JSON array of strings); using the fallback runner"
            echo "chosen: ${FALLBACK} (pool=false, reason=query-failed)"
            exit 0
          fi
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::notice::RUNNER_STATUS_TOKEN is unavailable (expected on fork PRs); using the fallback runner"
            echo "online runners: 0 (token unavailable)"
            echo "chosen: ${FALLBACK} (pool=false, reason=query-failed)"
            exit 0
          fi
          err_file="$(mktemp)"
          # The dispatcher publishes one pool-health record per queue cycle:
          # a repository variable whose value is a JSON object with an RFC3339
          # timestamp (whole seconds), listener_healthy, and job counters.
          # Freshness and health decide pool availability; the runner list is
          # not consulted because an idle scale set has no registered runners.
          if health=$(timeout 30s gh api repos/peasant-labs/infra/actions/variables/RUNNER_POOL_HEALTH \
              --jq '.value' 2>"${err_file}"); then
            if printf '%s' "${health}" | jq -e --argjson now "$(date -u +%s)" '
                  .listener_healthy == true
                  and ((($now - (.timestamp | fromdateiso8601)) | fabs) < 300)
                ' >/dev/null 2>&1; then
              {
                echo "runner<<RUNNER_ROUTER_EOF"
                echo "${LABELS}"
                echo "RUNNER_ROUTER_EOF"
                echo "pool=true"
                echo "reason=pool-online"
              } >> "$GITHUB_OUTPUT"
              echo "pool health: fresh and healthy"
              echo "chosen: ${LABELS} (pool=true, reason=pool-online)"
            else
              echo "reason=pool-stale" >> "$GITHUB_OUTPUT"
              echo "::notice::pool-health record missing, stale or unhealthy; using the fallback runner"
              echo "chosen: ${FALLBACK} (pool=false, reason=pool-stale)"
            fi
          else
            query_err="$(tr '\n' ' ' < "${err_file}")"
            echo "::warning::pool-health query failed (${query_err}); using the fallback runner"
            echo "chosen: ${FALLBACK} (pool=false, reason=query-failed)"
          fi
          rm -f "${err_file}"
      - name: Report chosen runner
        env:
          CHOSEN: ${{ steps.route.outputs.runner }}
          POOL: ${{ steps.route.outputs.pool }}
          REASON: ${{ steps.route.outputs.reason }}
        run: 'echo "chosen: $CHOSEN (pool=$POOL, reason=$REASON)"'
