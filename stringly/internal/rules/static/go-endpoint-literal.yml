# Rule 13: an API path written as a Go literal. Rendered with the repository's
# endpoint prefixes; the second document, present only when the repository
# names router files, flags every "/…" argument mounted in those files, where
# patterns are relative to an r.Route prefix and carry none.
id: go-endpoint-literal
language: go
severity: warning
message: an API endpoint path is written as a literal.
metadata:
  why: >-
    the path restates a route the schema contract declares; when the route changes, this
    copy keeps serving or calling the old path and only a runtime 404 shows it.
  fix: >-
    use the route member from github.com/peasant-labs/schema/route: rt.Pattern() or
    rt.MuxPattern() to mount a handler, and the generated path builder (for example
    route.VillageGetPullRequestAttachmentPath(owner, name, number)) to call one. If the pinned
    schema has no route package yet, re-pin to the release that has it. The rule accepts a
    stringly-allow marker with a reason.
utils:
  text-literal:
    any: [{ kind: interpreted_string_literal }, { kind: raw_string_literal }]
rule:
  matches: text-literal
  regex: '^["`]([A-Z]+ )?(https?://[^/"`]+)?{{ .PrefixRegex }}(/|["`?#]|$)'
{{- if .MountFiles }}
---
id: go-endpoint-literal{{ .PartSeparator }}mount-file
language: go
severity: warning
message: a route is mounted from a literal path in a router file.
files:
{{- range .MountFiles }}
  - '{{ . }}'
{{- end }}
utils:
  text-literal:
    any: [{ kind: interpreted_string_literal }, { kind: raw_string_literal }]
rule:
  matches: text-literal
  regex: '^["`]/'
  inside: { kind: argument_list, inside: { kind: call_expression } }
{{- end }}
