# Rule 15: the Go twin of data-path-literal. Rendered with the repository's
# data directory names.
id: go-data-path-literal
language: go
severity: warning
message: a fixture or data file path is written as a literal at its point of use.
metadata:
  why: >-
    the path is spelled out where it is used, often more than once (in the read and again in
    an error message); moving or renaming the file leaves a copy that points nowhere.
  fix: >-
    name the path once in a const next to the code that owns the data (or embed the file with
    //go:embed), and use that name everywhere, including in error messages. The rule accepts
    a stringly-allow marker with a reason.
utils:
  text-literal:
    any: [{ kind: interpreted_string_literal }, { kind: raw_string_literal }]
rule:
  matches: text-literal
  any:
    - regex: '^["`](\.{1,2}/)?([\w@.%-]+/)*{{ .DataDirRegex }}/?["`]$'
    - regex: '(^["`]|[\s(=:,])(\.{1,2}/)?([\w@.%$\{\}-]+/)*{{ .DataDirRegex }}/[^\s"`]+'
    - all:
        - regex: '\.(ya?ml|json|jsonl|toml|txt|csv|golden)["`]$'
        - inside:
            kind: argument_list
            inside:
              kind: call_expression
              has: { field: function, regex: '^os\.(ReadFile|Open|OpenFile)$' }
  not:
    inside:
      stopBy: end
      kind: const_spec
