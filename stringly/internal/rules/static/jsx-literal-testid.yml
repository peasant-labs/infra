# Rule 1: a data-testid attribute whose value is a string literal.
id: jsx-literal-testid
language: tsx
severity: warning
message: a data-testid attribute is set from a string literal.
metadata:
  why: >-
    the test that queries this element repeats the same string, so renaming one side leaves
    the other matching nothing, and the test fails late or passes against the wrong element.
  fix: >-
    render the id from a typed test-id set exported next to this component (for example
    data-testid={HomeTestId.Row.wire}) and query the same member in the test. An id with a
    variable part is a template with a substitution built from that set. The rule accepts a
    stringly-allow marker with a reason.
rule:
  kind: jsx_attribute
  all:
    - has: { kind: property_identifier, regex: '^data-testid$' }
    - has:
        any:
          - kind: string
          - kind: jsx_expression
            has:
              any:
                - kind: string
                - kind: template_string
                  not: { has: { kind: template_substitution } }
