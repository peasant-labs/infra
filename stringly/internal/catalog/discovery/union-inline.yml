# A string member of a union type anywhere else: an interface or object-type
# property, a parameter, a generic argument, a nested union.
id: stringly-discover-union-inline
language: tsx
severity: hint
message: string member of an inline literal union
utils:
  union-chain:
    any: [{ kind: union_type }, { kind: parenthesized_type }]
rule:
  kind: string
  inside:
    kind: literal_type
    all:
      - inside:
          stopBy: { not: { matches: union-chain } }
          kind: union_type
      - not:
          inside:
            stopBy: { not: { matches: union-chain } }
            kind: type_alias_declaration
