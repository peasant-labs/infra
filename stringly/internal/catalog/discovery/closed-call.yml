# A member of a closed() set: the first argument of a call whose callee is the
# identifier `closed`. SET is the nearest enclosing variable's name and NAME the
# property that holds the call, when there is one.
id: stringly-discover-closed-call
language: tsx
severity: hint
message: closed() member
utils:
  wire:
    any:
      - kind: string
      - kind: template_string
        not: { has: { kind: template_substitution } }
    nthChild: 1
    inside:
      kind: arguments
      inside:
        kind: call_expression
        has: { field: function, kind: identifier, regex: '^closed$' }
  named-by-property:
    inside:
      kind: arguments
      inside:
        kind: call_expression
        inside:
          kind: pair
          has: { field: key, pattern: $NAME }
rule:
  all:
    - matches: wire
    - any:
        - all:
            - inside:
                stopBy: end
                kind: variable_declarator
                has: { field: name, kind: identifier, pattern: $SET }
            - any:
                - matches: named-by-property
                - matches: wire
        - matches: wire
