# Cases for config.Load. Each case writes `files` into a temporary directory,
# writes `config` as .stringly.yaml there, and loads it.
#
# want      the loaded values (valid cases). Omitted keys are not compared.
# exempted  Exempted(rule, file) results on the loaded config.
# error     substrings the failure must contain (refused cases). Every refusal
#           is a failure with non-empty what, why, where and fix.

cases:
  - name: defaults-applied
    files: {web/a.ts: "", server/a.go: ""}
    config: |
      version: 1
      ts: {roots: [web]}
      go: {roots: [server]}
    want:
      baseline: .stringly-baseline.yaml
      tsRoots: [web]
      goRoots: [server]
      prefixes: [/api/v1]
      dataDirs: [testdata, fixtures, __fixtures__, captures]

  - name: explicit-settings-kept
    files: {frontend/a.ts: "", backend/internal/router/router.go: ""}
    config: |
      version: 1
      baseline: ci/stringly-baseline.yaml
      ts: {roots: [frontend]}
      schema: {module: github.com/peasant-labs/schema}
      endpoints:
        prefixes: ["/api/v1", "/internal/v2"]
        callees: [api, client.get]
        mountFiles: [backend/internal/router/router.go]
      dataDirs: [golden]
    want:
      baseline: ci/stringly-baseline.yaml
      tsRoots: [frontend]
      prefixes: [/api/v1, /internal/v2]
      callees: [api, client.get]
      mountFiles: [backend/internal/router/router.go]
      dataDirs: [golden]
      schemaModule: github.com/peasant-labs/schema

  - name: root-dot-accepted
    files: {a.ts: ""}
    config: |
      version: 1
      ts: {roots: ["."]}
    want:
      tsRoots: ["."]

  - name: exempt-generated-files-for-closed-set
    files:
      backend/gen/db.go: |
        // Code generated by sqlc. DO NOT EDIT.
        package gen
      backend/gen/sub/q.go: |
        // Code generated by sqlc. DO NOT EDIT.
        package sub
      backend/main.go: "package main\n"
    config: |
      version: 1
      go: {roots: [backend]}
      exempt:
        - rule: go-closed-set-literal
          paths: [backend/gen/**]
          reason: sqlc output, regenerated from the queries
        - rule: "*"
          paths: [backend/gen]
          reason: sqlc output, regenerated from the queries
    exempted:
      - {rule: go-closed-set-literal, file: backend/gen/db.go, want: true}
      - {rule: go-closed-set-literal, file: backend/gen/sub/q.go, want: true}
      - {rule: go-json-key-assert, file: backend/gen/sub/q.go, want: true}
      - {rule: go-closed-set-literal, file: backend/main.go, want: false}

  - name: exempt-hand-written-file-for-other-rule
    files: {frontend/scripts/visual/lib/test-id-selector.mjs: "export const s = 1;\n"}
    config: |
      version: 1
      ts: {roots: [frontend]}
      exempt:
        - rule: testid-selector-string
          paths: [frontend/scripts/visual/lib/test-id-selector.mjs]
          reason: the one place a test-id selector string is built
    exempted:
      - {rule: testid-selector-string, file: frontend/scripts/visual/lib/test-id-selector.mjs, want: true}
      - {rule: jsx-literal-testid, file: frontend/scripts/visual/lib/test-id-selector.mjs, want: false}
      - {rule: testid-selector-string, file: frontend/scripts/visual/lib/other.mjs, want: false}

  - name: refuses-unknown-key
    files: {web/a.ts: ""}
    config: |
      version: 1
      ts: {roots: [web]}
      exclude: [web/gen]
    error: ["field exclude not found", "unknown keys"]

  - name: refuses-other-version
    files: {web/a.ts: ""}
    config: |
      version: 2
      ts: {roots: [web]}
    error: ["`version: 2`", "only `version: 1`"]

  - name: refuses-empty-file
    config: ""
    error: ["is empty"]

  - name: refuses-no-language
    config: |
      version: 1
    error: ["neither a `ts` nor a `go` section"]

  - name: refuses-language-without-roots
    config: |
      version: 1
      go: {roots: []}
    error: ["`go` section", "has no roots"]

  - name: refuses-missing-root
    config: |
      version: 1
      ts: {roots: [frontend]}
    error: ["\"frontend\"", "is not a directory"]

  - name: refuses-absolute-root
    config: |
      version: 1
      ts: {roots: [/srv/web]}
    error: ["is absolute"]

  - name: refuses-root-outside-config-directory
    config: |
      version: 1
      ts: {roots: [../web]}
    error: ["leaves the config's directory"]

  - name: refuses-baseline-not-clean
    files: {web/a.ts: ""}
    config: |
      version: 1
      baseline: ./ci/../baseline.yaml
      ts: {roots: [web]}
    error: ["not in clean form"]

  - name: refuses-endpoint-prefix-without-slash
    files: {web/a.ts: ""}
    config: |
      version: 1
      ts: {roots: [web]}
      endpoints: {prefixes: [api/v1]}
    error: ["\"api/v1\"", "does not start with `/`"]

  - name: refuses-callee-that-is-not-an-identifier
    files: {web/a.ts: ""}
    config: |
      version: 1
      ts: {roots: [web]}
      endpoints: {callees: ["api()"]}
    error: ["\"api()\"", "not a TS identifier"]

  - name: refuses-data-dir-with-slash
    files: {web/a.ts: ""}
    config: |
      version: 1
      ts: {roots: [web]}
      dataDirs: [test/data]
    error: ["\"test/data\"", "single directory name"]

  - name: refuses-schema-module-with-version
    files: {web/a.ts: ""}
    config: |
      version: 1
      ts: {roots: [web]}
      schema: {module: github.com/peasant-labs/schema@v0.51.0}
    error: ["not a module path"]

  - name: refuses-unknown-exempt-rule
    files: {web/a.ts: ""}
    config: |
      version: 1
      ts: {roots: [web]}
      exempt:
        - rule: testid-selector
          paths: [web/a.ts]
          reason: the one place a selector is built
    error: ["\"testid-selector\"", "does not exist", "stringly show rules"]

  - name: refuses-exempt-without-reason
    files: {web/a.ts: ""}
    config: |
      version: 1
      ts: {roots: [web]}
      exempt:
        - rule: testid-selector-string
          paths: [web/a.ts]
          reason: "   "
    error: ["has no reason"]

  - name: refuses-exempt-without-paths
    files: {web/a.ts: ""}
    config: |
      version: 1
      ts: {roots: [web]}
      exempt:
        - rule: testid-selector-string
          reason: the one place a selector is built
    error: ["lists no paths"]

  - name: refuses-malformed-exempt-glob
    files: {web/a.ts: ""}
    config: |
      version: 1
      ts: {roots: [web]}
      exempt:
        - rule: testid-selector-string
          paths: ["web/[a.ts"]
          reason: the one place a selector is built
    error: ["malformed glob"]

  - name: refuses-closed-set-exempt-on-hand-written-file
    files:
      web/gen/types.ts: |
        // Code generated by schema-gen. DO NOT EDIT.
        export type A = "a" | "b";
      web/gen/handwritten.ts: |
        export const isA = (v: string) => v === "a";
    config: |
      version: 1
      ts: {roots: [web]}
      exempt:
        - rule: closed-set-literal
          paths: [web/gen/*.ts]
          reason: generated contract types
    error: ["hand-written file web/gen/handwritten.ts", "Code generated", "DO NOT EDIT"]

  - name: refuses-all-rules-exempt-on-hand-written-file
    files:
      server/legacy/old.go: "package legacy\n"
    config: |
      version: 1
      go: {roots: [server]}
      exempt:
        - rule: "*"
          paths: [server/legacy]
          reason: old code we do not want to look at
    error: ["hand-written file server/legacy/old.go"]

# MatchPath cases: pattern, file, and whether it matches.
globs:
  - {pattern: web/gen/**, file: web/gen/a.ts, match: true}
  - {pattern: web/gen/**, file: web/gen/deep/b.ts, match: true}
  - {pattern: web/gen/**, file: web/generated/a.ts, match: false}
  - {pattern: "**/*.gen.ts", file: a.gen.ts, match: true}
  - {pattern: "**/*.gen.ts", file: web/src/a.gen.ts, match: true}
  - {pattern: "**/*.gen.ts", file: web/src/a.ts, match: false}
  - {pattern: web/*.ts, file: web/a.ts, match: true}
  - {pattern: web/*.ts, file: web/sub/a.ts, match: false}
  - {pattern: web/gen, file: web/gen/a.ts, match: true}
  - {pattern: web/gen, file: web/generated/a.ts, match: false}
  - {pattern: web/a.ts, file: web/a.ts, match: true}
  - {pattern: web/a.ts, file: web/a.tsx, match: false}
